      txt = 'Session ' + (main.length <= 3 ? main.join(', ') : main[0].charAt(0) + nums[0] + '–' + nums[nums.length - 1]);
    }
    if (extra.length) txt += (txt ? ' · ' : '') + extra.join(' · ');
    return esc(txt);
  }
  var lastN = -1, nowSlot = '';
  function render() {
    var by = {}, n = 0, hit = [];
    PROG.papers.forEach(function (p) { if (match(p)) { (by[p.s] = by[p.s] || []).push(p); hit.push(p); n++; } });
    var narrowed = !!(st.scope !== 'all' || st.track || st.tag || st.q);
    var autoExp = narrowed && n <= 8;
    var h = '', agenda = st.scope === 'star';
    if (agenda) {
      h = n ? agendaHTML(hit) : '<div class="empty">' + (starCount() ? T('empty') : T('agEmpty')) + '</div>' + defaultsLink();
    } else {
      var slots = [], cur = null;
      PROG.sessions.forEach(function (s) {
        var ps = by[s.code]; if (!ps) return;
        var key = s.day + ' ' + s.start;
        if (!cur || cur.key !== key) { cur = { key: key, day: s.day, start: s.start, end: s.end, sess: [], n: 0 }; slots.push(cur); }
        if (s.end > cur.end) cur.end = s.end;
        cur.sess.push([s, ps]); cur.n += ps.length;
      });
      var curDay = 0, dayN = {};
      slots.forEach(function (sl) { dayN[sl.day] = (dayN[sl.day] || 0) + sl.n; });
      slots.forEach(function (sl) {
        if (sl.day !== curDay) {
          if (curDay) h += '</section>';
          curDay = sl.day;
          h += '<section class="dayg"><h2 class="dayh"><b>' + T('dow')[(sl.day - 15 + 7) % 7] + '</b><span>' + T('dmy')(sl.day) + '</span>' +
            (NOW.date === '2026-11-' + sl.day ? '<span class="tdy">' + T('today') + '</span>' : '') +
            '<span class="dh-s" data-ds="' + sl.day + '" hidden></span>' +
            (sig() !== EMPTY && Object.keys(dayN).length > 1 ? '<span class="dn">' + T('nPapers')(dayN[sl.day]) + '</span>' : '') + '</h2>';
        }
        var kS = 'slot:' + sl.key, openS = isOpen(kS, narrowed || nowSlot === sl.key || slots.length === 1);
        h += '<details class="slotbox" data-day="' + sl.day + '" data-s="' + sl.start + '" data-e="' + sl.end + '" data-k="' + kS + '"' + (openS ? ' open' : '') + '><summary><span class="sl-t">' + sl.start + '–' + sl.end + '<span class="sl-s" data-ss="' + sl.key + '" hidden></span></span><span class="sl-n">' + slotLabel(sl) + '</span></summary><div class="sl-body">';
        sl.sess.forEach(function (x) {
          var s = x[0], ps = x[1], kE = 'sess:' + s.code;
          if (sl.sess.length === 1 && ps.length === 1 && isKey(s)) { h += '<div class="sess solo">' + paperHTML(ps[0], !narrowed || autoExp) + '</div>'; return; }
          var openE = isOpen(kE, narrowed || sl.sess.length === 1);
          h += '<details class="sess" data-k="' + kE + '"' + (openE ? ' open' : '') + '><summary class="sess-head">' +
            '<span class="code"><span class="trk">' + esc(trackL(s.track)) + '</span> ' + esc(s.code) + ' <span class="ss-s" data-cs="' + esc(s.code) + '" hidden></span></span>' +
            '<span class="topic">' + hl(topicOf(s)) + '</span>' +
            '<span class="meta">' + PIN + esc(roomOf(s)) + ' · ' + T('nPapers')(ps.length) + (s.chair ? ' · chair ' + esc(s.chair) : '') + '</span></summary>' +
            ps.map(function (p) { return paperHTML(p, autoExp || (!narrowed && ps.length === 1)); }).join('') + '</details>';
        });
        h += '</div></details>';
      });
      if (curDay) h += '</section>';
      if (!h) h = '<div class="empty">' + T('empty') + '</div>';
    }
    var L = $('list');
    L.innerHTML = h;
    L.classList.remove('swap'); void L.offsetWidth; L.classList.add('swap');
    var filtered = sig() !== EMPTY;
    var names = [st.day ? T('days')[st.day - 15][1] : '', st.track ? trackL(st.track) : '', st.tag ? tagL(st.tag) : '', st.q ? '“' + esc(st.q) + '”' : ''].filter(Boolean).join(' + ');
    $('countbar').hidden = !filtered;
    $('btn-clear-p').hidden = !filtered;
    $('count').innerHTML = T('matched')(n) + (names ? '<span class="what">' + names + '</span>' : '');
    $('filt-count').innerHTML = T('matched')(n);
    markNow();
    starMarks();
    syncQx();
  }
  /* 现在的位置：只精确到时间段。正在进行的时间段加青色框和“进行中”；
     没有正在进行的（会前、茶歇、午饭、晚上），在对应位置插一条细线写当前时间。
     时间取设备时钟换算成海牙时间；换算失败、有筛选条件、会议结束后都不显示细线。 */
  /* “全部”列表里的收藏数：每天、每个时间段、每个场次各有几个。统计的是该时段的全部收藏，不受当前筛选影响。 */
  function starMarks() {
    var bySlot = {}, bySess = {}, byDay = {};
    PROG.papers.forEach(function (p) {
      if (!isStar(p.id)) return;
      var s = S[p.s], k = s.day + ' ' + s.start;
      bySlot[k] = (bySlot[k] || 0) + 1; bySess[s.code] = (bySess[s.code] || 0) + 1; byDay[s.day] = (byDay[s.day] || 0) + 1;
    });
    var els = $('list').querySelectorAll('[data-ss], [data-cs], [data-ds]');
    for (var i = 0; i < els.length; i++) {
      var e = els[i], n = e.hasAttribute('data-ss') ? bySlot[e.getAttribute('data-ss')] : e.hasAttribute('data-cs') ? bySess[e.getAttribute('data-cs')] : byDay[e.getAttribute('data-ds')];
      e.textContent = n ? '★ ' + n : ''; e.hidden = !n;
    }
  }
  function markNow() {
    var L = $('list'), i, old = L.querySelectorAll('.nowline, .nowtag'), was = L.querySelectorAll('.is-now'), dim = L.querySelectorAll('.past');
    for (i = 0; i < old.length; i++) old[i].parentNode.removeChild(old[i]);
    for (i = 0; i < was.length; i++) was[i].classList.remove('is-now');
    for (i = 0; i < dim.length; i++) dim[i].classList.remove('past');
    NOW = nlNow();
    if (!NOW.ok || NOW.date > '2026-11-18') return;
    var blocks = L.querySelectorAll('[data-s]'); if (!blocks.length) return;
    function line(txt) { var d = document.createElement('div'); d.className = 'nowline'; d.textContent = txt; return d; }
    if (NOW.date < '2026-11-16') { if (sig() === EMPTY) L.insertBefore(line(T('nowBefore')(NOW.date.slice(5), NOW.hm)), L.firstChild); return; }
    var day = +NOW.date.slice(8), last = null, live = 0, next = null, later = null, upNext = null;
    for (i = 0; i < blocks.length; i++) {
      var b = blocks[i], bd = +b.getAttribute('data-day'), bs = b.getAttribute('data-s'), be = b.getAttribute('data-e');
      if (st.scope === 'star') {
        if (bd < day || (bd === day && be <= NOW.hm)) { var el = b; do { el.classList.add('past'); el = el.nextElementSibling; } while (el && !el.hasAttribute('data-s')); }
        else if (!upNext && (bd > day || bs > NOW.hm)) upNext = b;
      }
      if (bd === day) {
        last = b;
        if (bs <= NOW.hm && NOW.hm < be) {
          live++; b.classList.add('is-now');
          var tg = document.createElement('span'); tg.className = 'nowtag'; tg.textContent = T('live');
          (b.querySelector('.sl-t') || b).appendChild(tg);
        } else if (!next && bs > NOW.hm) next = b;
      } else if (bd > day && !later) later = b;
    }
    if (upNext) { var nt = document.createElement('span'); nt.className = 'nowtag nexttag'; nt.textContent = T('next'); upNext.appendChild(nt); }
    if (live || sig() !== EMPTY) return;
    var ln = line(T('nowAt')(NOW.hm));
    if (next) next.parentNode.insertBefore(ln, next);
    else if (last) last.parentNode.appendChild(ln);
    else if (later) later.parentNode.parentNode.insertBefore(ln, later.parentNode);
  }
  setInterval(markNow, 30000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) markNow(); });
  document.addEventListener('toggle', function (e) { var d = e.target; if (d && d.dataset && d.dataset.k) OPEN[d.dataset.k] = d.open; }, true);

  function setTopH() { var t = document.querySelector('.top'); if (t && t.offsetHeight) document.documentElement.style.setProperty('--top-h', t.offsetHeight + 'px'); }

  /* ---------- 返回与记忆 ----------
     views: 每个页签（全部 / 我的日程）离开时的展开状态和滚动位置，切回来时恢复
     base : 开始筛选或搜索前的展开状态和滚动位置，筛选清空时恢复
     jump : 从日程点进论文卡片前的完整状态，点返回条或系统返回时恢复 */
  function copy(o) { var r = {}; for (var k in o) r[k] = o[k]; return r; }
  var EMPTY = '0|||';
  function sig() { return [st.day, st.track, st.tag, st.q].join('|'); }
  function snapView() { return { sig: sig(), open: copy(OPEN), y: window.scrollY }; }
  var views = {}, base = {}, jump = null;
  try { history.scrollRestoration = 'manual'; } catch (e) {}
  function keyOf(el) { return el.getAttribute('data-k') || 'g:' + el.getAttribute('data-goto'); }
  function anchor() {
    var top = (document.querySelector('.top') || {}).offsetHeight || 0, els = $('list').querySelectorAll('[data-k], [data-goto]'), fb = null;
    for (var i = 0; i < els.length; i++) {
      var r = els[i].getBoundingClientRect(); if (!r.height) continue;
      if (r.top >= top) return { k: keyOf(els[i]), top: r.top };

    }
    return fb;
  }
  function reanchor(a) {
    if (!a) return;
    var els = $('list').querySelectorAll('[data-k], [data-goto]');
    for (var i = 0; i < els.length; i++) if (keyOf(els[i]) === a.k) { window.scrollBy(0, els[i].getBoundingClientRect().top - a.top); return; }
  }
  function showBar() { var b = $('btn-back'); b.hidden = !jump; b.textContent = T('back'); }
  function applyLang(initial) {
    var a = initial ? null : anchor();
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.title = T('title'); $('h1').textContent = T('title');
    $('q').placeholder = T('ph');
    var b = $('btn-lang'); b.textContent = T('toLang'); b.setAttribute('aria-label', T('toLangLabel'));
    $('lab-day').textContent = T('labDay'); $('lab-track').textContent = T('labTrack'); $('lab-tag').textContent = T('labTag');
    $('btn-clear').textContent = T('clear'); $('btn-clear-p').textContent = T('clear'); $('btn-done').textContent = T('done');
    $('legal').innerHTML = T('legal');
    showStore();
    $('foot').textContent = META[lang];
    chips(); render(); setTopH(); showBar(); reanchor(a);
  }
  function applyFilter(change) {
    ghost = {};
    if (sig() === EMPTY) base[st.scope] = snapView();
    change();
    chips();
    var b = base[st.scope];
    if (sig() === EMPTY && b) { OPEN = b.open; delete base[st.scope]; render(); window.scrollTo(0, b.y); }
    else { resetOpen(); render(); if (sig() !== EMPTY) window.scrollTo(0, 0); }
  }
  function switchScope(target) {
    if (target === st.scope) return;
    ghost = {};
    views[st.scope] = snapView();
    if (jump) { jump = null; showBar(); }
    st.scope = target;
    var v = views[target];
    chips();
    if (v && v.sig === sig()) { OPEN = v.open; render(); window.scrollTo(0, v.y); }
    else { resetOpen(); render(); }
  }
  function paperEl(id) { var els = $('list').querySelectorAll('details.paper'); for (var i = 0; i < els.length; i++) if (els[i].getAttribute('data-k') === 'p:' + id) return els[i]; return null; }
  function jumpToPaper(id) {
    var p = null; PROG.papers.forEach(function (x) { if (x.id === id) p = x; }); if (!p) return;
    var s = S[p.s];
    ghost = {};
    views.star = snapView();
    jump = { st: copy(st), q: $('q').value, open: copy(OPEN), y: window.scrollY, now: nowSlot, base: base.star };
    var keep = views.all && views.all.sig === EMPTY ? copy(views.all.open) : {};
    st = { day: 0, scope: 'all', q: '', track: '', tag: '' }; $('q').value = ''; setQ('');
    OPEN = keep; OPEN['slot:' + s.day + ' ' + s.start] = true; OPEN['sess:' + s.code] = true; OPEN['p:' + id] = true;
    delete base.all;
    chips(); render(); showBar();
    var el = paperEl(id);
    if (el) { el.scrollIntoView({ block: 'start' }); el.classList.add('hit'); }
    try { if (location.hash !== '#paper') location.hash = 'paper'; } catch (e) {}
  }
  function goBack(fromHistory) {
    if (!jump) return;
    var j = jump; jump = null;
    views.all = snapView();
    st = j.st; $('q').value = j.q; setQ(j.q); OPEN = j.open; nowSlot = j.now; if (j.base) base.star = j.base;
    chips(); render(); showBar(); window.scrollTo(0, j.y);
    if (!fromHistory) { try { if (location.hash === '#paper') history.back(); } catch (e) {} }
  }
  window.addEventListener('hashchange', function () { if (jump && location.hash !== '#paper') goBack(true); });

  /* 收藏的防误触：取消后底部出现“撤销”，连续取消会累计，一次撤销全部恢复；
     在“我的日程”里取消的行先原地变灰，不立刻消失，下面的行不会顶上来被接着误点。 */
  var ghost = {}, undo = [], toastT = null;
  function setStar(id, on) {
    if (on) { if (DEFAULT[id]) delete stars[id]; else stars[id] = 1; }
    else { if (DEFAULT[id]) stars[id] = 0; else delete stars[id]; }
    saveStars();
  }
  function paintStars() {
    var els = document.querySelectorAll('[data-star]');
    for (var i = 0; i < els.length; i++) { var on = isStar(els[i].getAttribute('data-star')); els[i].setAttribute('aria-pressed', on); els[i].textContent = on ? '★' : '☆'; }
  }
  function showToast() {
    var t = $('toast'); clearTimeout(toastT);

    $('toast-t').textContent = T('removed')(undo.length); $('btn-undo').textContent = T('undo');
    t.hidden = false; toastT = setTimeout(function () { undo = []; t.hidden = true; }, 7000);
  }
  function syncQx() { var x = $('btn-qx'); if (x) x.hidden = !$('q').value; }
  function findNow() {
    NOW = nlNow(); var day = +NOW.date.slice(8), inConf = /^2026-11-1[678]$/.test(NOW.date), tgt = '';
    PROG.sessions.forEach(function (x) { if (!tgt && (inConf ? (x.day === day && x.end > NOW.hm) || x.day > day : true)) tgt = x.day + ' ' + x.start; });
    return { inConf: inConf, tgt: tgt };
  }
  function scrollToNow(smooth) { var el = document.querySelector('.slotbox[data-k="slot:' + nowSlot + '"]'); if (el) el.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' }); }

  /* 会议三天内打开页面，直接展开并定位到当前或下一个时间段 */
  var first = findNow();
  if (first.inConf && first.tgt) nowSlot = first.tgt;
  applyLang(true);
  if (nowSlot) setTimeout(function () { scrollToNow(false); }, 0);
  window.addEventListener('resize', setTopH);

  var qt; $('q').addEventListener('input', function () { var v = this.value; syncQx(); clearTimeout(qt); qt = setTimeout(function () { applyFilter(function () { setQ(v); }); }, 120); });
  /* 按键盘上的回车 / 搜索：立刻应用当前输入并收起键盘 */
  $('q').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.keyCode !== 13) return;
    e.preventDefault(); clearTimeout(qt);
    var v = this.value; if (v.trim() !== st.q) applyFilter(function () { setQ(v); });
    this.blur();
  });
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button');
    if (!t) { var g = e.target.closest('[data-goto]'); if (g) jumpToPaper(g.getAttribute('data-goto')); return; }
    if (t.closest('summary')) e.preventDefault();
    if (t.dataset.day !== undefined) { var d = +t.dataset.day; applyFilter(function () { st.day = st.day === d ? 0 : d; }); }
    else if (t.dataset.scope) switchScope(t.dataset.scope);
    else if (t.dataset.track) { var tr = t.dataset.track; applyFilter(function () { st.track = st.track === tr ? '' : tr; }); }
    else if (t.dataset.tag) { var tg = t.dataset.tag; applyFilter(function () { st.tag = st.tag === tg ? '' : tg; }); }
    else if (t.id === 'btn-filt' || t.id === 'btn-done') { var f = $('filt'); f.hidden = t.id === 'btn-done' ? true : !f.hidden; $('btn-filt').setAttribute('aria-expanded', !f.hidden); setTopH(); }
    else if (t.id === 'btn-clear' || t.id === 'btn-clear-p') { applyFilter(function () { st.day = 0; st.track = ''; st.tag = ''; setQ(''); $('q').value = ''; }); }
    else if (t.dataset.star) {
      var id = t.dataset.star, was = isStar(id), ui = undo.indexOf(id);
      setStar(id, !was);
      if (was && ui < 0) undo.push(id); else if (!was && ui >= 0) undo.splice(ui, 1);
      chips();
      if (st.scope === 'star') { if (was) ghost[id] = 1; render(); } else { paintStars(); starMarks(); }
      var bs = document.querySelectorAll('[data-star]');
      for (var bi = 0; bi < bs.length; bi++) if (bs[bi].getAttribute('data-star') === id) { bs[bi].classList.remove('pop', 'unpop'); void bs[bi].offsetWidth; bs[bi].classList.add(was ? 'unpop' : 'pop'); }
      showToast();
    }
    else if (t.id === 'btn-qx') { clearTimeout(qt); $('q').value = ''; syncQx(); applyFilter(function () { setQ(''); }); $('q').focus(); }
    else if (t.id === 'btn-defaults') { for (var dk2 in DEFAULT) if (stars[dk2] === 0) delete stars[dk2]; saveStars(); ghost = {}; chips(); render(); }
    else if (t.id === 'btn-undo') {
      undo.forEach(function (x) { setStar(x, true); }); undo = []; showToast(); chips();
      if (st.scope === 'star') render(); else { paintStars(); starMarks(); }
    }
    else if (t.id === 'btn-now') { jump = null; base = {}; views = {}; ghost = {}; nowSlot = findNow().tgt; st.day = 0; st.scope = 'all'; st.track = ''; st.tag = ''; setQ(''); $('q').value = ''; resetOpen(); chips(); render(); showBar(); scrollToNow(true); }
    else if (t.id === 'btn-lang') { lang = lang === 'zh' ? 'en' : 'zh'; try { localStorage.setItem('ccs26-public-lang', lang); } catch (err) {} applyLang(false); }
    else if (t.id === 'btn-back') goBack(false);
  });
  document.addEventListener('keydown', function (e) {
    var g = e.target && e.target.getAttribute && e.target.getAttribute('data-goto');
    if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); jumpToPaper(g); }
  });
})();
