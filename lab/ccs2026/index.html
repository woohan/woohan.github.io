,"speaker":"Sudheendra Raghav Neela","s":"C4","pos":3,"sum":"操作系统的文件事件通知机制，如 Linux 的 inotify、Windows 的 ReadDirectoryChangesW、macOS 的 FSEvents，是一个被低估的侧信道：无特权进程订阅通知，就能从文件访问模式推断其他进程的行为。本文系统刻画并在三个系统上实现攻击。Graz Daniel Gruss 组。","basis":"abs"},{"id":"B#389","title":"Practice Makes (Im)Perfect: A Look Back at Benchmarking Practices for Microarchitectural Side-Channel Attacks","authors":"Iliana Fayolle (Univ. Lille, CNRS, Inria), Antoine Geimer (Univ. Lille, CNRS, Inria), Daniel De Almeida Braga (Univ. Rennes, CNRS), Clémentine Maurice (Univ. Lille, CNRS, Inria)","speaker":"Iliana Fayolle","s":"C4","pos":4,"sum":"回顾微架构侧信道研究的 benchmark 做法。早期论文用隐蔽信道带宽或对朴素 AES、RSA 的密钥恢复当指标，后来被沿用甚至直接比较原始数字。本文指出这些做法的问题并给出更严谨的评测建议。","basis":"abs"},{"id":"B#3999","title":"Square Root of All Evil: The Dangers of Falcon's Superfluous Square Roots","authors":"Kaihara Hiroto (Kyoto University), Calvin Abou Haidar (NTT Social Informatics Laboratories), Mehdi Tibouchi (NTT Social Informatics Laboratories), Masayuki Abe (NTT Social Informatics Laboratories)","speaker":"Calvin Abou Haidar","s":"C4","pos":5,"sum":"后量子签名 Falcon 实现里多余的开方运算会泄露信息，可用于恢复密钥。NTT Mehdi Tibouchi 等。","basis":"title"},{"id":"B#4244","title":"HAWK with Hint: Algebraic Key Recovery from Side-Channel Leakage","authors":"Byoungchan Chi (Korea University), Changmin Lee (Korea University), Inhun Lee (Korea University)","speaker":"Byoungchan Chi","s":"C4","pos":6,"sum":"后量子签名 HAWK 的密钥恢复：把侧信道泄露当作 hint，用代数方法求解私钥。高丽大学。","basis":"title"},{"id":"B#4740","title":"When Module Lattice Leaks: Horizontal Fusion Attacks on ML-DSA Implementation","authors":"Yuhan Zhao (Nanjing University of Science and Technology), Dalin He (Nanjing University of Science and Technology), Wei Cheng (Nanjing University of Science and Technology), Yuejun Liu (Nanjing University of Science and Technology), Jingdian Ming (Nanjing University of Science and Technology), Yongbin Zhou (Nanjing University of Science and Technology)","speaker":"Yuhan ZHAO","s":"C4","pos":7,"sum":"对后量子签名标准 ML-DSA 实现的侧信道攻击，标题称 horizontal fusion，应是在单条能量迹内融合多个中间值的泄露来恢复密钥。南京理工。","basis":"title"},{"id":"B#7552","title":"Mitigating Ciphertext Side-Channel Attacks against TEE-Shielded Neural Networks","authors":"Qianhui Dai (Shanghai Jiao Tong University), Zhen Huang (Shanghai Jiao Tong University), Guoxing Chen (Shanghai Jiao Tong University), Yan Meng (Shanghai Jiao Tong University), Yinqian Zhang (Southern University of Science and Technology), Haojin Zhu (Shanghai Jiao Tong University)","speaker":"QIANHUI DAI","s":"C4","pos":8,"sum":"TEE 保护的神经网络会受密文侧信道攻击，即攻击者观察加密内存的密文变化模式。本文给出缓解方案。上交 Haojin Zhu 组。","basis":"title"},{"id":"A#1376","title":"Effects of Explanations on Driver Situation Awareness Under Physical Adversarial Attacks in Automated Driving: A Driving Simulator Study","authors":"Rao Li (The Pennsylvania State University), Jiazheng Gao (The Pennsylvania State University), Yiqi Zhang (The Pennsylvania State University), Aiping Xiong (The Pennsylvania State University)","speaker":"Rao Li","s":"C5","pos":1,"sum":"驾驶模拟器实验：自动驾驶遭到物理对抗攻击时，给驾驶员的解释信息如何影响其态势感知和接管。Penn State。","basis":"title"},{"id":"B#255","title":"A Mixed-Methods Analysis of Account Creation & Authentication Inaccessibility for Blind and Low Vision Users","authors":"Adryana Hutchinson (The George Washington University), Smirity Kaushik (The George Washington University), Matthias Fassl (The George Washington University), Adam J. Aviv (The George Washington University)","speaker":"Adryana Hutchinson","s":"C5","pos":2,"sum":"盲人和低视力用户在注册账号和认证环节遇到的无障碍问题，定量加定性混合研究。George Washington Adam Aviv 组。","basis":"title"},{"id":"B#439","title":"'It Scams In The Family:' GenAI Voice Cloning Scams among Sighted and Families with Blind or Low Vision Members","authors":"Filipo Sharevski (DePaul University), Jennifer Vander Loop (DePaul University)","speaker":"Filipo Sharevski","s":"C5","pos":3,"sum":"生成式 AI 语音克隆诈骗，冒充家人声音，对有盲人或低视力成员的家庭的影响。用户研究。","basis":"title"},{"id":"B#443","title":"'That's a Red Flag!': How Young Adult Instagram Users Assess Sexual Threats and Perceive Nudity Protection in Direct Messages","authors":"Anna Calmbach (CISPA Helmholtz Center for Information Security), Carolyn Guthoff (CISPA Helmholtz Center for Information Security), Matthias Fassl (The George Washington University), Katharina Krombholz (CISPA Helmholtz Center for Information Security)","speaker":"Anna Calmbach","s":"C5","pos":4,"sum":"年轻成人 Instagram 用户如何判断私信里的性威胁，以及如何看待平台的裸露内容保护功能。CISPA Katharina Krombholz 组。","basis":"title"},{"id":"B#863","title":"Evaluating Ongoing Access Attacks on the Web","authors":"Arkaprabha Bhattacharya (Cornell Tech), Rosanna Bellini (New York University), Thomas Ristenpart (University of Toronto), Nicola Dell (Cornell Tech)","speaker":"","s":"C5","pos":5,"sum":"账号被入侵后，攻击者能否在受害者改密码之后仍保持访问，例如靠会话或关联应用。本文评估 Web 服务对这种持续访问的防护。Cornell Tech，亲密伴侣监控研究这条线。","basis":"title"},{"id":"B#1329","title":"User Perceptions of Online Age Assurance Mechanisms in the U.S.","authors":"Junho Eum (The George Washington University), Jan Tolsdorf (Max Planck Institute for Security and Privacy (MPI-SP)), Adryana Hutchinson (The George Washington University), Smirity Kaushik (The George Washington University), Adam J. Aviv (The George Washington University)","speaker":"Junho Eum","s":"C5","pos":6,"sum":"美国用户对网络年龄验证机制的看法，背景是多州的年龄验证立法。问卷研究。","basis":"title"},{"id":"B#2507","title":"Do Hackers Dream of Electric Teachers?: A Large-Scale, In-Situ Measurement of Cybersecurity Student Behaviors and Educational Performance with AI Tutors","authors":"Michael Tompkins (Arizona State University), Nihaarika Agarwal (Arizona State University), Ananta Soneji (Arizona State University), Robert Wasinger (Arizona State University), Connor Nelson (Arizona State University), Kevin Leach (Vanderbilt University), Rakibul Hasan (Arizona State University), Adam Doupé (Arizona State University), Daniel Votipka (Tufts University), Yan Shoshitaishvili (Arizona State University), Jaron Mink (Arizona State University)","speaker":"Michael Tompkins","s":"C5","pos":7,"sum":"AI tutor 在网络安全实训课里的实地测量：一学期，309 名学生，14 万多条提问，覆盖几百道 CTF 式练习。关心的是学生怎么用 AI tutor，以及哪种用法与解题成功相关。ASU pwn.college 团队。","basis":"abs"},{"id":"B#5246","title":"Beyond the Prank: The Hidden Expertise of TSS Scambaiters","authors":"Saleh Alsyefi (University of Bristol), Anish Chand (Louisiana State University), Matthew Edwards (University of Bristol), Phani Vadrevu (Louisiana State University)","speaker":"Saleh Alsyefi","s":"C5","pos":8,"sum":"访谈 17 名专门对付技术支持诈骗的 scambaiter，即主动与骗子周旋的志愿者，了解他们的动机、骗子的运作方式，以及有效反制的经验。结论是这群人积累了未被记录的专业知识，值得反诈研究借鉴。","basis":"abs"},{"id":"A#134","title":"Dependency Triad: A Metric to Quantify the Dependencies Between Attributes for Local Differential Privacy","authors":"Sandaru Jayawardana (The University of Sydney), Sennur Ulukus (University of Maryland), Ming Ding (CSIRO), Kanchana Thilakarathna (The University of Sydney)","speaker":"Sandaru Jayawardana","s":"C6","pos":1,"sum":"多维 LDP 采集中，属性之间的相关性会造成额外泄露。已有的相关性泄露分析要么需要准确先验，要么属性一多就算不动。Dependency Triad 是一个度量属性间依赖强度的新指标，用来估计这部分泄露并指导隐私预算分配。","basis":"abs"},{"id":"A#307","title":"Private Direct Preference Optimization for LLM Alignment","authors":"Yangfan Jiang (National University of Singapore), Fei Wei (Alibaba Group), Ergute Bao (Inria), Xiaokui Xiao (National University of Singapore), Yaliang Li (Alibaba Group), Bolin Ding (Alibaba Group)","speaker":"","s":"C6","pos":2,"sum":"DPO 对齐 LLM 时，prompt 和候选回答往往是公开的，真正敏感的是标注者偏好哪一个。作者提出 preference privacy，一种 label-DP 风格的定义，只保护偏好这一位，从而避免通用 DP-SGD 的过量噪声和有偏更新。Xiaokui Xiao 组。","basis":"abs"},{"id":"A#1308","title":"Towards Effective and Stealthy Data Poisoning Attacks to Locally Differentially Private Triangle Counting Protocols","authors":"Xinyu Li (Xi'an Jiaotong University), Xuebin Ren (Xi'an Jiaotong University), Shusen Yang (Xi'an Jiaotong University), Cong Zhao (Xi'an Jiaotong University)","speaker":"Xinyu Li","s":"C6","pos":3,"sum":"对 LDP 图分析里的三角形计数协议做数据投毒：恶意用户上报伪造的邻接信息来操纵计数结果，标题强调攻击既有效又难被检测。西安交大 Xuebin Ren 组。","basis":"title"},{"id":"A#1985","title":"Piquant$varepsilon$: Private Quantile Estimation in the Two-Server Model","authors":"Hannah Keller (Max Planck Institute for Security and Privacy), Jacob Imola (University of Waterloo), Fabrizio Boninsegna (University of Padova), Rasmus Pagh (University of Copenhagen), Amrita Roy Chowdhury (University of Michigan)","speaker":"Hannah Keller","s":"C6","pos":4,"sum":"分布式场景下私有地估计多个分位数，不依赖可信服务器。采用 two-server 模型加 MPC，恶意安全，精度达到 central DP 水平，同时避开通用 MPC 在大值域上的开销。MPI-SP、Waterloo、哥本哈根合作。","basis":"abs"},{"id":"A#2510","title":"Efficient Single-Round Obfuscation of Search and Result Patterns in Searchable Encryption","authors":"Tung Le (Virginia Tech), Thang Hoang (Virginia Tech)","speaker":"Thang Hoang","s":"C6","pos":5,"sum":"FROST，差分隐私的可搜索加密，同时混淆 search pattern 和 result pattern，抵御已知的统计类 leakage-abuse 攻击。卖点是单轮搜索，服务端无需保存每次查询的状态。","basis":"abs"},{"id":"A#2532","title":"Robust Estimation of Sparse Numerical Vectors under Local Differential Privacy","authors":"Puning Zhao (Shenzhen Campus of Sun Yat-sen University), Zhikun Zhang (Zhejiang University), Shaowei Wang (Guangzhou University), Sheng Yue (Shenzhen Campus of Sun Yat-sen University), Bangzhou Xin (National Interdisciplinary Research Center of Engineering Physics), Tianhang Zheng (Zhejiang University), Pengfei Zhang (Anhui University of Science and Technology), Xiaochun Cao (Shenzhen Campus of Sun Yat-sen University)","speaker":"","s":"C6","pos":6,"sum":"LDP 下多项目用户的抗投毒均值估计：每个用户的向量有 m 个非零坐标。方法 RPC 是服务器下发随机二值向量，用户把数据投影上去再裁剪，以此限制攻击者的操纵空间。","basis":"abs"},{"id":"B#89","title":"Revisit Location Privacy Protection: A Service Failure Perspective","authors":"Shaowei Wang (Guangzhou University), Han Wu (University of Southampton), Yun Peng (Guangzhou University), Puning Zhao (Shenzhen Campus of Sun Yat-sen University), Wenqi Ren (Shenzhen Campus of Sun Yat-sen University), Changyu Dong (Guangzhou University), Jin Li (Guangzhou University), Jian Weng (Guangzhou University)","speaker":"","s":"C6","pos":7,"sum":"提出 Ploda。出发点是 LDP 和 geo-indistinguishability 在实用隐私预算下有不小的 service failure 概率，即上报位置偏离真实位置超过阈值 r 的概率可达 20% 以上。Ploda 用有界范围混淆、dummy 注入、上报匿名化三者组合，在满足差分隐私的同时把混淆范围压到零失败，典型场景下每个用户不到 0.5 个 dummy。","basis":"abs"},{"id":"B#162","title":"A Graph-Based Framework for Extending Metric Differential Privacy Mechanisms","authors":"Ruiyao Liu (University of North Texas), Chenxi Qiu (University of North Texas)","speaker":"Chenxi Qiu","s":"C6","pos":8,"sum":"在大值域或细粒度域上直接构造 mDP 机制算不动，于是先在一小组 seed 记录上设计机制，再扩展到整个域。作者把这种扩展提炼成基于图的通用框架，给出保证全局 mDP 成立的三个条件。","basis":"abs"},{"id":"A#1524","title":"'We just went with what seemed the best supported': Lessons on Cryptographic Practices in Securing Microcontrollers from Embedded CTFs","authors":"Zheyuan Ma (University at Buffalo), Xi Tan (University of Colorado Colorado Springs), Gaoxiang Liu (University at Buffalo), Alex Eastman (University at Buffalo), Md Armanuzzaman (University of Texas at El Paso), Ziming Zhao (Northeastern University)","speaker":"Haipeng Cai","s":"C7","pos":1,"sum":"从嵌入式 CTF 比赛中总结开发者在微控制器上使用密码学的实际做法和常见错误。","basis":"title"},{"id":"B#52","title":"'Setting Up TLS Authentication Was Hell': A Usability Study of Client Certificate Authentication","authors":"Abubakar Sadiq Shittu (University of Tennessee, Knoxville), Clay Shubert (University of Tennessee, Knoxville), John Sadik (University of Tennessee, Knoxville), Scott Ruoti (University of Tennessee, Knoxville)","speaker":"John Sadik","s":"C7","pos":2,"sum":"mutual TLS 客户端证书认证的可用性研究。46 名计算机高年级和研究生被试，属于高技术水平用户，仍然普遍觉得配置很痛苦。用来回答一个老问题：密钥管理难是密码系统固有的，还是具体设计造成的。","basis":"abs"},{"id":"B#86","title":"Investigating Novice Researchers' Perceptions of Research Privacy Within LLM-Assisted Workflows","authors":"Shuning Zhang (Tsinghua University), Changxi Wen (Tsinghua University), Eve He (University of Wisconsin–Madison), Ying Ma (The University of Melbourne), Robert Xiao (University of British Columbia), Xin Yi (Tsinghua University), Hewu Li (Tsinghua University)","speaker":"Shuning Zhang","s":"C7","pos":3,"sum":"访谈研究：44 名新手研究者如何看待在科研流程里使用 LLM 的隐私风险。反直觉的发现是，害怕 idea 泄露反而加重了对 LLM 的依赖，因为大家想靠它抢先发表；同时普遍误以为自己的输入会被海量数据稀释。","basis":"abs"},{"id":"B#102","title":"A Multi-Month Study of Git Commit Signing","authors":"Abubakar Sadiq Shittu (University of Tennessee, Knoxville), John Sadik (University of Tennessee, Knoxville), Scott Ruoti (University of Tennessee, Knoxville)","speaker":"John Sadik","s":"C7","pos":4,"sum":"Git commit 签名的三个月纵向研究，22 名学生充当初级开发者。观察他们配置和日常使用签名的真实体验，解释为什么这个 2012 年就有的功能至今很少人用。","basis":"abs"},{"id":"B#2340","title":"Understanding Users' Perceptions of Client-Side Modifications and Anti-Cheat Engines in Social XR","authors":"Iman Mohammadi (University of California, Irvine), Mutahar Ali (University of California, Irvine), Habiba Farrukh (University of California, Irvine)","speaker":"Mutahar Ali","s":"C7","pos":5,"sum":"社交 XR 平台里用户对客户端修改，即外挂或 mod，和反作弊引擎的看法。访谈研究。","basis":"title"},{"id":"B#2506","title":"Batten the Hatches: Cybersecurity with Military Mariners","authors":"Ryan Von Brock (Georgia Institute of Technology), Anna Raymaker (Georgia Institute of Technology), Animesh Chhotaray (Georgia Institute of Technology), Frank Li (Georgia Institute of Technology), Saman Zonouz (Georgia Institute of Technology), Raheem Beyah (Georgia Institute of Technology)","speaker":"Ryan Von Brock","s":"C7","pos":6,"sum":"军队里的网络安全实践研究，对象是军事海员。军队有巨额资源、严格的指挥链和特殊的作业环境，但此前几乎没有系统研究其人员如何处理网络安全。","basis":"abs"},{"id":"B#4846","title":"Papers, Peons, and Power: The Challenges of Implementing Privacy Regulations in a Developing Country","authors":"Kenneth Thilakarathna (University of Kelaniya), Dilanga Harshani (University of Colombo), Nathan Malkin (New Jersey Institute of Technology)","speaker":"Nathan Malkin","s":"C7","pos":7,"sum":"在发展中国家落实隐私法规的现实困难，涉及文书、人力和权力关系。定性研究。","basis":"title"},{"id":"A#269","title":"TurboRetry: Mitigating Large-Scale QUIC Handshake Floods with Off-the-Shelf DPU Offloading","authors":"Jiahao Wu (Institute of Computing Technology, Chinese Academy of Sciences), Heng Pan (Computer Network Information Center, Chinese Academy of Sciences), Kai Lv (Institute of Computing Technology, Chinese Academy of Sciences), Zhenyu Li (Institute of Computing Technology, Chinese Academy of Sciences), Yanbiao Li (Computer Network Information Center, Chinese Academy of Sciences), Gaogang Xie (Computer Network Information Center, Chinese Academy of Sciences)","speaker":"Heng Pan","s":"C8","pos":1,"sum":"QUIC 握手洪泛攻击迫使服务器做大量密码运算。QUIC 内置的 Retry 机制在大流量下自身就成为瓶颈。TurboRetry 把 Retry 处理卸载到现成的 DPU 智能网卡上。","basis":"abs"},{"id":"A#802","title":"An Ounce of Prevention Is Worth a Pound of Cure: A Pre-filtering Framework to Against Asymmetric DoS in Group Authentication at the IoT Edge","authors":"Yizhao Zhou (Hangzhou Dianzi University), Qingxiang Xu (Hangzhou Dianzi University), Yingjie Xia (Hangzhou Dianzi University)","speaker":"Yizhao Zhou","s":"C8","pos":2,"sum":"IoT 边缘的群组认证容易受非对称 DoS 攻击，即攻击者用低成本请求消耗验证方大量算力。本文提出预过滤框架。","basis":"title"},{"id":"B#259","title":"Rethinking Isolation in RPKI: Cross-Publication-Origin Attacks on RPKI Validation","authors":"Qi Wang (Tsinghua University), Jianjun Chen (Tsinghua University), TaoFei Guo (Peking University), Minghao Zhang (Tsinghua University), Yuheng Zhang (Tsinghua University), Jingcheng Yang (Tsinghua University)","speaker":"Qi Wang","s":"C8","pos":3,"sum":"RPKI 验证中的跨发布点攻击：一个发布点的恶意内容能影响验证器对其他发布点数据的处理。重新审视 RPKI 的隔离假设。","basis":"title"},{"id":"B#455","title":"Weaponizing QNAME Minimization: Infrastructure-Free DNS Amplification via Resolver Orchestration","authors":"Jianhao Li (Xi'an Jiaotong University), Jialong Zhang (Xi'an Jiaotong University), Jiawei Ding (Xi'an Jiaotong University), Jianfeng Li (Xi'an Jiaotong University), Ziqian Liu (China Telecom), Wei Wang (Xi'an Jiaotong University), Zhou Su (Xi'an Jiaotong University), Xiaobo Ma (Xi'an Jiaotong University)","speaker":"Jianhao Li","s":"C8","pos":4,"sum":"把 DNS 的 QNAME minimization 隐私特性变成放大攻击工具：不需要自建基础设施，靠编排解析器即可。","basis":"title"},{"id":"B#1394","title":"Botnet Boasting: Investigating DDoS Power Proofs","authors":"Maarten Weyns (Delft University of Technology (TU Delft)), Georgios Smaragdakis (Delft University of Technology), Harm Griffioen (Delft University of Technology)","speaker":"Maarten Weyns","s":"C8","pos":5,"sum":"僵尸网络运营者为招揽客户而发布的 DDoS 攻击能力证明，对其做测量与真实性核查。","basis":"title"},{"id":"B#1396","title":"Parade: Unified and Data-Driven Prefix-AS Semantics for BGP Anomaly Detection","authors":"Yunze Wei (Tsinghua University), Xingang Shi (Tsinghua University), Minghao Zhang (Tsinghua University), Zhaozhen Wang (Tsinghua University), Qiang Ma (Zhongguancun Laboratory), Han Zhang (Tsinghua University), Yahui Li (Tsinghua University), Xia Yin (Tsinghua University)","speaker":"Yunze Wei","s":"C8","pos":6,"sum":"BGP 异常检测：用数据驱动方式统一刻画前缀与 AS 的语义关系。","basis":"title"},{"id":"B#1887","title":"Exploiting vulnerabilities at IXP route servers to perform stealth BGP hijacks","authors":"Gabby Rimlinger (Sorbonne Université), Joaquim Pereira (University of Waikato), Matthieu Gouel (nxthdr), Olivier Fourmaux (Sorbonne Université), Timur Friedman (Sorbonne Université), Pedro Marcos (FURG), Cristel Pelsser (UCLouvain), Ronaldo A. Ferreira (UFMS), Kevin Vermeulen (CNRS, Ecole Polytechnique)","speaker":"Gabby RIMLINGER","s":"C8","pos":7,"sum":"互联网交换点（IXP）的 route server 提供可扩展的多边路由交换和基于 BGP community 的精细控制。本文发现其中一些机制可被滥用，实现隐蔽的 BGP 劫持，受害者和常规监测都难以察觉。","basis":"abs"},{"id":"B#3074","title":"NetSynergy: Mitigating Application-layer DDoS via Adaptive Access-Backbone Collaboration","authors":"Junchen Pan (Tsinghua University), Kunpeng He (Tsinghua University), Shengnan Liu (Tsinghua University), Menghao Zhang (Beihang University.), Hu Xie (Sino-Telecom Technology), Lei Zhang (Zhongguancun Laboratory), Yong Cui (Tsinghua University)","speaker":"Junchen Pan","s":"C8","pos":8,"sum":"应用层 DDoS 缓解，让接入网和骨干网自适应协同过滤。","basis":"title"},{"id":"A#253","title":"A Formal Analysis of Signal's Sparse Post-Quantum Ratchet Protocol and its Implementation","authors":"Karthikeyan Bhargavan (Cryspen), Maxime Buyse (Cryspen), Graeme Connell (Signal), Franziskus Kiefer (CE Labs), Rolfe Schmidt (Signal)","speaker":"Rolfe Schmidt","s":"C9","pos":1,"sum":"对 Signal 新加入的后量子棘轮协议 SPQR 及其实现做形式化分析。","basis":"title"},{"id":"A#1329","title":"Formal Security Analysis of the Olvid Messenger","authors":"Noemi Terzo (Max Planck Institute for Security and Privacy (MPI-SP)), Cas Cremers (CISPA Helmholtz Center for Information Security), Ruben Gonzalez (Neodyme AG), Peter Schwabe (Max Planck Institute for Security and Privacy (MPI-SP)), Yuval Yarom (Ruhr University Bochum), Zhiyuan Zhang (Max Planck Institute for Security and Privacy (MPI-SP))","speaker":"Noemi Terzo","s":"C9","pos":2,"sum":"首次对 Olvid 的密码核心做形式化安全分析。Olvid 是法国政府官员包括部长在用的端到端加密通信应用，此前几乎没有独立分析。作者对其认证和密钥建立协议建模并验证。","basis":"abs"},{"id":"B#335","title":"Automated Reasoning for Indistinguishability in the CCSA","authors":"Simon Jeanteur (TU Wien), Matteo Maffei (TU Wien), Laura Kovacs (TU Wien), Michael Rawson (University of Southampton)","speaker":"","s":"C9","pos":3,"sum":"协议安全性质分两类：迹性质如认证，和不可区分性如匿名性。CCSA 是计算模型下的符号化框架。本文为 CCSA 里的不可区分性证明提供自动化推理，减少人工。","basis":"abs"},{"id":"B#724","title":"Bust a Shuffle! A Formal Privacy Analysis of Voting Protocols with Multi-Server Mix Nets","authors":"Alexandre Debant (Université de Lorraine, CNRS, Inria), Robert Künnemann (CISPA Helmholtz Center for Information Security), Johannes Müller (Independent researcher)","speaker":"Alexandre Debant","s":"C9","pos":4,"sum":"对使用多服务器 mixnet 的投票协议做形式化隐私分析，标题暗示找到了问题。","basis":"title"},{"id":"B#952","title":"Secrecy in Squirrel and the Post-Compromise Security of a Ratchet","authors":"Clément Hérouard (Université de Lorraine, CNRS, Inria), Charlie Jacomme (Université de Lorraine, CNRS, Inria), Adrien Koutsos (Inria), Joseph Lallemand (CNRS, Univ. Rennes)","speaker":"Clément Hérouard","s":"C9","pos":5,"sum":"在 Squirrel 证明助手里加入对 secrecy 的推理，并用它证明一个 ratchet 协议的 post-compromise security。与周一 A9 场的 A#2628 同组。","basis":"title"},{"id":"B#3503","title":"Refinement-based Verification of Cryptographic Protocols with Quantitative Values","authors":"Itsaka Rakotonirina (Shielded Technologies), Javier Gomez-Martinez (IMDEA Software Institute), Aoxuan Li (IMDEA Software Institute), Pedro Moreno-Sanchez (IMDEA Software Institute), Clara Schneidewind (MPI-SP)","speaker":"","s":"C9","pos":6,"sum":"带定量值的密码协议验证，基于 refinement。定量值应指概率界或计数器一类，传统符号模型不好处理。只有工具说明，没有摘要。","basis":"title"},{"id":"A#752","title":"When Grammar Guides the Attack: Uncovering Control-Plane Vulnerabilities in LLMs with Structured Output","authors":"Shuoming Zhang (Institute of Computing Technology, Chinese Academy of Sciences), Jiacheng Zhao (Institute of Computing Technology, Chinese Academy of Sciences), Hanyuan Dong (Institute of Computing Technology, Chinese Academy of Sciences), Ruiyuan Xu (Institute of Computing Technology, Chinese Academy of Sciences), Zhicheng Li (Institute of Computing Technology, Chinese Academy of Sciences), Yangyu Zhang (Institute of Computing Technology, Chinese Academy of Sciences), Shuaijiang Li (Institute of Computing Technology, Chinese Academy of Sciences), Yuan Wen (University of Aberdeen), Chunwei Xia (University of Leeds), Zheng Wang (University of Leeds), Xiaobing Feng (Institute of Computing Technology, Chinese Academy of Sciences), Huimin Cui (Institute of Computing Technology, Chinese Academy of Sciences)","speaker":"Shuoming Zhang","s":"D1","pos":1,"sum":"结构化输出带来的新型 jailbreak。grammar-guided decoding 是控制面，攻击者通过 schema 强制的 logit masking 把恶意前缀塞进生成轨迹，模型自己把有害内容续写完。prompt 里看不到恶意文本，所以针对输入的防御都失效。","basis":"abs"},{"id":"A#881","title":"PolyVoice: Exploiting Cluster-Level Vulnerabilities for One-to-Many Impersonation in Speaker Verification Systems","authors":"Yunjie Ge (Wuhan University), Jinlong Jiang (Wuhan University), Yuchen Liu (Wuhan University), Huayi Duan (The Hong Kong University of Science and Technology (Guangzhou)), Shenyi Zhang (Wuhan University), Lingchen Zhao (Wuhan University), Chao Shen (Xi'an Jiaotong University), Qian Wang (Wuhan University)","speaker":"Yunjie Ge","s":"D1","pos":2,"sum":"说话人验证系统的一对多冒充：利用声纹嵌入空间里簇一级的弱点，生成一条能同时匹配多个注册用户的语音，属于 master voice 这条线。","basis":"title"},{"id":"A#1428","title":"Casting the Net! Revisiting MasterFace Impersonation Attacks","authors":"Seunghun Paik (Hanyang University), Sunpill Kim (Sookmyung Women's University), Chanwoo Hwang (Hanyang University), Jae Hong Seo (Hanyang University)","speaker":"Seunghun Paik","s":"D1","pos":3,"sum":"重新审视 MasterFace 攻击，也就是一张人脸匹配很多人。此前认为它在现代人脸识别系统上超不过零努力冒充的 FMR 基线；本文在仅有判决结果、尝试次数受限的现实约束下重新评估，结论是这一判断过于乐观。","basis":"abs"},{"id":"A#1593","title":"PC^2: Politically Controversial Content Generation via Jailbreaking Attacks on GPT-based Text-to-Image Models","authors":"Wonwoo Choi (ADD), Minjae Seo (ETRI), Minkyoo Song (KAIST), Hwanjo Heo (ETRI), Seungwon Shin (KAIST), Myoungsung You (University of Seoul)","speaker":"Minjae Seo","s":"D1","pos":4,"sum":"针对 GPT 系文生图模型的政治类内容 jailbreak，黑盒。利用的弱点是安全过滤器依据语言上下文判断政治敏感度，于是通过改写语境绕过。主要价值是指出政治类有害内容这个评测空白。","basis":"abs"},{"id":"B#1308","title":"The Deception Delta: Adversarial Evaluation of LLM-Based Smart Contract Bytecode Forensics","authors":"Timo Schefold (Landeskriminalamt Baden-Württemberg)","speaker":"Timo Schefold","s":"D1","pos":5,"sum":"评测 LLM 做智能合约字节码取证时会不会被专门设计的欺骗性合约骗过。22 个前沿模型、13 个定制合约、六种 prompt 策略，欺骗使资金抽取行为的检出率平均下降 20 个百分点。测评型工作，统计做得规范。","basis":"abs"},{"id":"B#2092","title":"Finding FAULTs in Architectural Backdoors: Why Trigger Detection Fails Under Real-World Conditions","authors":"David Oygenblik (Georgia Institute of Technology), Teja Akella (Georgia Institute of Technology), Tanmay Gupta (Georgia Institute of Technology), Yizhi Huang (Georgia Institute of Technology), Brendan Saltaformaggio (Georgia Institute of Technology)","speaker":"","s":"D1","pos":6,"sum":"架构后门，即后门藏在模型结构里而不是权重里。从标题看结论是现有的触发器检测方法在真实部署条件下会失效，并分析失效原因。和周三 H1 场的 B#781 ArchProof 是同一个问题的攻防两面。","basis":"title"},{"id":"B#2986","title":"Understanding the Security Boundary of Obfuscation-based On-Device LLM Protection","authors":"Hanyi Zhou (Tsinghua University), Chenyang Li (Tsinghua University), Yuanzhe Pang (Tsinghua University), Ke Xu (Tsinghua University), Mingwei Xu (Tsinghua University), Zhuotao Liu (Tsinghua University)","speaker":"Hanyi Zhou","s":"D1","pos":7,"sum":"端侧 LLM 的 TEE 分割保护：把重计算层混淆后放到 TEE 外的 GPU 上跑。这类方案此前全是启发式设计，屡被攻破；本文想从理论上界定混淆方案的安全边界，说明什么能保、什么保不住。","basis":"abs"},{"id":"B#4319","title":"Robustness of Vision Language Models Against Split-Image Harmful Input Attacks","authors":"Md Rafi Ur Rashid (Pennsylvania State University), MD Sadik Hossain Shanto (Bangladesh University of Engineering and Technology), Vishnu Asutosh Dasu (Pennsylvania State University), Shagufta Mehnaz (Pennsylvania State University)","speaker":"","s":"D1","pos":8,"sum":"VLM 的新 jailbreak 面：把有害语义拆到多张图片碎片里，单看每张都无害，合起来才有害。原因是预训练和指令微调能泛化到拆分图像，而安全对齐只在整图上做过。","basis":"abs"},{"id":"A#233","title":"NFSA: Non-Forward Secure Aggregation with One Server via Two Layer Secret Sharing","authors":"Yufei Zhou (Sun Yat-sen University)","speaker":"Yini Lin","s":"D2","pos":1,"sum":"联邦学习的单服务器 secure aggregation。用 Shamir 秘密共享加基于 PRF 的 2-out-of-2 加性共享做成两层结构，去掉用户之间经服务器转发的那一步，降低通信量并减少暴露面。","basis":"abs"},{"id":"A#1189","title":"Preprocessed Private Function Evaluation: Achieving Sublinear Online Complexity for Lookup Tables","authors":"Tanping Zhou (Engineering University of People's Armed Police), Xiaoyi Wang (Institute of Software, Chinese Academy of Sciences), Yi Qu (Institute of Software, Chinese Academy of Sciences), Wenchao Liu (Engineering University of People's Armed Police), Long Chen (Institute of Software, Chinese Academy of Sciences), Zhenfeng Zhang (Institute of Software, Chinese Academy of Sciences)","speaker":"","s":"D2","pos":2,"sum":"带预处理的 private function evaluation，针对查找表，使在线阶段复杂度达到亚线性。偏 MPC 基础构件，放在面向 ML 的安全计算场次里。","basis":"title"},{"id":"A#2042","title":"LightShark: Actively Secure Machine-Learning Inference Based on Lightweight Authenticated Distributed Comparison Function","authors":"Chenkai Zeng (Wuhan University), Qi Feng (Wuhan University), Debiao He (Wuhan University), Min Luo (Wuhan University)","speaker":"","s":"D2","pos":3,"sum":"主动安全（malicious security）的 MPC 机器学习推理，核心构件是一个轻量的、带认证的分布式比较函数，基于 DPF，用来高效实现 ReLU 这类比较运算。","basis":"title"},{"id":"A#3279","title":"Low-Complexity Private Decision Tree Evaluation over Homomorphic Encryption","authors":"Dongjin Park (Chung-Ang University), Gyeongwon Cha (Chung-Ang University), Joon-Woo Lee (Chung-Ang University)","speaker":"Dongjin Park","s":"D2","pos":4,"sum":"同态加密上的私有决策树评估，主打降低计算复杂度。服务器持有树模型，客户端持有特征，双方互不泄露。PPML 里的经典问题，增量改进型。","basis":"title"},{"id":"A#3291","title":"TACITA: Threshold Aggregation without Client Interaction","authors":"Varun Madathil (Yale University), Arthur Lazzaretti (Yale University), Zeyu Liu (Yale University), Charalampos Papamanthou (Yale University)","speaker":"","s":"D2","pos":5,"sum":"门限聚合，客户端之间不需要交互。面向联邦学习或遥测类的 secure aggregation：客户端各自上传一次即可，掉线也不影响恢复聚合结果。","basis":"title"},{"id":"B#305","title":"ROSETTA: Efficient and Accurate Privacy-Preserving LLM Decoding via Hybrid CKKS/TFHE Evaluation","authors":"Jiangrui Yu (Peking University), Baosheng Zhang (Xi'an Jiaotong University), Liang Kong (Ant Group), Lin Ding (Peking University), Yi Chen (Peking University), Ye Yu (Peking University), Mingzhe Zhang (Ant Group), Meng Li (Peking University)","speaker":"","s":"D2","pos":6,"sum":"FHE 下的 LLM 私有推理，针对自回归 decode 阶段。瓶颈在非线性运算，ROSETTA 混用 CKKS 和 TFHE：线性部分走 CKKS，非线性部分切到 TFHE，并利用 decode 阶段非线性运算的结构特点减少转换开销。","basis":"abs"},{"id":"B#3656","title":"PackCNN: Adaptive Data Packing for BSGS-Based Privacy-Preserving Convolutional Neural Network Inference","authors":"Kanyu Ye (Shandong Univeristy), Haoping Yang (Shandong Univeristy), Honghui You (Shandong University), Yusi Chen (Shandong University), Lei Ju (Shandong University), Zhuoran Ji (Shandong University)","speaker":"","s":"D2","pos":7,"sum":"同态加密 CNN 推理里的数据打包优化。BSGS 是同态线性变换的标准算法，本文按层自适应地选择 packing 方式来减少旋转次数。工程性较强的 HE 优化。","basis":"title"},{"id":"B#7568","title":"Tricycle: Private Transformer Inference with Tricyclic Encodings","authors":"Lawrence Lim (UC Santa Barbara), Vikas Kalagi (UC Santa Barbara), Julia Novick (UC Santa Barbara), Jiaming Liu (UC Santa Barbara), Divyakant Agrawal (UC Santa Barbara), Amr El Abbadi (UC Santa Barbara)","speaker":"Lawrence Lim","s":"D2","pos":8,"sum":"Transformer 私有推理，提出一种新的密文编码方式 tricyclic encoding，目的应是让注意力里的矩阵乘在同态下更省。没有摘要可核对。","basis":"title"},{"id":"A#27","title":"Demystifying GhostTap: Breaking Android Tapjacking Defenses by Exploiting State Inconsistencies","authors":"Yanjie Zhao (Huazhong University of Science and Technology), Zhiyuan Yang (Huazhong University of Science and Technology), Weimin Cheng (Independent Researcher), Sheng Cao (Huazhong University of Science and Technology), Hao Zhou (The Hong Kong Polytechnic University), Haoyu Wang (Huazhong University of Science and Technology)","speaker":"Sheng Cao","s":"D3","pos":1,"sum":"Android 的 tapjacking 防御可被绕过：利用窗口状态的不一致，使恶意覆盖层仍能诱导用户点击。","basis":"title"},{"id":"A#195","title":"DynOP: Blow Away the Cobwebs in NX Bypassing with Dynamic-Source Gadget Oriented Programming","authors":"Hong Guo (National University of Defense Technology), Ruipeng Wang (National University of Defense Technology), Shiwen Ou (National University of Defense Technology), Songtao Yang (Zhongguancun Laboratory), Yu Chen (National University of Defense Technology), TaiYan Wang (National University of Defense Technology), Zexiang Zhang (National University of Defense Technology), Yuwei Li (National University of Defense Technology), Yang Li (National University of Defense Technology), Zulie Pan (National University of Defense Technology)","speaker":"Hong Guo","s":"D3","pos":2,"sum":"新的代码复用攻击手法，用于绕过 NX：利用来源动态变化的 gadget 来编程。","basis":"title"},{"id":"A#462","title":"CVE-Genie: An LLM-Based Multi-Agent Framework for Reproducing CVEs","authors":"Saad Ullah (Boston University), Praneeth Balasubramanian (University of California, Santa Barbara), Wenbo Guo (University of California, Santa Barbara), Amanda Burnett (Arizona State University), Hammond Pearce (University of New South Wales), Christopher Kruegel (University of California, Santa Barbara), Giovanni Vigna (University of California, Santa Barbara), Gianluca Stringhini (Boston University)","speaker":"Praneeth Balasubramanian","s":"D3","pos":3,"sum":"用 LLM 多智能体框架自动复现 CVE：读漏洞描述，搭环境，写 exploit，再验证。产出是可复现的漏洞数据集，对训练和评测安全类 agent 有用。","basis":"title"},{"id":"A#1527","title":"From Fix to Flaw: Understanding and Revealing Incomplete Patches for Link Following Vulnerabilities","authors":"Bocheng Xiang (Fudan University), Yuan Zhang (Fudan University), Hao Huang (Fudan university), Youkun Shi (Fudan University)","speaker":"Bocheng Xiang","s":"D3","pos":4,"sum":"链接跟随类漏洞，如符号链接攻击，的补丁经常修得不完整。本文研究其模式并自动发现不完整补丁。","basis":"title"},{"id":"B#150","title":"One Resource to Break Them All: Exploiting Malformed Resources for Permanent Denial-of-Service in Android","authors":"Sheng Cao (Huazhong University of Science and Technology), Hao Zhou (The Hong Kong Polytechnic University), Yanjie Zhao (Huazhong University of Science and Technology), Tianming Liu (Huazhong University of Science and Technology), Songzhou Shi (Guangdong Baiyun University), Haoyu Wang (Huazhong University of Science and Technology)","speaker":"Sheng Cao","s":"D3","pos":5,"sum":"Android 上用畸形资源文件造成永久性拒绝服务：一个资源就能让设备或系统组件反复崩溃。","basis":"title"},{"id":"B#3497","title":"From Prompt to Pwn: Exploiting GPU Memory Errors During ML Inference","authors":"Jonas Roels (KU Leuven), Adriaan Jacobs (KU Leuven), Silviu Vlasceanu (Independent researcher), Mahmoud Ammar (Independent researcher), Stijn Volckaert (KU Leuven)","speaker":"Jonas Roels","s":"D3","pos":6,"sum":"首次展示远程、无特权的攻击者能在真实 ML 应用里触发 GPU 端的内存错误，并一路利用到推理服务。此前厂商把 GPU 内存错误当可靠性问题而非安全问题，这篇是在反驳这个假设。偏系统，但攻击入口是 prompt。","basis":"abs"},{"id":"B#4346","title":"Foot in the Door: Uncovering the Multi-Step Authorization Exploitation in Mobile Applications","authors":"Yizhe Shi (Fudan University), Zhemin Yang (Fudan University), Qiaodan Hou (Fudan University), Lukai Cui (Fudan University), Cheng Sheng (Fudan University), Xiaohan Zhang (Fudan University), Min Yang (Fudan University)","speaker":"Bocheng Xiang","s":"D3","pos":7,"sum":"移动应用里的多步授权滥用：单步看似合理的授权，串起来可逐步扩大权限。","basis":"title"},{"id":"B#8321","title":"Lost in Migration: Exposing Android Framework Vulnerabilities in Parallel Java-Kotlin Implementations","authors":"Rui Li (Singapore Management University), Wenrui Diao (Shandong University), Debin Gao (Singapore Management University)","speaker":"Rui Li","s":"D3","pos":8,"sum":"Android 框架从 Java 迁到 Kotlin 的过程中，AOSP 里同一组件存在 Java 和 Kotlin 两份并行实现，功能应相同但语义有细微分歧。本文把这些分歧当线索做差分分析，挖出框架层漏洞。","basis":"abs"},{"id":"A#865","title":"Mosaic: A Modular Framework for Private Fuzzy Heavy Hitters","authors":"Gayathri Garimella (Brown University), Peihan Miao (Brown University), Eileen Nolan (Brown University), Phuoc Van Long Pham (Brown University), Siddarth Sitaraman (Brown University)","speaker":"Phuoc Pham","s":"D4","pos":1,"sum":"私有的 fuzzy heavy hitters：在不泄露个体数据的前提下找出近似聚集的高频项，模块化框架。与 DP 和隐私遥测相关。","basis":"title"},{"id":"A#1895","title":"Accelerating Multiparty Noise Generation Using Lookups","authors":"Fredrik Meisingseth (Graz University of Technology), Christian Rechberger (Graz University of Technology), Fabian Schmid (Graz University of Technology)","speaker":"Fabian Schmid","s":"D4","pos":2,"sum":"多方安全计算里的噪声采样，用于在 MPC 内部实现差分隐私。本文不在均匀随机索引上查表，而用可高效采样的非均匀索引分布，所需查找表更小更少，比 CCS'25 和 PETS'25 的方案快几个数量级。和 DP 相关。","basis":"abs"},{"id":"A#1936","title":"Efficient Private Filtering and Aggregation for Weighted Set Intersection via Oblivious Encrypted Weight Transfer","authors":"Xiaodong Wang (Tsinghua University), Shengzhe Meng (Tsinghua University), Zijie Lu (Xi'an Jiaotong-Liverpool University), Bei Liang (Beijing Institute of Mathematical Sciences and Applications)","speaker":"Xiaodong Wang","s":"D4","pos":3,"sum":"带权重的 PSI：每个元素附带敏感权重，需要对交集上的权重做私有的过滤和聚合，例如 PI-Sum。现有工作零散且各为特定应用设计。本文用不经意的加密权重传递给出统一高效的方案。","basis":"abs"},{"id":"B#232","title":"Tempora-Fusion: Time-Lock Puzzle with Efficient Verifiable Homomorphic Linear Combination","authors":"Aydin Abadi (Newcastle University), Jakub K. Szeląg (Newcastle University)","speaker":"Aydin Abadi","s":"D4","pos":4,"sum":"时间锁谜题让信息只能在未来某时刻被解开。同态 TLP 允许对多个客户端的谜题做计算，服务器只需解一个。Tempora-Fusion 支持可验证的同态线性组合，且验证高效。","basis":"abs"},{"id":"B#1055","title":"Meta-PBS: Compact High-Precision Programmable Bootstrapping","authors":"Shihe Ma (Tsinghua University), Tairong Huang (Tsinghua University), Anyu Wang (Tsinghua University), Changtong Xu (Ant Group), Tao Wei (Ant Group), Xiaoyun Wang (Tsinghua University)","speaker":"Shihe Ma","s":"D4","pos":5,"sum":"TFHE 的 programmable bootstrapping 精度受 RLWE 维度限制。现有办法要么增大维度，要么加密前做数位分解，各有代价。Meta-PBS 用单个密文实现紧凑的高精度 PBS。","basis":"abs"},{"id":"B#3316","title":"Duty-Free Bits: Projectivizing Garbling Schemes","authors":"Nakul Khambhati (University of California, Los Angeles), Anwesh Bhattacharya (University of Illinois, Urbana-Champaign), David Heath (University of Illinois, Urbana-Champaign)","speaker":"Nakul Khambhati","s":"D4","pos":6,"sum":"混淆电路里，projective 方案按比特编码输入，可以直接接 OT，因此通用；一些更高效的新方案不是 projective 的。本文给出把非 projective 方案转成 projective 的通用方法，几乎没有额外开销。","basis":"abs"},{"id":"B#3558","title":"Communication-Efficient Private Join and Compute over Distributed Input Sets","authors":"Yunqing Sun (Northwestern University), Xinran Cai (Tsinghua University), Hanlin Liu (Northwestern University), Xiao Wang (Northwestern University), Wei Dong (Nanyang Technological University)","speaker":"","s":"D4","pos":7,"sum":"Private Join and Compute：两方在各自私有数据集的匹配记录上算聚合，典型应用是隐私保护的广告转化测量。现有协议假设每方持有完整数据集，本文处理输入分散在多处的情形并降低通信量。","basis":"abs"},{"id":"B#3792","title":"Structure-Aware CKKS Bootstrapping via L1-Regularized Polynomial Optimization","authors":"Zihui Gu (SUN YAT-SEN UNIVERSITY), Peijia Zheng (SUN YAT-SEN UNIVERSITY), Jiwu Huang (Shenzhen MSU-BIT University), Xiaochun Cao (Sun Yat-Sen University)","speaker":"","s":"D4","pos":8,"sum":"CKKS bootstrapping 的多项式近似优化，用 L1 正则利用结构稀疏性来降低开销。","basis":"title"},{"id":"A#1644","title":"Blue Bubbles, Red Flags: Investigating Privacy Leakage in Apple iMessage","authors":"Viktor E. Garske (University of Applied Sciences Stralsund), Swantje Lange (Hasso Plattner Institute, University of Potsdam), Gabriel K. Gegenhuber (Interdisciplinary Transformation University (IT:U)), David Schmidt (University of Vienna), Andreas Noack (University of Applied Sciences Stralsund), Jiska Classen (Hasso Plattner Institute, University of Potsdam)","speaker":"Swantje Lange, Viktor Garske","s":"D5","pos":1,"sum":"Apple iMessage 的隐私泄露调查，属于端到端加密消息应用的元数据或侧信息泄露测量。没有摘要可核对。","basis":"title"},{"id":"A#2983","title":"Detecting and Measuring Client- and Server-Side Google Tag Manager and its Tags in 80K Websites","authors":"Gilles Mertens (Inria), Nataliia Bielova (Inria), Vincent Roca (Inria), Ahmed Bouhoula (ETH Zurich), Marouane Akassab (Inria)","speaker":"Vincent Roca","s":"D5","pos":2,"sum":"Google Tag Manager 的大规模测量，覆盖客户端和服务端两种部署，8 万个网站。服务端 GTM 能绕过浏览器的追踪拦截。Web 追踪方向。","basis":"title"},{"id":"B#203","title":"Dissecting Apple's Lockdown Mode: A Cross-Platform, Multi-Version Analysis","authors":"Marie Fischer (Hasso Plattner Institute, University of Potsdam), Jiska Classen (Hasso Plattner Institute, University of Potsdam)","speaker":"Marie Fischer","s":"D5","pos":3,"sum":"Apple Lockdown Mode 的跨平台、跨版本分析：它实际关掉了哪些功能，各版本有何差异。","basis":"title"},{"id":"B#1384","title":"When Ad Networks Misbehave: Understanding Risks of Semi-Drive-By Splash Ads","authors":"Song Wu (Independent Researcher), Bo Wang (Independent Researcher), Yifan Zhang (San Diego State University), Yinfeng Cao (The Hong Kong Polytechnic University), Xueqiang Wang (University of Central Florida)","speaker":"Song Wu","s":"D5","pos":4,"sum":"移动应用开屏广告生态的风险。这类广告的变现依赖交互信号，而误触和传感器回调很容易被算成点击。以往把广告欺诈看作发布方问题，本文指出广告网络一方也在作弊，诱导半自动跳转。","basis":"abs"},{"id":"B#1786","title":"When Apps Outlive Vendors: Security Implications of IoT Abandonware","authors":"Dayeon Kang (University of Massachusetts Amherst), Elvis Yeboah-Duako (University of Massachusetts Amherst), Sachin Thomas (University of Massachusetts Amherst), Pubali Datta (University of Massachusetts Amherst)","speaker":"Dayeon Kang","s":"D5","pos":5,"sum":"IoT 配套 App 在厂商停止支持后仍留在应用商店和用户手机上，继续连接设备和收集数据，但不再有安全更新。本文测量这类 abandonware 的规模和遗留漏洞。","basis":"abs"},{"id":"B#2856","title":"Detecting and Measuring gclid-Based Tracking on the Web","authors":"Huy Pham (The Graduate University for Advanced Studies), Kensuke Fukuda (National Institute of Informatics), Ha Dao (Max Planck Institute for Informatics)","speaker":"Huy Pham","s":"D5","pos":6,"sum":"测量 gclid 追踪。gclid 是 Google 广告点击标识符，挂在 URL 参数上，可以绕过第三方 cookie 限制做跨站追踪。Web 追踪测量类工作。","basis":"title"},{"id":"B#3122","title":"PrivEscalate: Measuring and Augmenting the Threat of LLM-Automated Linux Privilege Escalation","authors":"Yixuan Liu (Nanyang Technological University), Zilong Zhen (Nanyang Technological University), Yin Wu (Xi'an Jiaotong University), Yi Li (Nanyang Technological University)","speaker":"Zilong Zhen","s":"D5","pos":7,"sum":"LLM agent 做 Linux 提权的大规模 benchmark：531 个 Docker 化场景、14 个子类，另有 329 个带环境干扰项的变体。既量化当前模型的提权能力，也给出增强手段。评估 agent 进攻能力时可以引用。","basis":"abs"},{"id":"B#3880","title":"A Qualitative Study on Ethics Perspectives in Cryptography Research","authors":"Maria Hellenthal (CISPA Helmholtz Centre for Information Security), Thorsten Helfer (CISPA Helmholtz Center for Information Security), Doreen Riepel (CISPA Helmholtz Centre for Information Security), Annabelle Walle (CISPA Helmholtz Center for Information Security), Jannik Zeiser (CISPA Helmholtz Center for Information Security), Til Dralle (CISPA Helmholtz Center for Information Security), Sascha Fahl (CISPA Helmholtz Center for Information Security)","speaker":"Ma ":"B#332","title":"Watch and Crack: Password Inference from Smart-Glasses Video","authors":"Yoav Orenbach (Tel Aviv University), Avishai Wool (Tel Aviv University)","speaker":"Yoav Orenbach","s":"D6","pos":5,"sum":"智能眼镜拍到的视频足以推断旁人输入的密码。","basis":"title"},{"id":"B#766","title":"From Fault to Oracle: Breaking Google Pixel TPU Hardware Memory Isolation via Trusted Deserialization Faults","authors":"Minghao Lin (University of Southern California), Guanxing Wen (Certified Kernel Tech LLC), Haoxuan Xu (University of Southern California), Yuzhou Fang (University of Southern California), Nanzi Yang (Old Dominion University), Xiaokuan Zhang (George Mason University), Yanan Guo (University of Rochester), Zhuo Zhang (Columbia University), Mengyuan Li (University of Southern California)","speaker":"Minghao Lin","s":"D6","pos":6,"sum":"通过可信反序列化过程中的故障，攻破 Google Pixel 上 TPU 的硬件内存隔离。","basis":"title"},{"id":"B#867","title":"Shadow Tokens: Uncovering the Broken Permission Revocation Vulnerability in Intelligent Connected Vehicles","authors":"Yanbang Sun (Tianjin University), Hebo Leng (QI-ANXIN), Qiang Hu (Tianjin University), Xiaofei Xie (Singapore Management University), Jiongchi Yu (Singapore Management University), Ruitao Feng (Southern Cross University), Guangzheng Yao (QI-ANXIN), Weijia Cai (QI-ANXIN), Quanzhou Wang (QI-ANXIN), Xiaohong Li (Tianjin University), Junjie Wang (Tianjin University)","speaker":"Yanbang Sun","s":"D6","pos":7,"sum":"智能网联汽车的权限撤销存在缺陷：授权被撤销后，旧令牌仍然可用。","basis":"title"},{"id":"B#1336","title":"Hello Again: Exploiting Replay Protected Monotonic Counters to Brute-Force Windows Hello PINs","authors":"Christian Werling (Technische Universität Berlin), Matti Finder (Technische Universität Berlin), Hans Niklas Jacob (Technische Universität Berlin), Julian Prein (Technische Universität Berlin), Niclas Kühnapfel (Technische Universität Berlin), Jean-Pierre Seifert (Technische Universität Berlin)","speaker":"Christian Werling","s":"D6","pos":8,"sum":"利用 TPM 的防重放单调计数器的缺陷，暴力破解 Windows Hello PIN。","basis":"title"},{"id":"B#2045","title":"BitVM3: Efficient Bitcoin Bridges via Garbled Circuits","authors":"Robin Linus Woll (Stanford University), Ioannis Alexopoulos (TU Wien), Lukas Aumayr (University of Edinburgh), Zeta Avarikioti (TU Wien), Matteo Maffei (TU Wien), David Tse (Stanford University)","speaker":"Robin Linus Woll","s":"D8","pos":1,"sum":"比特币跨链桥。已部署的桥靠联邦托管，BitVM2 的最坏情况争议成本约 1.6 万美元。BitVM3 改用混淆电路做链下验证，把争议成本大幅压低。","basis":"abs"},{"id":"A#372","title":"BABE: Verifying Proofs on Bitcoin Made 1000x Cheaper","authors":"Sanjam Garg (University of California, Berkeley), Dimitris Kolonelos (University of California, Berkeley), Mikhail Sergeevitch (Babylon Labs), Srivatsan Sridhar (Byzantine Research), David Tse (Byzantine Research)","speaker":"","s":"D8","pos":2,"sum":"让比特币验证简洁证明是扩容和跨链的关键，难在比特币脚本表达力弱、区块空间小。现有最优的 BitVM2 成本高。BABE 把链上验证成本降低约 1000 倍。","basis":"abs"},{"id":"A#835","title":"Braid: Sybil-Resistant Decentralized Identity with Trustless Key Recovery and Non-Transferable Anonymous Credentials","authors":"Rui Song (The Hong Kong Polytechnic University), Tianyu Zheng (The Hong Kong Polytechnic University), Shang Gao (The Hong Kong Polytechnic University), Guyue Li (Southeast University), Xue Liu (McGill University), Bin Xiao (The Hong Kong Polytechnic University)","speaker":"Rui Song","s":"D8","pos":3,"sum":"抗女巫的去中心化身份方案，支持无需信任方的密钥恢复和不可转让的匿名凭证。","basis":"title"},{"id":"A#1694","title":"AuditPay: Anonymous Payments with Controlled Oversight","authors":"Elkana Tovey (Hebrew University), Yossi Gilad (Hebrew University), Aviv Zohar (Hebrew University)","speaker":"Elkana Tovey","s":"D8","pos":4,"sum":"区块链混币器的可控监管。审计方每个周期可监控不超过预算数量的地址，用户不知道哪些被监控；预算由密码学强制，而不是让用户自愿交出查看密钥。","basis":"abs"},{"id":"A#2028","title":"Lether: Practical Post-Quantum Account-Based Private Blockchain Payments","authors":"Hongxiao Wang (The University of Hong Kong), Muhammed F. Esgin (Monash University), Ron Steinfeld (Monash University), Siu-Ming Yiu (The University of Hong Kong)","speaker":"Hongxiao Wang","s":"D8","pos":5,"sum":"首个实用的基于格的后量子账户模型隐私支付协议，沿用 Anonymous Zether 的范式。难点是格上缺少对应构件：多消息多接收者的加法同态加密和相应的零知识证明，本文把它们补齐。","basis":"abs"},{"id":"A#2516","title":"Beyond Anonymity Sets: A Security Model for Distributed Shuffling in Adversarial Environments","authors":"Adrian Cinal (NASK National Research Institute), Oliwer Sobolewski (NASK National Research Institute), Gabriel Wechta (NASK National Research Institute), Filip Zagórski (University of Wroclaw)","speaker":"","s":"D8","pos":6,"sum":"分布式洗牌是 mixnet、电子投票和 PoS 秘密领导者选举的核心构件。现有安全分析大多停留在匿名集大小这类启发式度量。本文给出对抗环境下的形式化安全模型。","basis":"abs"},{"id":"A#2578","title":"The Billion Dollar Merkle Tree","authors":"Thomas Coratger (Ethereum Foundation), Dmitry Khovratovich (Ethereum Foundation), Bart Mennink (Maastricht University), Benedikt Wagner (Ethereum Foundation)","speaker":"Benedikt Wagner","s":"D8","pos":7,"sum":"Plonky3 的 Merkle 树实现被大量简洁证明系统采用，保护着约 40 亿美元资产，但它底层的 2-to-1 压缩函数既不抗碰撞也不单向。本文分析为什么整体仍然安全，以及安全性成立的条件。","basis":"abs"},{"id":"B#858","title":"Thunderbolt: Fast Asynchronous Off-Chain Bitcoin Transfers","authors":"Hongbo Wen (University of California, Santa Barbara), Hanzhi Liu (University of California, Santa Barbara), Yanju Chen (University of California, San Diego), Jingyu Ke (Shanghai Jiao Tong University), Dahlia Malkhi (University of California, Santa Barbara), Yu Feng (University of California, Santa Barbara)","speaker":"Hongbo Wen","s":"D8","pos":8,"sum":"比特币链下转账协议。一个 UTXO 上链锁定一次，锁在当前持有者与门限委员会联合控制的固定公钥下，所有权可无限次链下转移，秒级确认。不需要通道图、路由和流动性再平衡，收款方可以离线。","basis":"abs"},{"id":"A#1434","title":"Automated Side-Channel Analysis of Cryptographic Protocol Implementations","authors":"Faezeh Nasrabadi (CISPA Helmholtz Center for Information Security), Robert Künnemann (CISPA Helmholtz Center for Information Security), Hamed Nemati (KTH Royal Institute of Technology)","speaker":"Faezeh Nasrabadi","s":"D9","pos":1,"sum":"协议的形式化验证通常忽略编译后的代码和微架构侧信道。本文的工具链从真实二进制中抽取协议模型，在明确的泄露契约下分析，覆盖 constant-time 和 Spectre-PHT 式推测执行观测。","basis":"abs"},{"id":"A#1869","title":"A Sound Translation from Tamarin to ProVerif: Enabling Comparative Analysis","authors":"Kevin Morio (CISPA Helmholtz Center for Information Security), Yavor Ivanov (CISPA Helmholtz Center for Information Security), Robert Künnemann (CISPA Helmholtz Center for Information Security)","speaker":"Kevin Morio","s":"D9","pos":2,"sum":"Tamarin 和 ProVerif 是两大协议验证工具，形式化基础不同，难以直接比较。本文给出从 Tamarin 模型到 ProVerif 的 sound 翻译，让同一个模型能在两边跑并对比。","basis":"abs"},{"id":"B#610","title":"Accountability in Certificate Transparency and Variants","authors":"Timo Treitz (Saarland University), Robert Künnemann (CISPA Helmholtz Center for Information Security)","speaker":"Timo Treitz","s":"D9","pos":3,"sum":"证书透明度（CT）及其变体里的可问责性：日志或 CA 作恶时能否被追责，形式化分析。","basis":"title"},{"id":"B#628","title":"CV2F*: Combining CryptoVerif and F* for Proving Security of Protocol Implementations","authors":"Bruno Blanchet (Inria), Aymeric Fromherz (Inria), Charlie Jacomme (Université de Lorraine, CNRS, Inria), Benjamin Lipp (Rosenpass e. V.), Emmanuel Mera (ENS Paris-Saclay)","speaker":"Bruno Blanchet","s":"D9","pos":4,"sum":"把 CryptoVerif 的计算模型证明和 F* 的实现验证结合起来，证明协议实现的安全性。","basis":"title"},{"id":"B#2417","title":"Enforcement of In-Kernel Stateful Security Policies via eBPF","authors":"Letterio Galletta (IMT School for Advanced Studies Lucca)","speaker":"Letterio Galletta","s":"D9","pos":5,"sum":"针对多租户系统的攻击常是多步的、依赖历史的，单看每步都无害。防御需要内核里的有状态安全策略且语义精确，现有的 syscall 过滤等机制至少缺一样。本文用 eBPF 在内核内强制执行有状态策略。","basis":"abs"},{"id":"B#3751","title":"Formal Verification of Circuit-Soundness in zkWasm, a General Purpose zkVM","authors":"Vilhelm Sjöberg (CertiK), Roger Bai (CertiK), Hao Chen (CertiK), Xifeng Jin (CertiK), Zhaozhong Ni (NVIDIA), Sinka Gao (Delphinus Lab pty ltd), Ronghui Gu (Columbia University), Zhong Shao (Yale University)","speaker":"Vilhelm Sjöberg","s":"D9","pos":6,"sum":"形式化验证通用 zkVM zkWasm 的电路可靠性。","basis":"title"},{"id":"B#5087","title":"Lex: Turning Laws into Enforceable Security Policies","authors":"François Hublet (ETH Zürich), Jakob Merane (ETH Zürich), Jonas Degelo (ETH Zürich), Wei-En Hsieh (ETH Zürich), Srđan Krstić (University of Copenhagen), David Basin (ETH Zürich)","speaker":"Srđan Krstić","s":"D9","pos":7,"sum":"把法律条文转成可执行的安全策略。没有摘要，方法细节以现场为准。","basis":"title"},{"id":"A#182","title":"DRIP: Defending Prompt Injection via Token-wise Representation Editing and Residual Fusion","authors":"Ruofan Liu (National University of Singapore), Yun Lin (Shanghai Jiao Tong University), Zhiyong Huang (National University of Singapore), Jin Song Dong (National University of Singapore)","speaker":"Yanbo Xu","s":"E1","pos":1,"sum":"防 prompt injection。已有做法是训练模型区分指令和数据，但数据段里像指令的语义仍会盖过原指令。DRIP 在表征层面动手：逐 token 把数据段里的指令语义编辑掉、保留数据语义，再用残差融合保证原指令的作用不被冲掉。","basis":"abs"},{"id":"A#357","title":"Token Buncher: Shielding LLMs from Harmful Reinforcement Learning Fine-Tuning","authors":"Weitao Feng (Nanyang Technological University), Lixu Wang (Nanyang Technological University), Peizhuo Lv (Nanyang Technological University), Tianyi Wei (Nanyang Technological University), Jie Zhang (CFAR and IHPC, A*STAR), Chongyang Gao (Northwestern University), Sinong Simon Zhan (Northwestern University), Wei Dong (Nanyang Technological University)","speaker":"Weitao Feng","s":"E1","pos":2,"sum":"有害微调的新威胁模型：攻击者用强化学习而不是监督微调来破坏安全对齐，同等算力下更有效。防御 TokenBuncher 的思路是压低模型回答的熵，因为 RL 依赖熵来探索，熵被约束后就拿不到可区分的奖励信号。","basis":"abs"},{"id":"A#405","title":"Understanding and Mitigating Prompt Leaking Attacks in Real-World LLM-Based Applications","authors":"Yong Yang (Zhejiang University), Chong Fu (Zhengzhou University), Tong Zhang (Zhejiang University), Rui Zeng (Zhejiang University), Qingming Li (Zhejiang University), Tianyu Du (Zhejiang University), Zonghui Wang (Zhejiang University), Shouling Ji (Zhejiang University), Wenzhi Chen (Zhejiang University)","speaker":"Jiahao Chen","s":"E1","pos":3,"sum":"真实 LLM 应用的 system prompt 泄露测量：六大商业平台 1,200 个应用，超过 80% 在现实的对抗查询下泄露 system prompt，有的还带出敏感信息。随后分析泄露成因并评估防御手段。数字好引用。","basis":"abs"},{"id":"A#1221","title":"ReasoningBomb: A Stealthy Denial-of-Service Attack by Inducing Pathologically Long Reasoning in Large Reasoning Models","authors":"Xiaogeng Liu (Johns Hopkins University), Xinyan Wang (University of Wisconsin–Madison), Yechao Zhang (Nanyang Technological University), Sanjay Kariyappa (NVIDIA Corporation), Chong Xiang (NVIDIA Corporation), Muhao Chen (University of California, Davis), G. Edward Suh (NVIDIA Corporation), Chaowei Xiao (Johns Hopkins University)","speaker":"","s":"E1","pos":4,"sum":"针对推理模型（LRM）的 DoS：用很短的 prompt 诱导出病态的超长推理链，烧掉服务方算力。先形式化 prompt-induced DoS，提出放大比、隐蔽性、可优化性三条性质，再给出同时满足三者的攻击 ReasoningBomb。","basis":"abs"},{"id":"A#3324","title":"One Leak Away: How Pretrained Model Exposure Amplifies Jailbreak Risks in Finetuned LLMs","authors":"Yixin Tan (Institute of Science Tokyo), Yu Zhe (RIKEN Center for Advanced Intelligence Project), Rui Wen (Institute of Science Tokyo), Jun Sakuma (Institute of Science Tokyo)","speaker":"Yixin Tan","s":"E1","pos":5,"sum":"pretrain-to-finetune 威胁模型：攻击者能拿到公开的预训练模型，拿不到私有的微调版本。实验表明在预训练模型上优化出的对抗 prompt 向它的微调后代迁移得最好，即 jailbreak 漏洞会被继承。启示是公开底座本身就是攻击面。","basis":"abs"},{"id":"B#839","title":"Multimodal Resource-Exhaustion Attacks on Vision-Language Models via Joint Pixel-Prompt Optimization","authors":"Zhaoxiong Ni (Guangzhou University), Yatie Xiao (Guangzhou University), Chi-Man Pun (University of Macau), Fei Peng (Guangzhou University), Qingxiao Guan (Guangzhou University), Keke Tang (Guangzhou University)","speaker":"Yatie Xiao","s":"E1","pos":6,"sum":"VLM 的资源耗尽攻击。此前只优化图像扰动、固定可见 prompt；JPPO 把 prompt 也当作对抗变量，与像素联合优化，诱导模型生成超长输出。属于 availability 攻击，与同场的 ReasoningBomb 是近亲。","basis":"abs"},{"id":"B#3771","title":"Jailbreaking via Activation Dilution: Neuron-Guided Adaptive Decomposition of Language Models","authors":"Jiahang Wang (Stevens Institute of Technology), Chenglong Fu (University of North Carolina at Charlotte), Xiaojiang Du (Stevens Institute of Technology), Bo Luo (The University of Kansas)","speaker":"XIAOJIANG DU","s":"E1","pos":7,"sum":"新的 jailbreak 手法，从标题看是找出负责拒答的神经元，再把有害请求自适应地拆解，使这些神经元的激活被稀释到触发不了拒答。机制驱动的白盒或灰盒攻击。","basis":"title"},{"id":"B#5757","title":"Logit Laundering: Evading Data-Use Auditing in Large Language Models","authors":"Ruihan Hu (Beijing University of Posts and Telecommunications), Wei Luo (Beijing University of Posts and Telecommunications), Yu-Ming Shang (Beijing University of Posts and Telecommunications), Jiakai Wang (Zhongguancun Laboratory), Chuxuan Zhang (Beijing University of Posts and Telecommunications), Mei Li (Beijing University of Posts and Telecommunications), Xi Zhang (Beijing University of Posts and Telecommunications), Meikang Qiu (Augusta University)","speaker":"Ruihan Hu","s":"E1","pos":8,"sum":"对抗 LLM 的数据使用审计。审计方靠数据水印判断某数据集是否被拿去训练；本文站在不合规模型提供方的角度，研究如何在用了带水印数据的同时让水印信号在输出里检测不到。结论是现有的水印审计并不稳。","basis":"abs"},{"id":"A#923","title":"Relect: Single Secret Leader Election via FHE with Reduced Computation and Communication and Transparent Setup","authors":"Haofei Liang (Shanghai Jiao Tong University), Zeyu Liu (Yale University), Yunhao Wang (Yale University), Xiang Xie (East China Normal University), Yu Yu (Shanghai Jiao Tong University), Fan Zhang (Yale University)","speaker":"Haofei Liang","s":"E2","pos":1,"sum":"Single secret leader election：所有参与方不经意地选出一个 leader，其他人不知道是谁，直到 leader 自己公开。本文基于 FHE，比此前基于格的 Qelect 降低了计算和通信量，且 setup 透明。","basis":"abs"},{"id":"A#1226","title":"Olingo: Threshold Lattice Signatures with DKG and Identifiable Abort","authors":"Kamil Doruk Gur (Norwegian University of Science and Technology), Patrick Hough (Universität der Bundeswehr München), Jonathan Katz (Google), Caroline Sandsbråten (Norwegian University of Science and Technology), Tjerand Silde (Norwegian University of Science and Technology)","speaker":"","s":"E2","pos":2,"sum":"门限格签名框架，声称首次同时具备实用部署想要的全部性质：密钥和签名小、通信与轮数低、在线签名非交互、支持 DKG、可识别中止方。","basis":"abs"},{"id":"A#1982","title":"Thresholdizing Standardized FALCON Signatures","authors":"Radhika Garg (Northwestern University), Daniel Escudero (TACEO), Antigoni Polychroniadou (JPMorgan AI Research), Akira Takahashi (JPMorgan AI Research), Xiao Wang (Northwestern University)","speaker":"Radhika Garg","s":"E2","pos":3,"sum":"把 NIST 选定的后量子签名 FALCON 做成门限版本，产出的签名可用未经修改的标准 FALCON 验证算法验证。此前没有方案做到这一点。","basis":"abs"},{"id":"A#4758","title":"On the Pitfalls of Modeling Individual Knowledge","authors":"Wojciech Ciszewski (University of Warsaw), Stefan Dziembowski (University of Warsaw), Tomasz Lizurej (NASK Institute), Marcin Mielniczuk (University of Warsaw)","speaker":"","s":"E2","pos":4,"sum":"密码学里“知识”的概念此前针对一个抽象的 prover。近年出现更强的 individual 或 complete knowledge，要求证明某个具体的个体独自知道秘密，而不是多方凑出来的。本文指出建模这一概念时的若干陷阱。","basis":"abs"},{"id":"B#697","title":"BeaverDam: A Post-Quantum Threshold Key Recovery Protocol from a One-Time Threshold Oblivious Random Function","authors":"Benedikt Auerbach (PQShield), Shuichi Katsumata (PQShield), Kaoru Takemure (PQShield), Ida Tucker (PQShield)","speaker":"Kaoru Takemure","s":"E2","pos":5,"sum":"端到端加密通信的密钥备份依赖口令保护的密钥恢复协议。Signal 和 Juicebox 提出了门限版本以去掉对单一服务器的信任，但现有方案只有经典安全。BeaverDam 是后量子的门限密钥恢复协议，核心是一次性的门限不经意随机函数。","basis":"abs"},{"id":"B#1526","title":"High-throughput Verifiable Distributed OPRF from Gold PRF","authors":"Nan Cheng (University of St. Gallen), Yohei Watanabe (The University of Electro-Communications), Yugo Kasashima (The University of Electro-Communications), Ioannis Katis (University of St. Gallen), Aikaterini Mitrokotsa (University of St. Gallen)","speaker":"Nan Cheng","s":"E2","pos":6,"sum":"OPRF 是 PAKE、PSI 等隐私应用的基础构件。本文基于 Gold PRF 构造可验证的分布式 OPRF，主打高吞吐。","basis":"abs"},{"id":"B#2093","title":"LoTRS: Practical Post-Quantum Structured Threshold Ring Signatures from Lattices","authors":"Nikai Jagganath (Monash University), Muhammed F. Esgin (Monash University), Ron Steinfeld (Monash University), Amin Sakzad (Monash University), Markku-Juhani O. Saarinen (Tampere University), Dongxi Liu (CSIRO)","speaker":"","s":"E2","pos":7,"sum":"门限环签名让 N 人中的 T 人联合签名并隐藏是哪 T 人。很多部署并不需要对所有 T 子集都匿名，结构化的环就够。本文形式化这一设定并给出实用的格基后量子构造。","basis":"abs"},{"id":"B#6089","title":"THED: Threshold Dilithium from FHE","authors":"Jai Hyun Park (CryptoLab Inc.), Alain Passelègue (CryptoLab Inc.), Damien Stehlé (CryptoLab Inc.)","speaker":"Jai Hyun Park","s":"E2","pos":8,"sum":"ML-DSA（Dilithium）的门限版本，产出的签名可用标准验证算法验证。做法是在 FHE 下运行签名算法，协议两轮，其中一轮可预处理，支持任意人数和门限。","basis":"abs"},{"id":"B#68","title":"Efficient Linkage-Based Compartmentalization on CHERI","authors":"Dapeng Gao (University of Cambridge), John Baldwin (Ararat River Consulting), Jessica Clarke (University of Cambridge), Nicholas C. Connolly (Arm Limited), Brooks Davis (Capabilities Limited), Franz A. Fuchs (University of Cambridge), Alfredo Mazzinghi (University of Cambridge), Daniel Moghimi (Google), Peter Rugg (University of Cambridge), Domagoj Stolfa (University of Cambridge), Konrad Witaszczyk (University of Cambridge), Simon W. Moore (University of Cambridge), Robert N. M. Watson (University of Cambridge)","speaker":"Dapeng Gao","s":"E3","pos":1,"sum":"在 CHERI 内存安全硬件上做进程内隔离，以链接边界为单位。沿现有库边界一键划分，桌面系统上可达上万个隔离域，Chromium 这类大型应用单进程常驻五百多个，开销低。","basis":"abs"},{"id":"B#1152","title":"PoisonCap: Efficient Hierarchical Temporal Safety for CHERI","authors":"Yuecheng Wang (University of Cambridge), Jonathan Woodruff (University of Cambridge, Capabilities Limited), Alfredo Mazzinghi (University of Cambridge, Capabilities Limited), Peter Rugg (University of Cambridge, Capabilities Limited), Alexandre Joannou (University of Cambridge, Capabilities Limited), Samuel W. Stark (University of Cambridge), Robert N. M. Watson (University of Cambridge, Capabilities Limited), Simon W. Moore (University of Cambridge, Capabilities Limited)","speaker":"Yuecheng Wang","s":"E3","pos":2,"sum":"CHERI 上高效的层次化时间安全，防 use-after-free。","basis":"title"},{"id":"B#6102","title":"Mind the Heap: Preventing Capability Leakage Across CHERI Compartments","authors":"Seyedhamed Ghavamnia (Bloomberg), Maurice D. Hanisch (Caltech), Julien Vanegue (Bloomberg)","speaker":"Seyedhamed Ghavamnia","s":"E3","pos":3,"sum":"CHERI 隔离域之间的 capability 会经堆泄露，本文防止这种泄露。与周二同场的 B#68、B#1152 都是 CHERI 方向。","basis":"title"},{"id":"A#207","title":"PhantomSeal: Proactive Deepfakes Defense with Identity/Context Protection and Forensic Tracing","authors":"Liangqin Ren (The University of Kansas), Zeyan Liu (University of Louisville), Ye Wang (The University of Kansas), Yuxin Chen (The University of Chicago), Fengjun Li (The University of Kansas), Bo Luo (The University of Kansas)","speaker":"","s":"E3","pos":4,"sum":"主动式 deepfake 防御，针对换脸。给用户照片加隐蔽的 cloak，同时保护身份和画面上下文，并嵌入一个身份标识：即使被拿去换脸，生成结果也会被引导并可取证溯源。","basis":"abs"},{"id":"A#1304","title":"N00B: Bounds Checking for the Masses","authors":"Adriaan Jacobs (KU Leuven), Carlo Ramponi (University of Trento), Jonas Roels (KU Leuven), Bruno Crispo (University of Trento), Silviu Vlasceanu (Huawei Research), Mahmoud Ammar (Huawei Research), Stijn Volckaert (KU Leuven)","speaker":"Adriaan Jacobs","s":"E3","pos":5,"sum":"面向普通 C/C++ 代码的低门槛边界检查方案，目标是易部署。","basis":"title"},{"id":"A#1518","title":"Mitigating Code Injection Attacks on Modern GPUs","authors":"Carlo Ramponi (University of Trento), Adriaan Jacobs (KU Leuven), Luigi Dell'Eva (University of Trento), Stijn Volckaert (KU Leuven), Silviu Vlasceanu (Huawei Research), Mahmoud Ammar (Huawei Research), Bruno Crispo (University of Trento)","speaker":"Carlo Ramponi","s":"E3","pos":6,"sum":"现代 GPU 上的代码注入攻击及其缓解。","basis":"title"},{"id":"B#1333","title":"Enforcing XoM on x86-64 via Strict Code and Data Separation","authors":"Hongtao Wu (Wuhan University), Zuquan Peng (Wuhan University), Ziheng Chai (Wuhan University), Mengfei Xie (Wuhan University), Yan Lin (Jinan University), Jianming Fu (Wuhan University), Guojun Peng (Wuhan University)","speaker":"Hongtao Wu","s":"E3","pos":7,"sum":"在 x86-64 上通过严格的代码与数据分离实现 execute-only memory。","basis":"title"},{"id":"B#4819","title":"Characterizing and Detecting Bugs at the Interfaces of OpenBSD Privilege-Separated Programs","authors":"Shibo Ai (University of British Columbia), Shao Chen Zhang (University of British Columbia), Hugo Lefeuvre (University of British Columbia), Margo Seltzer (University of British Columbia)","speaker":"Shibo Ai","s":"E3","pos":8,"sum":"OpenBSD 的权限分离程序在进程间接口处的 bug，刻画并检测。","basis":"title"},{"id":"A#702","title":"Decoupled TFHE-type Functional Bootstrapping","authors":"Zhihao Li (Ant Group), Xuan Shen (Institute of Information Engineering, CAS; UCAS), Xianhui Lu (Institute of Information Engineering, CAS; UCAS), Ruida Wang (Institute of Information Engineering, CAS; UCAS), Yuan Zhao (Ant Group), Zhiwei Wang (Institute of Information Engineering, CAS; UCAS)","speaker":"","s":"E4","pos":1,"sum":"TFHE 类同态加密的 functional bootstrapping 改进，把其中耦合的步骤解耦以提升效率或精度。纯同态加密底层技术，可略过。","basis":"title"},{"id":"A#708","title":"The SecureDrop Protocol: End-to-End Encrypted Whistleblowing for All","authors":"Giulio Berra (Freedom of the Press Foundation), Felix Linker (ETH Zurich), Luca Maier (ETH Zurich), Cory Francis Myers (Freedom of the Press Foundation), Kenneth G. Paterson (ETH Zurich), Rowen Shane (Freedom of the Press Foundation), Shannon Veitch (ETH Zurich)","speaker":"","s":"E4","pos":2,"sum":"SecureDrop 是媒体机构用的匿名爆料系统，现有设计要求自建物理服务器。本文给出面向云部署的新协议，补上端到端加密，使服务器被攻陷也不泄露爆料内容和线人身份，并做了形式化安全分析。","basis":"abs"},{"id":"B#2071","title":"Abuse Reporting and Enforcement for Third Party Moderators in Private Messaging","authors":"Matthew Gregoire (University of North Carolina at Chapel Hill), Jade Keegan (University of North Carolina at Chapel Hill), Saba Eskandarian (University of North Carolina at Chapel Hill)","speaker":"Matthew Gregoire","s":"E4","pos":3,"sum":"端到端加密消息里的滥用举报与处置，考虑由第三方而不是平台来做内容审核的情形。属于加密通信与内容治理如何兼容这条线。","basis":"title"},{"id":"B#2219","title":"NTPIR: Efficient Silent-Preprocessing PIR using NTRU","authors":"Zhihao Li (Ant Group), Cheng Hong (Ant Group)","speaker":"","s":"E4","pos":4,"sum":"基于 NTRU 的 PIR，带 silent preprocessing，即预处理阶段不需要客户端参与。纯密码学效率改进，可略过。","basis":"title"},{"id":"B#2733","title":"StOMR: Stateful Oblivious Message Retrieval","authors":"Charles Gouert (NVIDIA), Keewoo Lee (Ethereum Foundation), Dimitris Mouris (Snap Inc.), Yiannis Tselekounis (Royal Holloway, University of London), Jean-Luc Watson (NVIDIA)","speaker":"Yiannis Tselekounis","s":"E4","pos":5,"sum":"Oblivious Message Retrieval 的有状态版本：接收方从公告板上取回属于自己的消息而不暴露是哪几条，引入状态来降低重复扫描的开销。匿名通信类密码学，可略过。","basis":"title"},{"id":"B#2782","title":"PAPER: Privacy-Preserving Convolutional Neural Networks using Low-Degree Polynomial Approximations and Structural Optimizations on Leveled FHE","authors":"Eduardo Chielle (NYU Abu Dhabi), Manaar Alam (NYU Abu Dhabi), Jinting Liu (NYU Shanghai), Jovan Kascelan (NYU Abu Dhabi), Michail Maniatakos (NYU Abu Dhabi)","speaker":"Manaar Alam","s":"E4","pos":6,"sum":"FHE 上的非交互 CNN 私有推理。两个痛点是 bootstrapping 太多和高次多项式近似激活函数掉点。本文用低次多项式近似配合结构优化，在 leveled FHE 上把精度追平明文 ReLU 模型，推理也更快。","basis":"abs"},{"id":"B#3382","title":"sPAR: (Somewhat) Practical Anonymous Router","authors":"Debajyoti Das (Lund University), Jeongeun Park (NTNU), Hyewon Sung (Ewha Womans University)","speaker":"Hyewon Sung","s":"E4","pos":7,"sum":"Anonymous Router 的实用化。这是一种不依赖 mixnet 的匿名通信密码学原语，标题自称“勉强实用”。可略过。","basis":"title"},{"id":"A#641","title":"You Can't Talk Your Way Out of Cyber Extortion: An Empirical Study of Ransomware Negotiations","authors":"Tom Meurs (Dutch Police), Edward Cartwright (De Montfort University), Anna Cartwright (Independent researcher), Harold Houba (Vrije Universiteit University), Daniel W. Woods (University of Edinburgh)","speaker":"Tom Meurs","s":"E5","pos":1,"sum":"勒索软件谈判的实证研究，标题的结论是讨价还价基本没用。","basis":"title"},{"id":"A#863","title":"Stop My Dancing! Understanding, Detecting and Attributing Motion-Aware Deepfake Videos","authors":"Fazhong Liu (Shanghai Jiao Tong University), Yan Meng (Shanghai Jiao Tong University), Tian Dong (Shanghai Jiao Tong University), Guoxing Chen (Shanghai Jiao Tong University), Haojin Zhu (Shanghai Jiao Tong University)","speaker":"Fazhong Liu","s":"E5","pos":2,"sum":"Motion-aware deepfake，即用姿态引导的 diffusion 生成整个人跳舞这类视频。作者建了首个专门的 benchmark，150 万帧、六种生成器，并发现这类视频因为只靠少量输入帧合成运动，会留下微弱但稳定的痕迹，可用于检测和归因到具体生成器。","basis":"abs"},{"id":"B#1645","title":"Between Risk, Recognition, and Necessity: How Open-Source Project Maintainers Perceive and Navigate CVEs Through Reporting and Resolving Vulnerabilities","authors":"Jessy Ayala (University of California, Irvine), Steven Ngo (University of California, Irvine), Joshua Garcia (University of California, Irvine)","speaker":"Jessy Ayala","s":"E5","pos":3,"sum":"开源项目维护者如何看待 CVE 以及如何处理漏洞报告，访谈研究。","basis":"title"},{"id":"B#2425","title":"Coverage Illusion: Measuring Android TLS Instrumentation Gaps","authors":"Abhinav Saxena (University of Calgary), Joel Reardon (University of Calgary)","speaker":"Abhinav Saxena","s":"E5","pos":4,"sum":"Android 上用于拦截 TLS 流量的插桩方法存在覆盖盲区，很多流量实际没被看到，影响依赖它的测量研究的结论。","basis":"title"},{"id":"B#4807","title":"No One Cares About Privacy But You: Understanding Data Deletion Practices in the App-in-App Ecosystem","authors":"Yizhe Shi (Fudan University), Zhemin Yang (Fudan University), Houliang Wan (Fudan University), Chongxin Hu (Fudan University)","speaker":"Bocheng Xiang","s":"E5","pos":5,"sum":"小程序这类 app-in-app 生态里的数据删除实践测量：用户要求删除数据后，小程序和宿主平台是否真的删了。从标题看结论是基本没人管。","basis":"title"},{"id":"B#5042","title":"PriMobiBench: Characterizing Visual Privacy Leakage in VLM-Driven Mobile GUI Agents","authors":"Qihang Cen (Tsinghua University), Tianshuo Cong (Shandong University), Da Song (Shandong University), Xinlei He (Wuhan University), Jiaxing Song (Tsinghua University), Ke Xu (Tsinghua University), Qi Li (Tsinghua University)","speaker":"","s":"E5","pos":6,"sum":"手机 GUI agent 靠 VLM 读截图操作手机，截图里的敏感信息会被直接送给模型，还可能被用来给用户画像。PriMobiBench 是首个系统评估这类视觉隐私泄露的 benchmark，覆盖数据生成、轨迹构造和多模型评测。","basis":"abs"},{"id":"B#5724","t
