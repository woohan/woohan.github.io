<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><meta name="robots" content="noindex, nofollow"></head><body>
<title>CCS 2026 论文与日程检索</title>
<style>
  /* Layout: phone-first single column. Sticky header, then search + filters, papers grouped by session slot. */
  :root {
    --bg: #f7f8fa; --surface: #ffffff; --surface-2: #eef1f5;
    --fg: #1b2230; --fg-muted: #5d6675; --line: #d9dee6; --line-strong: #b9c1cc;
    --accent: #1f4e8c; --accent-soft: #dfe9f7;      /* Delft blue: conference */
    --talk: #b3261e; --talk-soft: #fbe3e0;          
    --travel: #a8651a; --travel-soft: #fbead3;
    --free: #3d7a4f; --free-soft: #ddefe1;
    --paris: #6b4fa0; --paris-soft: #e9e2f5;
    --deadline: #c2410c; --todo: #4b5563; --skip: #8b93a1; --today: #0f766e;
    --star: #b7791f; --mark: #ffe08a; --mark-fg: #1b2230;
    --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161d; --surface: #1a2029; --surface-2: #222a35;
      --fg: #e6eaf0; --fg-muted: #9aa4b2; --line: #2c3542; --line-strong: #3f4b5b;
      --accent: #7fb0ea; --accent-soft: #1d3250; --talk: #f08a80; --talk-soft: #4a2320;
      --travel: #e0a85c; --travel-soft: #46331a; --free: #7fc493; --free-soft: #1f3a28;
      --paris: #b59ae6; --paris-soft: #2f2745; --deadline: #f59e6b; --todo: #b5bcc8;
      --skip: #6b7482; --today: #5eead4; --star: #e3b341; --mark: #8a6a00; --mark-fg: #fff7d6; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161d; --surface: #1a2029; --surface-2: #222a35;
    --fg: #e6eaf0; --fg-muted: #9aa4b2; --line: #2c3542; --line-strong: #3f4b5b;
    --accent: #7fb0ea; --accent-soft: #1d3250; --talk: #f08a80; --talk-soft: #4a2320;
    --travel: #e0a85c; --travel-soft: #46331a; --free: #7fc493; --free-soft: #1f3a28;
    --paris: #b59ae6; --paris-soft: #2f2745; --deadline: #f59e6b; --todo: #b5bcc8;
    --skip: #6b7482; --today: #5eead4; --star: #e3b341; --mark: #8a6a00; --mark-fg: #fff7d6; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
  .gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .inner { max-width: 760px; margin: 0 auto; }

  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 10px; }
  .top .inner { display: grid; gap: 8px; }
  .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .brand h1 { margin: 0; font-size: 17px; font-weight: 650; }
  .brand span { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); white-space: nowrap; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .tabs button { font: inherit; font-weight: 600; padding: 9px 0; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg-muted); }
  .tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  main { padding-block: 14px 56px; }
  .stack { display: grid; gap: 12px; }

  /* 行程 */
  .status { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; font-size: 14px; }
  .status b.ok { color: var(--free); } .status b.open { color: var(--deadline); }
  .day { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line-strong); border-radius: 10px; padding: 12px 14px; display: grid; gap: 10px; min-width: 0; scroll-margin-top: 120px; }
  .day.conf { border-left-color: var(--accent); } .day.travel { border-left-color: var(--travel); }
  .day.free { border-left-color: var(--free); } .day.paris { border-left-color: var(--paris); } .day.after { border-left-color: var(--todo); }
  .day.is-today { box-shadow: 0 0 0 2px var(--today); }
  .day-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .day-head b { font-size: 16px; }
  .day-head .tag { font-size: 12.5px; color: var(--fg-muted); }
  .pill { font-family: var(--font-mono); font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; }
  .pill.today { color: var(--today); }
  .evs { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
  .evs li { display: grid; grid-template-columns: 5.6em 1fr; gap: 8px; min-width: 0; font-size: 14px; }
  .evs .t { font-family: var(--font-mono); font-size: 12px; color: var(--fg-muted); font-variant-numeric: tabular-nums; padding-top: 2px; overflow-wrap: anywhere; }
  .evs .s { min-width: 0; overflow-wrap: anywhere; }
  .evs li.talk .s { color: var(--talk); font-weight: 600; } .evs li.talk .t { color: var(--talk); }
  .evs li.skip .s { color: var(--skip); } .evs li.want .s { color: var(--accent); }
  .notes { color: var(--fg-muted); font-size: 13px; }
  .notes p { margin: 8px 0 0; }
  /* mini month: Mon-first, 9–29 Nov, tap a day to jump */
  .mini { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .mini .dow { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-muted); text-align: center; padding-bottom: 2px; }
  .mini button, .mini .off { font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 5px 0 6px; display: grid; gap: 1px; justify-items: center; background: var(--surface); color: var(--fg); min-width: 0; position: relative; }
  .mini .off { color: var(--skip); background: transparent; border-style: dashed; }
  .mini .n { font-family: var(--font-mono); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .mini .l { font-size: 10.5px; line-height: 1.2; white-space: nowrap; }
  .mini .travel { background: var(--travel-soft); border-color: var(--travel); } .mini .travel .l { color: var(--travel); }
  .mini .free { background: var(--free-soft); border-color: var(--free); } .mini .free .l { color: var(--free); }
  .mini .conf { background: var(--accent-soft); border-color: var(--accent); } .mini .conf .l { color: var(--accent); }
  .mini .paris { background: var(--paris-soft); border-color: var(--paris); } .mini .paris .l { color: var(--paris); }
  .mini .has-talk .l { color: var(--talk); font-weight: 700; }
  .mini .is-today { box-shadow: 0 0 0 2px var(--today); }
  .main { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .main li { display: grid; grid-template-columns: 3.4em 1fr; gap: 8px; min-width: 0; font-size: 15.5px; }
  .main .t { font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; color: var(--fg-muted); padding-top: 2px; }
  .main .s { min-width: 0; overflow-wrap: anywhere; font-weight: 550; }
  .main li.talk .s, .main li.talk .t { color: var(--talk); }
  .fold { border-top: 1px solid var(--line); padding-top: 8px; min-width: 0; }
  .fold > summary { cursor: pointer; font-size: 13.5px; color: var(--accent); font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
  .fold > summary::-webkit-details-marker { display: none; }
  .fold > summary::after { content: "展开"; font-weight: 400; color: var(--fg-muted); font-size: 12px; }
  .fold[open] > summary::after { content: "收起"; }
  html[lang="en"] .fold > summary::after { content: "Show"; }
  html[lang="en"] .fold[open] > summary::after { content: "Hide"; }
  .fold > .evs, .fold > .pl { margin-top: 10px; }
  .pl { display: grid; gap: 8px; }
  .pl .slot2 { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-muted); margin-top: 4px; }
  .pp { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; background: var(--surface); }
  .pp.mine { background: var(--talk-soft); border-color: var(--talk); }
  .pp > summary { cursor: pointer; list-style: none; display: grid; gap: 2px; min-width: 0; }
  .pp > summary::-webkit-details-marker { display: none; }
  .pp .m { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
  .pp.mine .m { color: var(--talk); font-weight: 600; }
  .pp .ti { font-weight: 600; font-size: 14px; line-height: 1.35; overflow-wrap: anywhere; }
  .pp p { margin: 8px 0 0; font-size: 13.5px; line-height: 1.6; overflow-wrap: anywhere; }
  .it { border-top: 1px solid var(--line); min-width: 0; }
  .it:first-child { border-top: 0; }
  .it > summary, .it > .row0 { display: grid; grid-template-columns: 3.4em 1fr auto; gap: 8px; padding: 9px 0; align-items: start; list-style: none; min-width: 0; }
  .it > summary { cursor: pointer; }
  .it > summary::-webkit-details-marker { display: none; }
  .it .t { font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; color: var(--fg-muted); padding-top: 2px; }
  .it .hd { min-width: 0; display: grid; gap: 2px; }
  .it .ti2 { font-weight: 600; font-size: 15.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .it .pl2 { font-size: 13px; color: var(--fg-muted); display: flex; align-items: center; gap: 4px; min-width: 0; overflow-wrap: anywhere; }
  .it.talk .ti2, .it.talk .t { color: var(--talk); }
  .it.ours .ti2, .it.ours .t { color: var(--accent); }
  .it .chev { color: var(--fg-muted); font-size: 12px; padding-top: 3px; }
  .it[open] .chev { transform: rotate(90deg); }
  .pin { width: 12px; height: 12px; flex: none; fill: var(--accent); }
  .badge { font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; margin-left: 4px; vertical-align: 1px; }
  .badge.ok { color: var(--free); } .badge.todo { color: var(--deadline); }
  .it .body { margin: 0 0 12px calc(3.4em + 8px); display: grid; gap: 8px; font-size: 14px; line-height: 1.55; min-width: 0; }
  .it .place { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; min-width: 0; }
  .it .place b { display: flex; align-items: center; gap: 5px; }
  .it .place span { color: var(--fg-muted); font-size: 13px; overflow-wrap: anywhere; }
  .it .place a { font-size: 13px; color: var(--accent); font-weight: 600; text-decoration: none; }
  .it .lab { font-size: 11.5px; font-weight: 700; color: var(--fg-muted); letter-spacing: .04em; }
  .it .body ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
  .it .body p { margin: 0; overflow-wrap: anywhere; }
  .items { display: grid; }
  .linkbtn { font: inherit; font-size: 13.5px; color: var(--accent); background: none; border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; }

  /* 论文 */
  .tools { display: grid; gap: 8px; }
  .search { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: inherit; font-size: 13px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
  .chip.now { border-color: var(--today); color: var(--today); }
  .lab2 { font-size: 11.5px; font-weight: 700; color: var(--fg-muted); letter-spacing: .04em; margin-top: 2px; }
  .countbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h, 98px)); z-index: 5; background: var(--bg); padding: 8px 0; border-bottom: 1px solid var(--line); }
  .count { font-size: 13.5px; color: var(--fg); }
  .count b { color: var(--accent); font-size: 17px; font-variant-numeric: tabular-nums; display: inline-block; }
  .count.bump b { animation: bump .35s ease-out; }
  .clear { font: inherit; font-size: 13px; font-weight: 600; color: var(--surface); background: var(--deadline); border: 0; border-radius: 999px; padding: 5px 12px; }
  mark { background: var(--mark); color: var(--mark-fg); border-radius: 3px; padding: 0 2px; }
  #list.swap > * { animation: rise .22s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { #list.swap > *, .count.bump b { animation: none; } }
  .tags { grid-column: 1; display: flex; flex-wrap: wrap; gap: 4px; }
  .tg { font: inherit; font-size: 11px; line-height: 1.5; padding: 0 7px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--fg-muted); }
  .tg.on { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
  .tg.tr { border-color: var(--accent); color: var(--accent); background: transparent; }
  .tg.tr.on { background: var(--accent); color: var(--surface); }
  .paper .who a { color: inherit; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 2px; }
  .paper .who .af { color: var(--skip); }
  .paper .who a.vf { text-decoration-color: var(--accent); color: var(--fg); }
  .gs { font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; color: var(--surface); background: var(--accent); border-radius: 3px; padding: 0 3px; margin-left: 3px; vertical-align: 1px; }
  .sess-head .meta { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .slotbox { border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); min-width: 0; scroll-margin-top: calc(var(--top-h, 98px) + 52px); overflow: hidden; }
  .slotbox > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline; padding: 13px 14px; }
  .slotbox > summary::-webkit-details-marker, .sess > summary::-webkit-details-marker, .paper > summary::-webkit-details-marker { display: none; }
  .slotbox[open] > summary { background: var(--accent); color: var(--surface); }
  .sl-t { font-family: var(--font-mono); font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .sl-d { font-size: 13.5px; white-space: nowrap; }
  .sl-n { font-size: 12.5px; opacity: .8; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; text-align: right; }
  .slotbox > summary { grid-template-columns: auto auto minmax(0, 1fr); }
  .sl-body { display: grid; gap: 8px; padding: 10px; background: var(--bg); }
  .sess { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; overflow: hidden; }
  .sess.has-mine { border-color: var(--talk); }
  .sess-head { list-style: none; cursor: pointer; padding: 10px 12px; display: grid; gap: 2px; }
  .sess[open] > .sess-head { background: var(--surface-2); border-bottom: 1px solid var(--line); }
  .sess-head .code { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-muted); }
  .sess-head .code b { color: var(--talk); }
  .sess-head .trk { font-family: var(--font-body); font-size: 11px; font-weight: 700; color: var(--surface); background: var(--accent); border-radius: 4px; padding: 1px 6px; }
  .sess-head .topic { font-weight: 650; font-size: 15px; line-height: 1.35; }
  .sess-head .meta { font-size: 12.5px; color: var(--fg-muted); }
  .paper { border-top: 1px solid var(--line); min-width: 0; }
  .paper:first-of-type { border-top: 0; }
  .paper > summary { list-style: none; cursor: pointer; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; min-width: 0; }
  .paper.mine > summary { background: var(--talk-soft); } .paper.ours > summary { background: var(--accent-soft); } .paper.key > summary { background: var(--paris-soft); }
  .paper .when { grid-column: 1 / -1; font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
  .paper .when b { color: var(--talk); } .paper .when b.rec { color: var(--today); }
  .paper .title { font-weight: 600; font-size: 14.5px; line-height: 1.35; min-width: 0; overflow-wrap: anywhere; }
  .paper[open] .title { color: var(--accent); }
  .paper .pbody { padding: 0 12px 12px; display: grid; gap: 8px; min-width: 0; }
  .paper .sum { font-size: 14px; line-height: 1.65; margin: 0; overflow-wrap: anywhere; }
  .paper .who { font-size: 12.5px; color: var(--fg-muted); line-height: 1.6; min-width: 0; overflow-wrap: anywhere; }
  .paper .who .spk { color: var(--fg); font-weight: 600; margin-right: 4px; }
  .paper .when2 { font-size: 12px; color: var(--fg-muted); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .paper .basis { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-muted); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 4px; margin-right: 6px; white-space: nowrap; }
  .paper > summary .star { grid-column: 2; grid-row: 2 / span 2; }
  .star { font-size: 20px; line-height: 1; background: none; border: 0; color: var(--line-strong); padding: 0 2px; align-self: start; }
  .star[aria-pressed="true"] { color: var(--star); }
  .empty { color: var(--fg-muted); padding: 24px 0; text-align: center; }
  .foot { color: var(--fg-muted); font-size: 12px; }

  /* 顶栏：标题 + 语言切换 + 搜索框，整体固定 */
  .brand { align-items: center; }
  .brand h1 { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lang { flex: none; font: inherit; font-size: 12px; font-weight: 700; line-height: 1.4; min-width: 34px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--fg-muted); }
  .top .search { padding: 8px 12px; }
  .chip .cnt { font-family: var(--font-mono); font-size: 11.5px; margin-left: 2px; }

  /* 我的日程 */
  .ag-note { margin: 0; font-size: 12.5px; color: var(--fg-muted); }
  .ag-day { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px; overflow: hidden; min-width: 0; }
  .ag-day > h2 { margin: 0; padding: 9px 12px; font-size: 15px; font-weight: 650; background: var(--accent); color: var(--surface); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .ag-day > h2 span { font-size: 12.5px; font-weight: 400; opacity: .9; }
  .ag-slot { font-family: var(--font-mono); font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--fg-muted); padding: 4px 12px; background: var(--surface-2); border-top: 1px solid var(--line); }
  .ag { border-top: 1px solid var(--line); border-left: 4px solid transparent; min-width: 0; }
  .ag.clash { border-left-color: var(--talk); background: var(--talk-soft); }
  .ag > .ag-row { cursor: pointer; display: grid; grid-template-columns: 3.2em minmax(0, 1fr) auto auto; gap: 1px 8px; padding: 6px 10px 6px 8px; align-items: center; }
  .ag-t { grid-column: 1; grid-row: 1 / span 2; align-self: start; font-family: var(--font-mono); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ag-m { grid-column: 2; grid-row: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; min-width: 0; font-size: 12px; line-height: 1.5; }
  .ag-room { font-weight: 700; padding: 0 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .ag-room.moved { background: var(--accent); color: var(--surface); }
  .ag-pos { font-weight: 700; padding: 0 6px; border-radius: 999px; border: 1.5px solid var(--travel); color: var(--travel); white-space: nowrap; font-variant-numeric: tabular-nums; }

I1","track":"ml","topic":"Accountability, interpretability, and transparency of ML","room":1,"roomName":"King Willem Alexander","day":18,"start":"13:30","end":"15:30","chair":"Rui Wang","n":8},{"code":"I2","track":"ac","topic":"Protocol security","room":2,"roomName":"Princes Ariane","day":18,"start":"13:30","end":"15:30","chair":"Dazhuang Liu","n":8},{"code":"I3","track":"sw","topic":"Reverse engineering","room":3,"roomName":"Princes Alexia","day":18,"start":"13:30","end":"15:30","chair":"Bart Coppens","n":8},{"code":"I4","track":"ac","topic":"Oblivious algorithms and data structures","room":4,"roomName":"Oceania Foyer","day":18,"start":"13:30","end":"15:30","chair":"Debajyoti Das","n":8},{"code":"I5","track":"use","topic":"Security and privacy measurement","room":5,"roomName":"Oceania","day":18,"start":"13:30","end":"15:30","chair":"Yinzhi Cao","n":8},{"code":"I6","track":"pa","topic":"Web privacy","room":6,"roomName":"Europe 1+2","day":18,"start":"13:30","end":"15:30","chair":"Aaron Johnson","n":8},{"code":"I8","track":"bd","topic":"Smart contracts and applications","room":8,"roomName":"Antartica","day":18,"start":"13:30","end":"15:30","chair":"Sisi Duan","n":8},{"code":"EV5","track":"ev","topic":"闭幕","topicEn":"Closing","day":18,"start":"16:00","end":"16:15","room":"wf","chair":"","n":1,"roomName":"World Forum","roomLabel":"World Forum，官网未列房间","roomLabelEn":"World Forum, room not listed","roomShort":"World Forum","roomShortEn":"World Forum"}],"papers":[{"id":"A#777","title":"Expose Your Disguise: Recovering Source Speaker Identity From Voice Conversion","authors":"Hanlei Zhang (Zhejiang University), Zhongming Ma (Zhejiang University), Mingyang Zhang (Ant Group), Tengfei Liu (Ant Group), Yushi Cheng (Zhejiang University), Yanjiao Chen (Zhejiang University)","speaker":"","s":"A1","pos":1,"sum":"针对 voice conversion 的取证溯源：给一段变声后的音频，反推原说话人身份。TRIDENT 用一个主提取器加两个辅助分支，一个识别用的是哪类变声模型，一个抽取残留的源说话人表征。卖点是攻击者用的模型未知时也能泛化，因为主流 VC 模型同出几个家族。","basis":"abs"},{"id":"A#3464","title":"PathMark: Protecting Intellectual Property of Mixture-of-expert LLMs via Path Watermarks","authors":"Yudong Gao (The Hong Kong University of Science and Technology), Qingyue Wang (The Hong Kong University of Science and Technology), Yuanyuan Yuan (Tsinghua University), Ruixuan Huang (The Hong Kong University of Science and Technology), Linghan Chen (Adelaide University), Zimo Ji (The Hong Kong University of Science and Technology), Shuai Wang (Hong Kong University of Science and Technology)","speaker":"Yudong Gao","s":"A1","pos":2,"sum":"给 Mixture-of-Experts LLM 做模型水印。传统参数水印默认被标记的参数总会被激活，MoE 的动态路由打破了这个假设。PathMark 反过来把路由本身当隐蔽信道：触发词出现时强制 token 走预定的 expert 子集，以路径签名作为所有权证据。","basis":"abs"},{"id":"B#2614","title":"Tsuikami: Robust Cross-Channel Source Speaker Tracing Under Voice Conversion","authors":"Zhongming Ma (Zhejiang University), Hanlei Zhang (Zhejiang University), Shibo Wang (Zhejiang University), Yanjiao Chen (Zhejiang University), Yushi Cheng (Zhejiang University), Wenyuan Xu (Zhejiang University)","speaker":"","s":"A1","pos":3,"sum":"与同场 A#777 是同一组人的姊妹篇，同样做变声后的源说话人追踪，从标题看重点在跨信道鲁棒性，即经过电话、压缩等信道失真后仍能追到人。","basis":"title"},{"id":"B#2765","title":"SEAL: Reinforcing Global Safety in Mixture-of-Experts through Shared Expert ALignment","authors":"Qingyu Meng (Vrije Universiteit Amsterdam), Yiwei Zha (Vrije Universiteit Amsterdam), Jiahuan Pei (Vrije Universiteit Amsterdam), Koen Hindriks (Vrije Universiteit Amsterdam), Herbert Bos (Vrije Universiteit Amsterdam), Min Chen (Vrije Universiteit Amsterdam)","speaker":"Qingyu Meng, Yiwei Zha","s":"A1","pos":4,"sum":"MoE 模型的安全对齐取决于哪些 expert 被激活，jailbreak、恶意微调和剪枝都能绕开负责拒答的 expert。已有防御只加固 router，SEAL 改为把安全能力对齐到 hybrid MoE 里始终激活的 shared experts 上，使安全不再依赖路由选择。","basis":"abs"},{"id":"A#54","title":"Breaking the Curse of Dimensionality: Fuzzy PSI without O((logδ)^d) Overhead","authors":"Cong Zhang (Tsinghua University), Yang Cao (Shandong University), Yujie Bai (Hangzhou High-Tech Zone (Binjiang) Institute of Blockchain and Data Security), Shuaishuai Li (Zhongguancun Laboratory), Juntong Lin (Shandong University), Yu Chen (Shandong University), Anyu Wang (Tsinghua University), Xiaoyun Wang (Tsinghua University)","speaker":"Cong Zhang","s":"A2","pos":1,"sum":"Fuzzy PSI 的高维问题：此前协议的开销随维度 d 呈 (log δ)^d 增长。本文去掉这个指数依赖。与同场 A#1326、B#567 是同一问题的三篇，清华 Xiaoyun Wang 组。","basis":"title"},{"id":"A#1326","title":"Towards Scalable Fuzzy PSI via Efficient Fuzzy Matching","authors":"Meng Hao (Singapore Management University), Xinpeng Yang (Nanyang Technological University), Hanxiao Chen (University of Electronic Science and Technology of China), Tianwei Zhang (Nanyang Technological University), Haiyang Xue (Singapore Management University), Guomin Yang (Singapore Management University), Hongwei Li (University of Electronic Science and Technology of China), Robert H. Deng (Singapore Management University)","speaker":"Meng Hao","s":"A2","pos":2,"sum":"Fuzzy PSI：两方找出各自集合里距离在阈值内的近似匹配元素，不泄露其他信息。本文支持一般 Lp 距离和高维数据，核心是两个 fuzzy matching 协议：一个基于角色互换的 OPRF，开销从此前的 O((log δ)^d) 降到 O(d log δ)；另一个基于定制 OT，适合短输入。","basis":"abs"},{"id":"B#567","title":"Efficient Fuzzy PSI under One-Sided Assumptions","authors":"Xinpeng Yang (Nanyang Technological University), Meng Hao (Singapore Management University), Yanxue Jia (Illinois Institute of Technology), Chenkai Weng (Arizona State University), Yonggang Wen (Nanyang Technological University), Tianwei Zhang (Nanyang Technological University)","speaker":"Xinpeng Yang","s":"A2","pos":3,"sum":"同场第三篇 fuzzy PSI。已有构造要么要求双方的点都满足几何分离假设，要么在只有单方满足时开销很大。本文给出单方假设下首个具体高效的方案，支持一般 Minkowski 距离。和 A#1326 是同一批作者的延续工作。","basis":"abs"},{"id":"B#5468","title":"Maliciously Secure Shuffled Distributed OPRF with Applications to Private Set Operations","authors":"Aron van Baarsen (Aarhus University), Aarushi Goel (Rutgers University), Lisa Kohl (CWI), Peihan Miao (Brown University), Phuoc Van Long Pham (Brown University), Peter Scholl (Aarhus University), Satvinder Singh (Purdue University)","speaker":"Aron van Baarsen","s":"A2","pos":4,"sum":"PSI 的增强变体，如 PSI-Cardinality、PSI-Sum、Circuit-PSI、Private Set Union，在 malicious 安全下比 semi-honest 慢很多。本文构造 malicious 安全的 shuffled distributed OPRF 作为通用构件，缩小这一差距。","basis":"abs"},{"id":"A#1939","title":"KingsGuard: Enclave Data Protection Under Real-World TEE Vulnerabilities","authors":"Saltanat Firdous Allaqband (Indian Institute of Technology Madras), Deepanjali S (Indian Institute of Technology Madras), Rohit Srinivas R G (Indian Institute of Technology Madras), Devashish Gosain (Indian Institute of Technology Bombay), Chester Rebeiro (Indian Institute of Technology Madras)","speaker":"Saltanat Firdous","s":"A3","pos":1,"sum":"TEE 的隔离保证会被 enclave 代码漏洞和硬件设计缺陷绕开。KingsGuard 是一种新的 TEE 设计，在 enclave 内部做细粒度的数据流追踪，监控并限制敏感数据的传播，使已知的真实 TEE 漏洞也泄露不出数据。","basis":"abs"},{"id":"B#56","title":"PaDEx: Addressing Mobile GPU MMIO Risks via Prohibition and Delayed Execution","authors":"Feifan Qian (Institute of Information Engineering, Chinese Academy of Sciences), Qihang Zhou (Institute of Information Engineering, Chinese Academy of Sciences), Nan Jiang (Institute of Information Engineering, Chinese Academy of Sciences), Yuanbo Zhao (Institute of Information Engineering, Chinese Academy of Sciences), Xiaolong Yan (Institute of Information Engineering, Chinese Academy of Sciences), Wenzhuo Cao (Institute of Information Engineering, Chinese Academy of Sciences), Shaowen Xu (Institute of Information Engineering, Chinese Academy of Sciences), Yong Liu (Qi An Xin Technology Group Inc.), Zhenyu Song (Institute of Information Engineering, Chinese Academy of Sciences), Xiaoqi Jia (Institute of Information Engineering, Chinese Academy of Sciences), Shengzhi Zhang (Boston University)","speaker":"Feifan Qian","s":"A3","pos":2,"sum":"移动 GPU 的 MMIO 接口带来的安全风险，例如驱动或恶意代码借 MMIO 越权访问。PaDEx 用禁止加延迟执行两种手段来约束。中科院信工所。","basis":"title"},{"id":"B#2110","title":"Hoss: Fast Oblivious Semantic Search with Heterogeneous GPU-CPU-TEE Architecture","authors":"Jianzhang Du (Indiana University), Weijie Huang (Indiana University), Chenghong Wang (Indiana University), Nicolas Tsagareli (Binghamton University), Yukui Luo (Binghamton University), XiaoFeng Wang (Nanyang Technological University), Zhongshu Gu (IBM Research)","speaker":"Weijie Huang","s":"A3","pos":3,"sum":"不经意的语义检索：向量检索时既隐藏数据内容也隐藏访问模式。现有最优系统 Compass 在 HNSW 图上做 ORAM，瓶颈是 ORAM 访问的带宽下界。Hoss 换架构，用 GPU、CPU、TEE 异构协同绕开这个瓶颈。和 RAG 隐私相关。","basis":"abs"},{"id":"B#6186","title":"Attest the Whole, Verify Incrementally: Whole-Program Integrity via Lazy Verification in Trusted Execution Environments","authors":"Zhen Huang (Shanghai Jiao Tong University), Junhong Cheng (Shanghai Jiao Tong University), Yijia Ma (Shanghai Jiao Tong University), Guoxing Chen (Shanghai Jiao Tong University), Zhezhi He (Shanghai Jiao Tong University), Yan Meng (Shanghai Jiao Tong University), Mengmeng Zhou (Beijing Academy of Blockchain and Edge Computing, BAEC), Haojin Zhu (Shanghai Jiao Tong University)","speaker":"Zhen Huang","s":"A3","pos":4,"sum":"TEE 的远程证明通常只度量加载时的代码。本文做整程序完整性：证明覆盖全程序，验证则按需、增量地进行，以降低启动开销。上交 Haojin Zhu 组。","basis":"title"},{"id":"A#666","title":"MAKO: Refining Indirect-Call Targets with Type Relation Unfolding","authors":"Yibo Jin (Hong Kong University of Science and Technology), Wei Chen (Hong Kong University of Science and Technology), Bowen Zhang (Hong Kong University of Science and Technology), Charles Zhang (Hong Kong University of Science and Technology)","speaker":"Yibo Jin","s":"A4","pos":1,"sum":"间接调用目标解析，是 CFI 和静态分析的基础问题。基于类型的方法可扩展但会引入大量不可行的被调函数。MAKO 认为已有精化手段忽略了类型之间的关系，通过展开类型关系来剔除伪目标，兼顾精度和开销。","basis":"abs"},{"id":"A#1938","title":"The Illusion of Rust Safety: Detecting Modular Unsafe Functions with LLMs","authors":"Xiang Cheng (Georgia Institute of Technology), Fan Sang (Georgia Institute of Technology), Yibin Yang (University of Toronto and NTT Research), Hang Zhang (Indiana University), Sangdon Park (Pohang University of Science and Technology), Xiaokuan Zhang (George Mason University), Taesoo Kim (Georgia Institute of Technology and Microsoft)","speaker":"","s":"A4","pos":2,"sum":"用 LLM 检测 Rust 里的“模块化 unsafe”问题：单个函数标着 safe，但其安全性依赖模块内其他代码维持的不变量，编译器查不出来。Taesoo Kim 组的工作，属于 LLM 辅助程序分析。","basis":"title"},{"id":"B#5330","title":"Divide and Conquer: Exposing SAST Rule Flaws via Realistic Variant Synthesis from Millions of Repositories","authors":"Zongze Jiang (Huazhong University of Science and Technology), Ming Wen (Huazhong University of Science and Technology), Zifan Xie (Chongqing University), Yuan Zhang (Fudan University), Deqing Zou (Huazhong University of Science and Technology), Hai Jin (Huazhong University of Science and Technology)","speaker":"Zongze Jiang","s":"A4","pos":3,"sum":"静态分析工具（SAST）的检测规则本身有漏报盲区。本文从数百万开源仓库中合成贴近真实的代码变体，用来系统暴露规则缺陷。华科。","basis":"title"},{"id":"B#5645","title":"ContractGuard: Auditing Semantic Contracts of MCP Tools for Security Violations","authors":"Hengkai Ye (The Pennsylvania State University), Zhechang Zhang (The Pennsylvania State University), Ruibo Lu (The Pennsylvania State University), Jinyuan Jia (The Pennsylvania State University), Hong Hu (The Pennsylvania State University)","speaker":"Ruibo Lu","s":"A4","pos":4,"sum":"审计 MCP 工具的语义契约：工具的自然语言描述与其实际行为是否一致，不一致处就是 agent 被误导或越权的入口。属于 agent 工具链供应链安全。","basis":"title"},{"id":"B#626","title":"Omniscience for the Masses: New Threats in the Metaverse's Democratized World Creation","authors":"Andrea Mengascini (CISPA Helmholtz Center for Information Security), Ryan Aurelio (CISPA Helmholtz Center for Information Security), Jason Polakis (University of Illinois Chicago), Giancarlo Pellegrino (CISPA Helmholtz Center for Information Security)","speaker":"Andrea Mengascini","s":"A5","pos":1,"sum":"元宇宙平台如 Roblox、Horizon Worlds、VRChat 让普通用户创建虚拟世界，等于把社交交互的控制权交给不可信的创建者。本文首次系统研究恶意世界创建者能做什么，比如全知式地监视世界里的用户，并评估各平台的防护。","basis":"abs"},{"id":"B#1285","title":"An Empirical Study of Observability Limits in Advanced Software Supply Chain Attacks","authors":"Zhuoran Tan (University of Glasgow), Wenbo Guo (Nanyang Technological University), Jiewen Luo (Royal Holloway, University of London), Taylor Brierley (JUMPSEC Ltd), Jeremy Singer (University of Glasgow), Christos Anagnostopoulos (University of Glasgow)","speaker":"Zhuoran Tan","s":"A5","pos":2,"sum":"高级软件供应链攻击只在运行时现形，证据散落在主机、服务、构建和依赖各层。作者构建 SynthChain 数据集：多源运行时监控数据加整条攻击链的 ground truth，取材于真实恶意包，用来量化这类攻击的可观测性上限。","basis":"abs"},{"id":"B#2826","title":"It Takes a Forum: Resources & Stakeholders Sustaining the Online Synthetic Non-Consensual Intimate Image Creation Ecosystem","authors":"Bernardo B. P. Medeiros (University of Florida), Malvika Jadhav (University of Florida), Allison Lu (University of Florida), Tadayoshi Kohno (Georgetown University), Vincent Bindschaedler (University of Florida), Kevin R. B. Butler (University of Florida)","speaker":"Bernardo B. P. Medeiros","s":"A5","pos":3,"sum":"合成的未经同意私密影像（SNCII）生态的测量。分析 28 万条 4chan 评论和 7.8 万条 Reddit 帖子，刻画不同社区里的角色分工：技术能力强的人聚在 4chan 提供资源和方法，低门槛终端用户活跃在 Reddit。","basis":"abs"},{"id":"B#3501","title":"''Shut Up and Let Me Enjoy My Otome': Understanding and Measuring the Toxicity in Otome Game Communities","authors":"Yage Zhang (CISPA Helmholtz Center for Information Security), Xinyue Shen (University of Waterloo), Yukun Jiang (CISPA Helmholtz Center for Information Security), Michael Backes (CISPA Helmholtz Center for Information Security), Yang Zhang (CISPA Helmholtz Center for Information Security)","speaker":"Yage Zhang","s":"A5","pos":4,"sum":"乙女游戏社区的毒性言论测量。数据来自微博和 Reddit 上六个社区的 60 万条帖子，用模型标注毒性并分析攻击对象的分布。偏社会计算。","basis":"title"},{"id":"A#784","title":"Hitchhiking on Inherent Randomness: Diffusion-based Graph Generation under Differential Privacy","authors":"Renxuan Hou (The Hong Kong Polytechnic University), Qingqing Ye (The Hong Kong Polytechnic University), Lyu Xu (Nanyang Technological University), Xun Ran (The Hong Kong Polytechnic University), Haibo Hu (The Hong Kong Polytechnic University)","speaker":"Qingqing Ye","s":"A6","pos":1,"sum":"差分隐私下的图生成，用 diffusion 模型。从标题看思路是借用扩散过程自带的随机性来抵扣一部分隐私噪声，而不是额外再加噪。作者是港理工 Haibo Hu、Qingqing Ye 组。","basis":"title"},{"id":"A#2916","title":"An Iconic Heavy Hitters Algorithm Made Private","authors":"Rayne Holland (CSIRO)","speaker":"","s":"A6","pos":2,"sum":"把实践中效果最好的 heavy hitter 流算法 SpaceSaving 做成差分隐私版本。做法是对非隐私的 summary 做后处理：加渐近最优的噪声，再用一条校准过的选择规则压掉不稳定的标签。此前只有 Misra-Gries 有 DP 版本。","basis":"abs"},{"id":"A#3032","title":"Function Privatization in the Local Model","authors":"Yuting Liang (University of Toronto), Tian Shu (Hong Kong University of Science and Technology), Ke Yi (Hong Kong University of Science and Technology)","speaker":"","s":"A6","pos":3,"sum":"本地模型下私有地发布函数，主要是曲线，比如轨迹或一维密度曲线。标准 LDP 要求任意两条曲线不可区分，效用太差，所以采用 Geo-Privacy 这种 metric DP：相近的函数强保护，相距远的允许区分。与周一 C6 场的 B#89、B#162 同属 metric 隐私设定。","basis":"abs"},{"id":"B#7126","title":"Edit-Neighboring Data Streams and Privacy under Continual Observation","authors":"Joel Daniel Andersson (Institute of Science and Technology Austria), Anamay Chaturvedi (Institute of Science and Technology Austria), Monika Henzinger (Institute of Science and Technology Austria), Roodabeh Safavi (Institute of Science and Technology Austria)","speaker":"","s":"A6","pos":4,"sum":"continual observation 下的 DP，提出更严格的邻接定义：一个人的参与可能让整条流整体错位一个时间步，即 edit-neighboring。结论偏负面：在这一定义下所有加性噪声机制的误差下界是多项式级的 T^{1/3}，而标准邻接下只有 polylog。Monika Henzinger 组的理论工作。","basis":"abs"},{"id":"A#469","title":"NVBleed: Covert and Side-Channel Attacks on NVIDIA Multi-GPU Interconnect","authors":"Yicheng Zhang (University of California, Riverside), Ravan Nazaraliyev (University of California, Riverside), Sankha Baran Dutta (Brookhaven National Laboratory), Andres Marquez (Pacific Northwest National Laboratory), Kevin J. Barker (Pacific Northwest National Laboratory), Nael Abu-Ghazaleh (University of California, Riverside)","speaker":"Yicheng Zhang","s":"A7","pos":1,"sum":"NVIDIA 多 GPU 互联 NVLink 上的隐蔽信道和侧信道。作者逆向 NVLink 的工作方式，找到可被利用的泄露源，在多 GPU 的 HPC 和云环境里实现跨 GPU 的信息泄露。对多租户 ML 集群有现实意义。","basis":"abs"},{"id":"A#1547","title":"It's About Time: Detecting Timing Side-Channel Vulnerabilities in High-Level Synthesis Designs","authors":"Denis Zuppiger (ETH Zurich), Katharina Ceesay-Seitz (ETH Zurich), Jiahui Xu (ETH Zurich), Lana Josipović (ETH Zurich), Kaveh Razavi (ETH Zurich)","speaker":"Denis Zuppiger, Katharina Ceesay-Seitz","s":"A7","pos":2,"sum":"高层次综合（HLS）把 C 代码生成硬件，可能引入时序侧信道。本文自动检测 HLS 设计里的这类漏洞。ETH Kaveh Razavi 组。","basis":"title"},{"id":"B#882","title":"FrontSpec: Uncovering and Characterizing Frontend Memory Predictors on Apple M4 Processors","authors":"Han Wang (Southern University of Science and Technology), Yuhao Hu (Institute of Computing Technology, CAS), Yusi Feng (Southern University of Science and Technology), Quancheng Wang (Wuhan University), Ke Xu (Wuhan University), Tang Ming (Wuhan University), Yun Chen (Hong Kong University of Science and Technology (Guangzhou)), Zhe Wang (Institute of Computing Technology, CAS), Chenggang Wu (Institute of Computing Technology, CAS), Yinqian Zhang (Southern University of Science and Technology)","speaker":"","s":"A7","pos":3,"sum":"逆向并刻画 Apple M4 处理器前端的内存相关预测器，这是推测执行攻击的新素材。南科大 Yinqian Zhang 组。","basis":"title"},{"id":"B#5691","title":"MChammer: A Systematic Characterization of CPU-Level Rowhammer Countermeasures on DDR5 Systems","authors":"Ingab Kang (University of Michigan), Christina Garman (Purdue University), Daniel Genkin (Georgia Tech)","speaker":"Ingab Kang","s":"A7","pos":4,"sum":"系统评估 DDR5 平台上 CPU 层面的 Rowhammer 防御措施到底有多有效。Michigan 与 Georgia Tech 的 Daniel Genkin 组。","basis":"title"},{"id":"A#16","title":"The Trade-off Between Performance and Security: Exploring Vulnerabilities in DNS Task Queue Scheduling","authors":"Shiming Liu (Tsinghua University), Yunyi Zhang (Tsinghua University), Ruixuan Li (Tsinghua University), Shiyao Guo (Tsinghua University), Baojun Liu (Tsinghua University), Donghong Sun (Tsinghua University), Yong Ma (Alibaba Group), Linjian Song (Alibaba Group)","speaker":"Shiming Liu","s":"A8","pos":1,"sum":"DNS 解析器为性能做的任务队列调度会引入可利用的弱点，攻击者可借此拖慢或干扰解析。清华 Baojun Liu 组。","basis":"title"},{"id":"A#1760","title":"Good Cache, BAD Cache: Exploiting DNSSEC Validation Failures for DNS Cache Poisoning Attacks","authors":"Shiming Liu (Tsinghua University), Yunyi Zhang (Tsinghua University), Chaoyi Lu (Zhongguancun Laboratory), Baojun Liu (Tsinghua University), Shuhan Zhang (Tsinghua University), Donghong Sun (Tsinghua University), Yong Ma (Alibaba Group), Linjian Song (Alibaba Group)","speaker":"Shiming Liu","s":"A8","pos":2,"sum":"利用 DNSSEC 验证失败时解析器的缓存行为做 DNS 缓存投毒：验证失败的记录本不该进缓存，但一些实现处理不当。与 A#16 同组。","basis":"title"},{"id":"A#726","title":"RT-MD: Host-Centric Real-Time Detection of Multi-Domain DNS Data Exfiltration","authors":"Pengfei Ren (University of Science and Technology of China), Lutong Chen (University of Science and Technology of China), Xuanbo Huang (Xi'an Jiaotong University), Jiankang Sun (University of Science and Technology of China), Huanjie Zhang (University of Science and Technology of China), Jian Li (University of Science and Technology of China), Kaiping Xue (University of Science and Technology of China)","speaker":"Pengfei Ren","s":"A8","pos":3,"sum":"主机侧实时检测通过多个域名分散进行的 DNS 数据外泄，这种分散方式能规避针对单个域名的检测。中科大。","basis":"title"},{"id":"A#2628","title":"Robust Logical Foundations for Mechanizing Post-Quantum Cryptography in Squirrel","authors":"David Baelde (Univ Rennes, CNRS), Antoine Dallon (AMIAD), Stéphanie Delaune (Univ Rennes, CNRS), Charlie Jacomme (Université de Lorraine, CNRS, Inria), Adrien Koutsos (Inria)","speaker":"Adrien Koutsos","s":"A9","pos":1,"sum":"在 Squirrel 证明助手里机械化验证后量子密码协议，本文给它补上更稳健的逻辑基础。Squirrel 用于计算模型下的协议安全证明，作者来自 Inria、Rennes。","basis":"title"},{"id":"A#2766","title":"Symbolic Protocol Verification modulo XOR in ProVerif","authors":"Vincent Cheval (University of Oxford), Stéphanie Delaune (Univ Rennes, CNRS)","speaker":"Stéphanie Delaune","s":"A9","pos":2,"sum":"在 ProVerif 里支持模 XOR 的符号化协议验证。XOR 的代数性质一直是符号工具的难点。","basis":"title"},{"id":"B#2465","title":"From Specs to Apps: Verifying and Monitoring Models of Signal and WhatsApp","authors":"Moustafa Said (CISPA Helmholtz Center for Information Security), Aurora Naska (CISPA Helmholtz Center for Information Security), Kevin Morio (CISPA Helmholtz Center for Information Security), Robert Künnemann (CISPA Helmholtz Center for Information Security)","speaker":"Moustafa Said","s":"A9","pos":3,"sum":"Signal 协议本身有很强的形式化安全证明，但规范和实际 App 的实现之间有差距。本文为 Signal 和 WhatsApp 建立形式化模型并验证，再做运行时监控，检查真实应用的行为是否符合模型。CISPA。","basis":"abs"},{"id":"B#3083","title":"Less Effort, Shorter Proofs: Reinforcement Learning for Security Protocol Analysis in Tamarin","authors":"Matthias Cosler (CISPA Helmholtz Center for Information Security), Cas Cremers (CISPA Helmholtz Center for Information Security), Bernd Finkbeiner (CISPA Helmholtz Center for Information Security), Mohamed Ghanem (CISPA Helmholtz Center for Information Security), Niklas Medinger (CISPA Helmholtz Center for Information Security)","speaker":"Niklas Medinger, Matthias Cosler","s":"A9","pos":4,"sum":"用强化学习做安全协议验证的证明搜索。Tamarin 验证真实协议如 5G、EMV 需要大量人工引导；作者借鉴 AlphaZero 和 AlphaProof，给 Tamarin 做了无状态 API 充当环境，训练出的策略能用更少的人力得到更短的证明。CISPA Cas Cremers 组。","basis":"abs"},{"id":"A#787","title":"Fundamental Limitations of Favorable Privacy–Utility Guarantees for DP-SGD","authors":"Murat Bilgehan Ertan (Centrum Wiskunde & Informatica (CWI)), Marten van Dijk (Centrum Wiskunde & Informatica (CWI))","speaker":"Murat Bilgehan Ertan","s":"B1","pos":1,"sum":"DP-SGD 的理论上限。在 f-DP 框架下分析单轮 shuffled sampling，证明要让 trade-off 曲线贴近随机猜测线，就必须付出很大的噪声代价，也就是说在最坏情况的隐私定义下 DP-SGD 不存在既强隐私又高效用的区间。负面结果，适合引用。","basis":"abs"},{"id":"A#1151","title":"What Does the Server See- Understanding Privacy Leakage from Large Language Models in Split Inference","authors":"Mingyuan Fan (East China Normal University), Yu Liu (East China Normal University), Fuyi Wang (RMIT University), Cen Chen (East China Normal University)","speaker":"Mingyuan Fan","s":"B1","pos":2,"sum":"LLM split inference 的隐私到底有多少。ActInv 通过匹配中间激活重建客户端输入，在加高斯噪声、激活稀疏化等常见防御下仍能高保真恢复。后半部分给出一个分析框架，解释这些扰动防御为什么不起作用。","basis":"abs"},{"id":"A#1501","title":"Don't Trust the AI Ecosystem: Analyzing Privacy Leakage in Compromised Open-Source Components","authors":"Jin-Seong Kim (Yonsei University), Han-Ju Lee (Yonsei University), Seok-Won Hong (Yonsei University), Takeshi Takahashi (National Institute of Information and Communications Technology), Chansu Han (National Institute of Information and Communications Technology), Tomohiro Morikawa (University of Hyogo), Seok-Hwan Choi (Yonsei University)","speaker":"Jin-Seong Kim","s":"B1","pos":3,"sum":"供应链被攻陷情形下的训练数据窃取。以往的 model inversion 是训练后靠优化去反推，只能恢复出类别级的泛化特征。GradLock 在训练期动手：被污染的开源组件把敏感训练样本直接、隐蔽地写进模型参数里的独立存储区，之后可以确定性地取回具体样本，而不是模糊的类别印象。","basis":"abs"},{"id":"B#478","title":"Adaptive Diffusion Freezing: Privacy-preserving Diffusion Models Against Membership Inference Attacks","authors":"Jialu Guo (Beihang University), Xiao Han (Beihang University), Junjie Wu (Beihang University)","speaker":"JIALU GUO","s":"B1","pos":4,"sum":"防 diffusion 模型的 membership inference。ADF 在训练时用一个 mask 矩阵控制不同数据子集参与哪些 timestep，降低过度记忆，使成员与非成员样本上的模型行为更一致。主打隐私、效用、效率三者的折中优于已有方法。","basis":"abs"},{"id":"B#2057","title":"When Topology Betrays Privacy: Lattice-Based Reconstruction Attacks on Secure Aggregation in Decentralized Federated Learning","authors":"Wenrui Yu (Aalborg University), Changlong Ji (Institut Polytechnique de Paris), Johannes Bjerva (Aalborg University), Qiongxiu Li (Aalborg University)","speaker":"Wenrui Yu","s":"B1","pos":5,"sum":"去中心化联邦学习里的 secure aggregation 并不安全。稀疏拓扑让串通的半诚实节点看到多组不同的邻域聚合，相当于拿到诚实节点私有状态的多个隐藏线性组合；作者把恢复问题归约到 Hidden Subset Sum 类的格问题并求解。","basis":"abs"},{"id":"B#4841","title":"MOSAIC: Masked Outsourcing of Secure AI Computations","authors":"James Hsin-yu Chiang (ETH Zurich), Sheila Zingg (ETH Zurich), Kari Kostiainen (ETH Zurich), Srdjan Capkun (ETH Zurich)","speaker":"James Hsin-Yu Chiang","s":"B1","pos":6,"sum":"弱客户端把 AI 推理外包给不可信服务器，模型和输入都要保密。核心是一个新的矩阵乘法掩码协议，通过在结果里引入少量噪声换取渐近最优的客户端开销，能撑起大型 transformer 推理，安全性归约到 LWE 和 LPN。ETH Capkun 组。","basis":"abs"},{"id":"A#363","title":"Designated-Verifier Dynamic zk-SNARKs with Applications to Dynamic Proofs of Index","authors":"Weijie Wang (Yale University), Charalampos Papamanthou (Yale University), Shravan Srinivasan (Lagrange Labs), Dimitrios Papadopoulos (Hong Kong University of Science & Technology)","speaker":"Weijie Wang","s":"B2","pos":1,"sum":"Dynamic zk-SNARK 允许在陈述和见证小幅变化时增量更新证明，而不是重算。本文给出 designated-verifier 版本，更新开销大致正比于变化量，并应用到动态索引证明上。Yale Papamanthou 组。","basis":"abs"},{"id":"A#1956","title":"LUNA+: More Succinct Post-Quantum ZK-SNARKs from Computational Privacy","authors":"Yuki Kume (Monash University), Ron Steinfeld (Monash University), Amin Sakzad (Monash University), Mert Yassi (Monash University)","speaker":"Yuki Kume","s":"B2","pos":2,"sum":"更简洁的后量子 zk-SNARK，标题说利用计算意义下的隐私来缩短证明。Monash Ron Steinfeld 组，基于格。","basis":"title"},{"id":"B#2798","title":"MAYA: A Short Shuffle Argument With Fast Verification","authors":"Thi Van Thao Doan (UCLouvain), Olivier Pereira (UCLouvain), Thomas Peters (UCLouvain)","speaker":"Thi Van Thao Doan","s":"B2","pos":3,"sum":"电子投票里 mixnet 的 shuffle argument 是审计数据的大头，已部署系统的证明大小与密文数成线性，百万张票要几 GB。MAYA 是一个证明短、验证快的 shuffle argument。UCLouvain Olivier Pereira 组。","basis":"abs"},{"id":"B#3126","title":"TruePix: Fast and Memory-Efficient Zero-Knowledge Authentication for Images and Videos","authors":"Li Liu (Shandong University), Puwen Wei (Shandong University), Yunyan Zou (Shandong University), Zhuoran Ji (Shandong University), Yuncong Zhang (Shandong University), Jinhan You (Shandong University), Jingru Deng (Shandong University), Jiapeng Wang (Shandong University), Haibo Zhou (Huawei Technologies Co., Ltd.)","speaker":"Puwen Wei","s":"B2","pos":4,"sum":"对图片和视频做零知识认证：证明一张发布的图确实由某张带签名的原图经合法编辑得到，而不公开原图。主打速度和内存占用。山东大学。","basis":"title"},{"id":"B#3620","title":"A Toolkit for Succinct Lattice-Based Zero Knowledge Proofs","authors":"Beatrice Biasioli (IBM Research), Madalina Bolboceanu (IBM Research), Vadim Lyubashevsky (IBM Research), Antonio Merino-Gallardo (IBM Research), Michał Osadnik (Aalto University), Gregor Seiler (IBM Research), Patrick Steuer (IBM Research)","speaker":"Antonio Merino-Gallardo","s":"B2","pos":5,"sum":"基于格的简洁零知识证明工具箱。在 LaBRADOR 的技术之上，这类证明在后量子方案里尺寸最小、prover 往往也最快，任意大的陈述都在 100KB 以内。本文把相关技术整理成可复用的工具集。IBM Research Lyubashevsky 组。","basis":"abs"},{"id":"A#1332","title":"ZEE200: Zero Knowledge for Everything and Everyone @ 200 KHz","authors":"Sunghyeon Jo (Georgia Institute of Technology), Vladimir Kolesnikov (Georgia Institute of Technology), Yibin Yang (NTT Research)","speaker":"","s":"B2","pos":6,"sum":"对高级语言程序做零知识执行：逐步证明 CPU 的每一步。此前的 ZEE 能证明任意 ANSI C 程序里存在 bug 而不泄露触发输入。本文把速度推到每秒 20 万步量级。Georgia Tech Kolesnikov 组。","basis":"abs"},{"id":"B#634","title":"LeakyTree: Cross-VM Bit-by-Bit Deduplicated Page Leakage via Linux Kernel Samepage Merging Internals","authors":"Ernesto Martinez Garcia (Graz University of Technology), Lukas Maar (Graz University of Technology), Martin Unterguggenberger (Graz University of Technology), Mathias Oberhuber (Graz University of Technology), Stefan Mangard (Graz University of Technology)","speaker":"Ernesto Martinez Garcia","s":"B3","pos":1,"sum":"Linux KSM 内存去重的跨虚拟机泄露：利用 KSM 内部机制，逐比特泄露其他虚拟机里被合并页面的内容。Graz。","basis":"title"},{"id":"B#645","title":"You Shall Not Pass into Ring-0! A User Privacy-Friendly Anti-Cheat Architecture for Personal Computers","authors":"Santosh Gokul Narayanan (Nokia of America Corporation), Giovanni Paladino (New York University), Chuqi Zhang (National University of Singapore), Sangho Lee (Microsoft Research), Zhenkai Liang (National University of Singapore), Adil Ahmad (Arizona State University)","speaker":"Giovanni Paladino","s":"B3","pos":2,"sum":"游戏反作弊系统普遍要求内核级权限，侵犯用户隐私。本文提出不需要进入 Ring-0 的反作弊架构。","basis":"title"},{"id":"B#1104","title":"LDBF: Deep Exploration of eBPF Runtime via LLM-Driven Program Generation and Adaptive Context Orchestration","authors":"Yinhao Hu (Huazhong University of Science and Technology), Kaiyan Mei (Huazhong University of Science and Technology), Zeyu Sun (Chinese Academy of Sciences), Quan Sun (Huazhong University of Science and Technology), Dongliang Mu (Huazhong University of Science and Technology), Yuan Li (Zhongguancun Laboratory), Chao Zhang (Tsinghua University)","speaker":"","s":"B3","pos":3,"sum":"用 LLM 生成 eBPF 程序来 fuzz 内核的 eBPF 运行时，难点是生成的程序要先过 verifier 才能触及深层逻辑。属于 LLM 驱动 fuzzing，偏系统。","basis":"title"},{"id":"B#1762","title":"From Binary to Bug: Generation-Based Fuzzing for macOS MIG Services via Constraint Recovery","authors":"Yi Fan (Huazhong University of Science and Technology), Ming Yuan (Zhongguancun Laboratory), Haoyi Liu (Huazhong University of Science and Technology), Ximo Li (Tsinghua University), Zhen Li (Huazhong University of Science and Technology), Deqing Zou (Huazhong University of Science and Technology), Chao Zhang (Tsinghua University)","speaker":"Yi Fan","s":"B3","pos":4,"sum":"macOS 的 MIG 系统服务的生成式 fuzzing：从二进制里恢复消息格式约束，再据此生成合法输入。华科与清华 Chao Zhang 组。","basis":"title"},{"id":"B#3199","title":"MTEscape: Bypassing Asynchronous Kernel MTE via Conventional Memory Corruption Vulnerabilities","authors":"Kyeongmin Kim (KAIST), Insu Yun (KAIST)","speaker":"Kyeongmin Kim","s":"B3","pos":5,"sum":"ARM MTE 内存标签在内核里以异步模式运行时可以被绕过：利用普通的内存破坏漏洞，在标签检查生效前完成利用。KAIST Insu Yun 组。","basis":"title"},{"id":"B#3659","title":"Multilayer Defense for Syscall Flooding Attacks on Audit Collection Systems","authors":"Sagar Mishra (STONY BROOK UNIVERSITY), Soundarya Venkatesh (NVIDIA), R. Sekar (STONY BROOK UNIVERSITY)","speaker":"","s":"B3","pos":6,"sum":"审计日志采集系统会被系统调用洪泛淹没，导致丢日志。本文给出多层防御。Stony Brook R. Sekar 组。","basis":"title"},{"id":"A#280","title":"Penetrating the Reality Wall: Long-Range and Through-Wall AR/VR Privacy Eavesdropping via Wireless Power Side Channel","authors":"Tao Ni (King Abdullah University of Science and Technology), Zehua Sun (National University of Singapore), Yihe Zhou (City University of Hong Kong), Yuefeng Du (City University of Hong Kong), Qingchuan Zhao (City University of Hong Kong), Cong Wang (City University of Hong Kong)","speaker":"Yihe Zhou","s":"B4","pos":1,"sum":"AR/VR 头显的隐私窃听：通过无线充电或供电的侧信道，隔墙、远距离推断用户活动。城大 Cong Wang 组。","basis":"title"},{"id":"A#1382","title":"Turning Everyday Earphones into a Full-Duplex Speech Eavesdropping Platform via Zero-permission IMU","authors":"Ming Gao (Nanjing University of Posts and Telecommunications), Ayijiaken Amantai (Nanjing University of Posts and Telecommunications), Yichen Dai (Nanjing University of Posts and Telecommunications), Jia Lv (Nanjing University of Posts and Telecommunications), Kaiyan Cui (Nanjing University of Posts and Telecommunications), Jinsong Han (Zhejiang University), Minhao Cui (Seoul National University), Fu Xiao (Nanjing University of Posts and Telecommunications)","speaker":"Ming Gao","s":"B4","pos":2,"sum":"耳机里的 IMU 本来用于动作检测，读取不需要权限。声音经过耳机结构会引起微小振动，被 IMU 记录下来。作者据此把普通耳机变成窃听平台，而且是双工的：佩戴者自己说的话和耳机播放的对方声音都能恢复。","basis":"abs"},{"id":"A#2090","title":"LockSnoop: Eavesdropping Plain-text Keypad Smart Lock Passcode via Electromagnetic Side Channel","authors":"Bowei Zhang (Clemson University), Zhuoyang Wang (Clemson University), Chenxu Jiang (Clemson University), Gen Li (Clemson University), Ming Li (University of Texas at Arlington), Linke Guo (Clemson University)","speaker":"","s":"B4","pos":3,"sum":"键盘式智能门锁的电磁侧信道：从泄露的电磁信号直接恢复输入的明文密码。Clemson。","basis":"title"},{"id":"A#2811","title":"Snatcher: Apple Find My Network Exposes Your Lost Devices To Strangers","authors":"Zhenyu Ren (The Hong Kong University of Science and Technology), Yanbo Zhang (The Hong Kong University of Science and Technology), Boya Liu (The Hong Kong University of Science and Technology), Mo Li (The Hong Kong University of Science and Technology)","speaker":"Zhenyu Ren","s":"B4","pos":4,"sum":"Apple Find My 网络的设计缺陷让丢失的设备暴露给陌生人。Snatcher 只用安卓手机，利用未加密的 BLE 广播、未认证的发声触发等弱点，发现并定位附近的丢失设备，可导致实物被盗。位置隐私方向的实测攻击。","basis":"abs"},{"id":"B#236","title":"StickShield: Flexible Acoustic Metamaterial Defense for Securing Microphones Against Voice Attacks","authors":"Zhiyuan Ning (Northwest University), Zhanyong Tang (Northwest University), JiaYi Xing (Northwest University), Rui Hou (Institute of Information Engineering, CAS), Xiaojiang Chen (Northwest University)","speaker":"Zhiyuan Ning","s":"B4","pos":5,"sum":"一种柔性声学超材料贴片，贴在麦克风上，物理层面抵御超声等语音注入攻击。西北大学。","basis":"title"},{"id":"B#6458","title":"Talking to the Airgap: Exploiting Radio-Less Embedded Devices as Radio Receivers","authors":"Paul Staat (Ruhr University Bochum), Daniel Davidovich (Max Planck Institute for Security and Privacy), Christof Paar (Max Planck Institute for Security and Privacy)","speaker":"Daniel Davidovich","s":"B4","pos":6,"sum":"没有无线电模块的嵌入式设备也能被当成无线电接收器：利用芯片对射频的非预期敏感性，从空中向物理隔离（air-gapped）设备注入数据。Ruhr 与 MPI-SP 的 Christof Paar 组。","basis":"title"},{"id":"A#110","title":"TapSpy: Semantic Usage Analysis and Triangulated Risk Assessment of Session Replay in Mobile Apps","authors":"Jiawei Guo (University at Buffalo, SUNY), Zongze Li (University at Buffalo, SUNY), Haipeng Cai (University at Buffalo, SUNY)","speaker":"Jiawei Guo","s":"B5","pos":1,"sum":"移动应用里的 session replay SDK 会录下用户的屏幕操作。TapSpy 是一个静态分析框架，分析 Android 应用如何使用这类 SDK，并从多个角度评估其隐私风险。Buffalo Haipeng Cai 组。","basis":"title"},{"id":"B#1748","title":"Keys on Doormats: Exposed API Credentials on the Web","authors":"Nurullah Demir (Stanford University), Yash Vekaria (University of California, Davis), Georgios Smaragdakis (Delft University of Technology), Zakir Durumeric (Stanford University)","speaker":"","s":"B5","pos":2,"sum":"Web 上暴露的 API 凭据测量。分析 1,000 万个渲染后的网站，发现 API key 暴露很普遍，受影响的包括跨国银行和关键基础设施相关机构。Stanford Zakir Durumeric 组的大规模测量。","basis":"abs"},{"id":"B#2553","title":"Mind the Advisory Gap: Comparing Security Advisory and Patch Management Practices Across IoT and Non-IoT Vendors","authors":"Sandra Rivera Pérez (Delft University of Technology), Mathew Vermeer (Delft University of Technology), Savvas Zannettou (Delft University of Technology), Arwa Al Alsadi (Delft University of Technology), Sergio Ruiz-Villafranca (Universidad Politécnica de Madrid), Michel van Eeten (Delft University of Technology), Carlos Gañán (Delft University of Technology)","speaker":"Sandra Rivera Pérez","s":"B5","pos":3,"sum":"IoT 厂商的漏洞通告和补丁管理是否真的比非 IoT 厂商差。对比 177 家厂商，其中 86 家根本不发安全通告；收集 2.2 万份通告，95% 有补丁。结论是问题并非 IoT 独有，对针对 IoT 的专门立法是个提醒。","basis":"abs"},{"id":"B#3921","title":"Janus: Characterizing Bidirectional Privacy and Security Risks in LLM-Integrated Android Apps","authors":"Jiawei Guo (University at Buffalo), Zongze Li (University at Buffalo, SUNY), Haipeng Cai (University at Buffalo, SUNY)","speaker":"Jiawei Guo","s":"B5","pos":4,"sum":"集成了 LLM 的 Android 应用的双向风险测量：一个方向是应用把用户隐私数据送给 LLM 服务，另一个方向是 LLM 输出反过来危害应用和用户。Buffalo Haipeng Cai 组的大规模应用分析。","basis":"title"},{"id":"B#5410","title":"PatchAudit: Uncovering Faulty Security Patches and Lingering Zero-Days at Scale","authors":"Zhengsong Zhang (University at Buffalo, SUNY), Haipeng Cai (University at Buffalo, SUNY)","speaker":"Haipeng Cai","s":"B5","pos":5,"sum":"大规模审计 CVE 的安全补丁是否修错了：给定初始补丁，找后续是否还有继续修同一漏洞的提交，说明初始补丁不完整或不正确，这期间漏洞仍可利用。","basis":"title"},{"id":"B#5707","title":"Gone in 8 Seconds: Uncovering Malicious Bots Operating on Public Container Registries","authors":"Billy Tsouvalas (Stony Brook University), Nick Nikiforakis (Stony Brook University)","speaker":"Billy Tsouvalas","s":"B5","pos":6,"sum":"公共容器镜像仓库上的恶意 bot：泄露在镜像里的凭据在几秒内就被自动扫走并利用。Stony Brook Nick Nikiforakis 组的蜜罐测量。","basis":"title"},{"id":"A#1993","title":"Non-interactive Anonymous Tokens with Private Metadata Bit","authors":"Foteini Baldimtsi (George Mason University, Mysten Labs), Lucjan Hanzlik (CISPA Helmholtz Center for Information Security), Quan Nguyen (George Mason University), Aayush Yadav (George Mason University)","speaker":"","s":"B6","pos":1,"sum":"带私有元数据位的匿名令牌（Privacy Pass 一类），首次做到签发阶段非交互，签发方不需要在线签名。构造基于 SPS-EQ。纯密码学，与 AI 无关，按兴趣可略过。","basis":"abs"},{"id":"B#51","title":"Privacy Leakage from a Thousand Words: Millipixel Location Recovery from Dot Maps","authors":"Yuntao Du (Purdue University), Tanishq Pauskar (Purdue University), Hao Wang (Purdue University), Jing Su (Indiana University), Ninghui Li (Purdue University)","speaker":"Tanishq Pauskar","s":"B6","pos":2,"sum":"点图（dot map）会泄露精确位置。AutoLocate 利用地图渲染时抗锯齿留下的亚像素痕迹，把位置恢复写成黑盒优化问题，反复渲染候选图去逼近目标图，精度到毫像素级。位置隐私攻击，Ninghui Li 组。","basis":"abs"},{"id":"B#372","title":"On the Same Track: Privacy Leaks in Electric Rail Transport via Magnetic Fields","authors":"Stefan Czybik (Berlin Institute for the Foundations of Learning and Data), Pia Hanfeld (Berlin Institute for the Foundations of Learning and Data), Konrad Rieck (Berlin Institute for the Foundations of Learning and Data)","speaker":"Stefan Czybik","s":"B6","pos":3,"sum":"电气化铁路的隐私泄露：通过测量磁场推断列车运行或乘客行程信息。Konrad Rieck 组，物理侧信道类的位置隐私攻击。","basis":"title"},{"id":"B#1322","title":"Evaluating Practical Enumeration and Blocking Attacks on the Snowflake Circumvention System","authors":"Linden Chen (University of California Santa Cruz), Ryan Sangha (University of California Santa Cruz), Cecylia Bocovich (Tor Project), Ram Sundara Raman (University of California Santa Cruz)","speaker":"Ryan Sangha","s":"B6","pos":4,"sum":"检验 Tor Snowflake 抗审查系统的两个安全假设：代理 IP 难以枚举，以及封锁代理的附带损失不可接受。48 天实测枚举出两万多个代理 IP，再用大规模模拟评估封锁的效果与代价。","basis":"abs"},{"id":"B#1533","title":"CrossLink: Breaking Location Privacy by Linking Device Identifiers Across Protocols","authors":"Aneet Kumar Dutta (CISPA Helmholtz Center for Information Security), Mihirraj Dixit (Saarland University), Kevin Gni (CISPA Helmholtz Center for Information Security), Wouter Lueks (CISPA Helmholtz Center for Information Security), Mridula Singh (CISPA Helmholtz Center for Information Security)","speaker":"Aneet Kumar Dutta","s":"B6","pos":5,"sum":"手机同时在 LTE、WiFi、BLE 上发临时标识符，各协议单独看都做了随机化，但轮换时刻不同步，被动攻击者可以跨协议把轨迹缝起来。CrossLink 在模拟中恢复了 83% 用户的完整轨迹，单协议基线只有 22%。位置隐私攻击。","basis":"abs"},{"id":"B#3005","title":"Boosting Query Recovery against Encrypted Databases: High-Accuracy and Efficient Inference Attacks Using Minimal Leakage","authors":"Jiaojiao Wu (Xidian University), Lei Zhang (Xidian University), Jianfeng Wang (Xidian University), Shi-Feng Sun (Shanghai Jiao Tong University), Xiaofeng Chen (Xidian University)","speaker":"","s":"B6","pos":6,"sum":"针对加密数据库的 query recovery 推断攻击，主打只利用极少的泄露就能达到高准确率和高效率。searchable encryption 泄露滥用这条线。","basis":"title"},{"id":"A#2990","title":"VUPER: Verified ASN.1 UPER Parser","authors":"Xiaotian Zhou (The Pennsylvania State University), Kai Tu (The Pennsylvania State University), Ali Ranjbar (The Pennsylvania State University), Yilu Dong (The Pennsylvania State University), Gang Tan (The Pennsylvania State University), Syed Rafiul Hussain (The Pennsylvania State University)","speaker":"Gary Tan","s":"B8","pos":1,"sum":"ASN.1 UPER 编码广泛用于蜂窝网络和 V2X。VUPER 生成经形式化验证的 UPER 解析器：先形式化比特级精确解析器的概念，再证明编码解码往返等性质，从根上消除这类解析漏洞。Penn State。","basis":"abs"},{"id":"B#687","title":"MARS: Monotonic Authority for Rescue CPS under Stale Hazard Uncertainty","authors":"Boran Yang (Changchun University of Science and Technology), Jinqing Li (Changchun University of Science and Technology), Xiaoqiang Di (Changchun University of Science and Technology), Shihao Liu (Changchun University of Science and Technology)","speaker":"Xiaoqiang Di","s":"B8","pos":2,"sum":"救援类信息物理系统在危险信息过时、不确定时的权限控制问题，提出单调授权模型。没有摘要，细节以现场为准。","basis":"title"},{"id":"B#741","title":"Recovering Process Variables from Industrial Network Traffic via Search-Based Optimization","authors":"Chuan Sheng (Shenyang Institute of Automation, Chinese Academy of Sciences), Shan Jiang (Swinburne University of Technology), Jianming Zhao (Shenyang Institute of Automation, Chinese Academy of Sciences), Yu Yao (Northeastern University)","speaker":"Shan Jiang","s":"B8","pos":3,"sum":"工业控制系统里，监控系统只记录一部分过程变量。本文从原始工业网络流量中恢复过程变量字段及其语义，把协议逆向建模成基于搜索的优化问题，给过程感知的安全监控提供更完整的数据。","basis":"abs"},{"id":"B#1105","title":"Credit Without Debit: Formal Verification of Banking Payment Systems","authors":"Ali Hamza Malik (University of Massachusetts Amherst), Muhammad Taqi Raza (University of Massachusetts Amherst)","speaker":"Ali Hamza Malik","s":"B8","pos":4,"sum":"对美国 ACH 银行转账系统做形式化建模和验证，刻画转账的延迟、异步以及跨行账户各自独立控制的特点，发现能在资金未真正扣除时先获得入账的逻辑缺陷，即标题说的有贷无借。","basis":"abs"},{"id":"B#5258","title":"One Click to Leak: Characterizing the Real-World Usage and Threat Impact of MNO-based Single Sign-On Websites","authors":"Jiasheng Huang (Tsinghua University), Mingxuan Liu (Zhongguancun Laboratory), Pei Chen (Fudan University), Baojun Liu (Tsinghua University), Yiming Zhang (Tsinghua University), Geng Hong (Fudan University), Zhenrui Zhang (Baidu Inc), Hai Yang (Baidu Inc), Haixin Duan (Quancheng Lab), Hui Jiang (Tsinghua University)","speaker":"Jiasheng Huang","s":"B8","pos":5,"sum":"基于运营商的一键登录（MSSO），即本机号码一键登录，正从 App 扩展到网站。本文分析主流部署，归纳其三阶段流程和信任假设，测量真实网站的使用情况，并展示攻击者如何借此泄露用户手机号或冒用身份。清华 Baojun Liu、Haixin Duan 组。","basis":"abs"},{"id":"B#6521","title":"5GDescrambler: Locating, Descrambling, and Decoding 5G Scheduling Information","authors":"Fritz Windisch (Karlsruhe Institute of Technology), Thorsten Strufe (Karlsruhe Institute of Technology)","speaker":"Fritz Windisch","s":"B8","pos":6,"sum":"开源的 5G 下行控制信息（DCI）嗅探器。利用 5G 物理下行控制信道上的代数结构，定位、解扰并解码调度信息，从空口被动获知基站给哪些用户分配了资源。可用于流量分析和用户追踪研究。","basis":"title"},{"id":"A#3563","title":"dfence: Fine-Grained Speculation Barriers for Efficient and Effective Hardware-Software Protection in the Spectre Era","authors":"Davide Davoli (MPI-SP), Marton Bognar (KU Leuven), Lesly-Ann Daniel (EURECOM), Benjamin Gregoire (Inria), Frank Piessens (KU Leuven), Tamara Rezk (Inria)","speaker":"","s":"B9","pos":1,"sum":"针对 Spectre 的软硬件协同防护，引入细粒度的推测屏障，只在需要的地方阻止推测执行，兼顾效率与安全，带形式化保证。","basis":"title"},{"id":"B#1138","title":"KEM-IND-CCA-Preserving Compilation of Jasmin's ML-KEM","authors":"Santiago Arranz-Olmos (MPI-SP), Gilles Barthe (MPI-SP), Lionel Blatter (MPI-SP), Benjamin Gregoire (Inria), Vincent Laporte (Inria), Paolo Torrini (Inria)","speaker":"Santiago Arranz-Olmos","s":"B9","pos":2,"sum":"高保障密码实现。证明 Jasmin 编译器在编译 ML-KEM 的高度优化实现时，既保持功能正确性也保持 KEM 的 IND-CCA 安全性，证明在 Rocq 里完全机械化。这份实现用在 Signal 里。","basis":"abs"},{"id":"B#2155","title":"On Identifying Sound Conditions for Frontrunning Resistance","authors":"Sebastian Holler (MPI-SP), Anna Piscitelli (Ruhr University Bochum), Jannik Albrecht (Ruhr University Bochum), Stephan Dübler (MPI-SP), Ghassan Karame (Ruhr University Bochum), Clara Schneidewind (MPI-SP)","speaker":"Sebastian Holler","s":"B9","pos":3,"sum":"智能合约的抢跑（frontrunning）攻击源于交易排序不受用户控制。本文从形式化角度研究什么条件足以保证合约抗抢跑，给出 sound 的充分条件，可用于静态检查。MPI-SP 与 Bochum。","basis":"abs"},{"id":"B#3100","title":"SCHERI: Provably Secure Speculation Under the Constant-Time Policy for CHERI","authors":"Shixin Song (Massachusetts Institute of Technology), Davide Davoli (MPI-SP), Elias Storme (KU Leuven), Marton Bognar (KU Leuven), Dominique Devriese (KU Leuven), Frank Piessens (KU Leuven), Tamara Rezk (Inria)","speaker":"","s":"B9","pos":4,"sum":"在 CHERI 能力硬件上，证明推测执行在 constant-time 策略下是安全的。MIT、KU Leuven、Inria 合作，与同场 A#3563 作者有重叠。","basis":"title"},{"id":"B#3579","title":"Towards Practical Privacy-Preserving SAT Solving","authors":"Gefei Tan (Northwestern University), Wenhao Zhang (Northwestern University), Timos Antonopoulos (Yale University), Ruzica Piskac (Yale University), Xiao Wang (Northwestern University), Ning Luo (UIUC)","speaker":"Gefei Tan","s":"B9","pos":5,"sum":"隐私保护的 SAT 求解：多方各持私有公式，合取后求解而不泄露各自输入。此前的 ppSAT 只支持最基础的求解算法，实用规模的公式解不动。本文引入更现代的 SAT 求解技术，把它推近实用。Northwestern Xiao Wang 组。","basis":"abs"},{"id":"B#5024","title":"Sound Debloating of Redundant Checks in Zero-Knowledge Machine-Learning Circuits","authors":"Zhantong Xue (Hong Kong University of Science and Technology), Pingchuan Ma (Zhejiang University of Technology), Zhaoyu Wang (Hong Kong University of Science and Technology), Yuguang Zhou (Hong Kong University of Science and Technology), Huaijin Wang (Shandong University), Shuai Wang (Hong Kong University of Science and Technology)","speaker":"","s":"B9","pos":6,"sum":"zkML 把神经网络编译成算术约束，其中很多范围证明、符号查找、位分解是冗余的，已被电路其余部分蕴含。删掉它们能加速证明，但删错了电路就可伪造。本文给出 sound 的冗余检查消除方法。港科大 Shuai Wang 组。","basis":"abs"},{"id":"A#281","title":"Customization under Fire: Plugin Poisoning in Text-to-Image Ecosystem","authors":"Jiahao Chen (Zhejiang University), Xing He (Zhejiang University), Yong Yang (Zhejiang University), Xinfeng Li (The Hong Kong Polytechnic University), Chunyi Zhou (Zhejiang University), Junhao Li (Zhejiang University), Zhe Ma (Tianjin University), Tianyu Du (Zhejiang University), Shouling Ji (Zhejiang University)","speaker":"Jiahao Chen","s":"C1","pos":1,"sum":"文生图生态里的 LoRA 插件投毒。PoisonLoRA 系统研究 Civitai 这类分享平台上的供应链风险：看似正常的 LoRA 里藏有隐蔽功能，利用的是社区对共享插件的信任。浙大 Shouling Ji 组。","basis":"abs"},{"id":"A#291","title":"A Single Glance Is Better Than Words: Vision-Guided Targeted Concept Erasing","authors":"Yuyang Zhang (Wuhan University), Yuxiang Sun (Wuhan University), Ke Liang (Wuhan University), Junlin Li (Wuhan University), Kangjie Chen (Tianjin University), Run Wang (Wuhan University)","speaker":"Yuyang Zhang","s":"C1","pos":2,"sum":"diffusion 模型的 concept erasing，用图像而不是文字来指定要擦除的概念，目标是擦得更准、对无关概念的误伤更小。","basis":"title"},{"id":"A#397","title":"MMAligner: Safeguarding Multimodal Large Language Models through Representation Calibration","authors":"Shenyi Zhang (Wuhan University), Keyan Guo (University at Buffalo), Zihao Wang (Wuhan University), Xuebin Li (Wuhan University), Lingchen Zhao (Wuhan University), Hongxin Hu (University at Buffalo), Chao Shen (Xi'an Jiaotong University), Qian Wang (Wuhan University)","speaker":"Shenyi Zhang","s":"C1","pos":3,"sum":"多模态 LLM 对不安全文本会拒答，对语义等价的图文输入却放行。作者从表征几何上解释：文本学到的安全子空间和拒答边界跨模态仍然有效，只是多模态输入发生表征偏移落到了边界外。MMAligner 把表征校准回边界内，不需要外挂 guardrail。","basis":"abs"},{"id":"A#651","title":"Can Small Language Models Reliably Resist Jailbreak Attacks? A Comprehensive Evaluation","authors":"Zhibo Wang (Zhejiang University), Wenhui Zhang (Zhejiang University), Huiyu Xu (Zhejiang University), Zeqing He (Zhejiang University), Ziqi Zhu (Zhejiang University), Kui Ren (Zhejiang University)","speaker":"Wenhui Zhang","s":"C1","pos":4,"sum":"小语言模型抗 jailbreak 的首个系统测评：15 个家族 59 个 SLM 对 12 种攻击，61% 的模型平均攻击成功率超过 40%。随后分析架构、压缩、训练方式等因素对安全性的影响。测评型论文，结论可直接引用。","basis":"abs"},{"id":"A#1443","title":"Understanding and Preserving Safety in Fine-Tuned LLMs","authors":"Jiawen Zhang (Zhejiang University), Yangfan Hu (University of Wisconsin-Madison), Kejia Chen (Zhejiang University), Lipeng He (University of Waterloo), Jiachen Ma (Shanghai Artificial Intelligence Laboratory), Jian Lou (Sun Yat-sen University), Dan Li (Sun Yat-sen University), Jian Liu (Zhejiang University), Xiaohu Yang (Zhejiang University), Ruoxi Jia (Virginia Tech)","speaker":"Jiawen Zhang","s":"C1","pos":5,"sum":"微调会破坏安全对齐，即使数据完全无害。作者从安全梯度与任务梯度的几何关系入手，给出三点经验观察，并据此设计微调方法，试图打破安全与效用二选一的困境。","basis":"abs"},{"id":"B#1343","title":"DSS: Dynamic Semantic Steering for Robust Concept Erasure in Diffusion Models","authors":"Qinghui Gong (Southwest Jiaotong University), Zhengchun Zhou (Southwest Jiaotong University), Hua Meng (Southwest Jiaotong University), Yihuai Liang (Southwest Jiaotong University), Yuxuan Zhang (Southwest Jiaotong University)","speaker":"QINGHUI GONG","s":"C1","pos":6,"sum":"推理时的 concept erasure。已有的推理期干预对特征做无约束修改，容易过度修正和语义漂移。DSS 显式建模局部语义结构，动态决定往哪个方向、推多远，主打对抗性 prompt 和组合 prompt 下的稳定性。","basis":"abs"},{"id":"B#3831","title":"What Concepts Lie Within? Detecting and Suppressing Risky Content in Diffusion Transformers","authors":"Chenyu Zhang (Tianjin University), Lanjun Wang (Tianjin University), Yueyang Cheng (Tianjin University), Ruidong Chen (Tianjin University), Wenhui Li (Tianjin University), An-an Liu (Tianjin University)","speaker":"Chenyu Zhang","s":"C1","pos":7,"sum":"Diffusion Transformer（DiT）里的风险内容检测与抑制。发现注意力头对特定概念有选择性敏感，据此既能检测也能压制风险概念，针对的是不含显式敏感词的对抗 prompt。","basis":"abs"},{"id":"B#6039","title":"Proof-of-Authorship for Diffusion-based AI Generated Content","authors":"De Zhang Lee (National University of Singapore), Han Fang (University of Science and Technology of China), Ee-Chien Chang (National University of Singapore)","speaker":"De Zhang Lee","s":"C1","pos":8,"sum":"给 latent diffusion 生成的内容做作者身份证明，对手是冒领作者的人。时间戳和水印各有短板；这里利用生成过程本身可控这一点：作者可以刻意选择随机种子，把它当作只有真作者才拿得出的证据。NUS Ee-Chien Chang 组。","basis":"abs"},{"id":"A#1166","title":"Kairos: Efficient High-Threshold Asynchronous Distributed Key Generation from Lightweight Cryptography","authors":"Xinxin Xing (Beihang University), Yizhong Liu (Beihang University), Zifan Li (Beihang University), Jianwei Liu (Beihang University), Yudi Yang (Beihang University), Yuan Lu (A*STAR IAIC), Song Bian (Beihang University), Zhenyu Guan (Beihang University), Tianwei Zhang (Nanyang Technological University)","speaker":"Tianwei Zhang","s":"C2","pos":1,"sum":"高门限的异步分布式密钥生成，只用轻量级密码构件，不依赖重型公钥运算。北航。","basis":"title"},{"id":"A#1271","title":"Anchor-DKG: Distributed Key Generation with Repeating Parties","authors":"Hanwen Feng (University of Canterbury), Qiang Tang (University of Sydney), Sri AravindaKrishnan Thyagarajan (University of Sydney)","speaker":"Qiang Tang","s":"C2","pos":2,"sum":"一个参与方常常同时加入多个门限系统，例如多个重叠的 PoS 委员会。常规 DKG 让每个系统各自生成密钥份额，密钥管理负担重。Anchor-DKG 让重复出现的参与方复用一份锚定的份额。","basis":"abs"},{"id":"A#1354","title":"Revisiting Shamir Secret Sharing for Threshold Fully Homomorphic Encryption","authors":"Jiseung Kim (Jeonbuk National University), Seunghu Kim (Chung-Ang University), Hyung Tae Lee (Chung-Ang University)","speaker":"Seunghu Kim","s":"C2","pos":3,"sum":"格基门限 FHE 和门限 PKE 普遍用环上的 Shamir 秘密共享，重构时的分母消除因子随参与方数量快速增长，迫使密文模数变大。本文重新设计共享方式来控制这个增长。","basis":"abs"},{"id":"A#2135","title":"Doubly Aggregatable Signatures","authors":"Georg Fuchsbauer (TU Wien), Pranav Garimidi (a16z Crypto Research), Joachim Neu (a16z Crypto Research), Guru-Vamsi Policharla (Commonware, Inc.), Max Resnick (Anza), Ertem Nusret Tas (a16z Crypto Research)","speaker":"Kaya Alpturer","s":"C2","pos":4,"sum":"新原语 doubly aggregatable signatures：有两层签名者，第一层签名者对观察到的一组第零层签名出具简洁证明，多个第一层签名还能再公开聚合。面向区块链共识里投票再汇总的场景。a16z 等。","basis":"abs"},{"id":"B#1035","title":"Practical Silent Threshold Signatures and Silent Threshold Encryption for Dynamic Committees","authors":"Yifei He (Peking University), Zheng Zhou (Peking University), Yu Chen (Shandong University), Zhi Guan (Peking University), Zhong Chen (Peking University)","speaker":"Yifei He","s":"C2","pos":5,"sum":"Silent threshold 签名与加密不需要交互式 DKG，N 个参与方非交互地得到联合公钥。但以太坊这类系统用的是规模远小于 N 且动态变化的委员会，现有方案不适配。本文给出支持动态委员会的实用构造。","basis":"abs"},{"id":"B#1932","title":"BTX and SimpleBTE: Efficient Batched Threshold Encryption","authors":"Amit Agarwal (Category Labs), Sourav Das (Category Labs), Babak Poorebrahim Gilkalaye (Category Labs), Guru-Vamsi Policharla (Commonware, Inc.), Peter Rindal (Category Labs), Victor Shoup (Category Labs)","speaker":"Peter Rindal","s":"C2","pos":6,"sum":"两个高效的批量门限加密方案，用于加密 mempool 防 MEV，和同场 B#3449 是同一个应用。Category Labs，作者含 Victor Shoup。","basis":"title"},{"id":"B#2148","title":"Lemur: Scalable Post-Quantum Synchronized Multi-Signatures","authors":"Yini Lin (Monash University), Muhammed F. Esgin (Monash University), Amin Sakzad (Monash University), Ron Steinfeld (Monash University), Markku-Juhani O. Saarinen (Tampere University)","speaker":"Yini Lin","s":"C2","pos":7,"sum":"后量子的 synchronized multi-signature：多个签名者在同一时间段内的签名可以聚合成一个短签名，基于格。面向区块链共识这类大量签名者的场景。Monash。ePrint 2026/1161。","basis":"title"},{"id":"B#3449","title":"BEAST-MEV: Batched Threshold Encryption with Silent Setup for MEV prevention","authors":"Jan Bormet (Technische Universität Darmstadt), Arka Rai Choudhuri (zkBricks), Sebastian Faust (Technische Universität Darmstadt), Sanjam Garg (University of California, Berkeley), Hussien Othman (Technische Universität Darmstadt), Guru Vamsi Policharla (Commonware, Inc.), Ziyan Qu (Technische Universität Darmstadt), Mingyuan Wang (University of Delaware)","speaker":"Jan Bormet","s":"C2","pos":8,"sum":"门限加密 mempool 在交易上链前隐藏其内容，以防抢跑和 MEV。要在以太坊规模上跑，加密方案需要同时满足 silent setup 和批量解密两个性质。BEAST-MEV 是兼具两者的 batched threshold encryption。","basis":"abs"},{"id":"A#191","title":"FeatureFuzz: Treating Bug-prone Features as Core Primitives for Compiler Fuzzing","authors":"Xingbang He (Nanjing University), Yuanwei Chen (Nanjing University), Hao Wu (Nanjing University), Jikang Zhang (Institute of Dataspace, Hefei Comprehensive National Science Center), Zicheng Wang (Honor Device Co.,Ltd), Ligeng Chen (Honor Device Co., Ltd), Junjie Peng (Nanjing University), Haiyang Wei (Nanjing University), Yi Qian (Nanjing University), Tiantai Zhang (Nanjing University), Linzhang Wang (Nanjing University), Bing Mao (Nanjing University)","speaker":"Xingbang He","s":"C3","pos":1,"sum":"编译器 fuzzing。CI/CD 里编译阶段以高权限运行，恶意 PR 可借编译器漏洞执行代码，所以编译器 bug 是安全问题。FeatureFuzz 把历史 bug 中反复出现的易错语言特性提炼为基本构件，组合生成测试程序。","basis":"abs"},{"id":"A#597","title":"From Documentation to Zero-day Vulnerabilities: LLM-Driven Fuzzing of JavaScript Engines in PDF Readers","authors":"Suyue Guo (University of California, Santa Barbara), Stijn Pletinckx (University of California, Santa Barbara), Tianle Yu (University of California, Santa Barbara), Yigitcan Kaya (University of California, Santa Barbara), Saad Ullah (Boston University), Wenbo Guo (University of California, Santa Barbara), Christopher Kruegel (University of California, Santa Barbara), Giovanni Vigna (University of California, Santa Barbara)","speaker":"Suyue Guo","s":"C3","pos":2,"sum":"PDF 阅读器内置 JavaScript 引擎的 fuzzing。已有 fuzzer 只测单个 API 调用；PDFuzzer 让 LLM 读 API 手册和执行轨迹，产出文法并推断 API 之间的依赖，再用约束求解器生成有意义的调用序列。UCSB Kruegel、Vigna 组，挖出了 zero-day。","basis":"abs"},{"id":"A#736","title":"RustGo: Fairly Directed Greybox Fuzzing for Enforcing Rust Memory Safety","authors":"Dongyeon Yu (Korea University), Jiun Min (Korea University), Yewan Na (Ulsan National Institute of Science and Technology), Mijung Kim (Ulsan National Institute of Science and Technology), Taegyu Kim (The Pennsylvania State University), Yuseok Jeon (Korea University)","speaker":"","s":"C3","pos":3,"sum":"Rust 的内存安全问题只可能出在 unsafe 相关代码里，占比约 10%，而现有 fuzzer 对全部代码一视同仁。RustGo 做定向灰盒 fuzzing，把资源公平地导向各个 unsafe 相关目标。","basis":"abs"},{"id":"A#1083","title":"TANTRUM: Breaking the Heap Sandbox in JavaScript Engines via Protection Domain Fuzzing","authors":"Seunghyun Lee (Carnegie Mellon University), David Brumley (Carnegie Mellon University)","speaker":"Seunghyun Lee","s":"C3","pos":4,"sum":"JavaScript 引擎的 heap sandbox，如 V8 sandbox，把内存破坏限制在沙箱内。本文通过对保护域边界做 fuzzing 找到逃逸方法。CMU David Brumley 组。","basis":"title"},{"id":"A#1897","title":"ACOFuzz: Memory-Error-Sensitive Fuzzing Driven by Address-Computation-Operand-Aware Feedback Mechanism","authors":"Yiru Zhao (Wuhan University), Aorui Zhang (Wuhan University), Xiaoke Wang (Tianjin University), Aoshuang Ye (Wuhan Textile University), Benxiao Tang (Wuhan Textile University), Jinxin Ma (Beijing University of Posts and Telecommunications), Lei Zhao (Wuhan University), Heqing Huang (City University of Hong Kong)","speaker":"YIRU ZHAO","s":"C3","pos":5,"sum":"面向内存错误的 fuzzing：用地址计算的操作数作为反馈信号，引导输入更快触发越界访问。武大。","basis":"title"},{"id":"B#1266","title":"TriChord: Extension-Oriented Browser Fuzzing for Chromium","authors":"Huinian Yang (China Telecom Cloud Technology Co., Ltd.), Daoyuan Wu (Lingnan University), Qingyu Li (China Telecom Cloud Technology Co., Ltd.), Yiming Liu (China Telecom Cloud Technology Co., Ltd.)","speaker":"","s":"C3","pos":6,"sum":"面向 Chromium 浏览器扩展接口的 fuzzing。扩展 API 是相对少被测试的攻击面。","basis":"title"},{"id":"B#2037","title":"Automatic, Expressive, and Scalable Fuzzing with Stitching","authors":"Harrison Green (Carnegie Mellon University), Fraser Brown (Carnegie Mellon University), Claire Le Goues (Carnegie Mellon University)","speaker":"Harrison Green","s":"C3","pos":7,"sum":"库 fuzzing 的 harness 自动生成在合成时就固定了 API 调用序列，探索不到新行为；动态探索的方法又表达不了真实的使用约束，误报多。Stitching 把 API 使用约束拆成小片段，由 fuzzer 在运行时动态拼接。CMU。","basis":"abs"},{"id":"B#3846","title":"SPFUZZ: Validating Secretly Patched Vulnerabilities by Patch Guided Fuzzing","authors":"Shiyan Peng (Fudan University), Yingbo Xu (Fudan University), Jiarun Dai (Fudan University), Yuchen Zhang (Beijing Normal–Hong Kong Baptist University), Yuan Zhang (Fudan University), Min Yang (Fudan University)","speaker":"Shiyan Peng","s":"C3","pos":8,"sum":"厂商有时悄悄修补漏洞而不公告。本文用补丁引导的 fuzzing 验证这些秘密补丁对应的漏洞是否真实可触发。复旦 Min Yang 组。","basis":"title"},{"id":"A#1084","title":"Exploiting Body-Coupled Leakage for Keystroke Inference on Smartphones","authors":"Yao Wang (Xidian University), An He (Xidian University), Xiaolong Li (Xidian University), Haibin Zhang (Xidian University), Tao Gu (Macquarie University)","speaker":"AN HE","s":"C4","pos":1,"sum":"智能手机上的击键推断侧信道，利用的是人体耦合泄露：手指触屏时人体成为电信号通路，从中推断输入内容。西电。","basis":"title"},{"id":"A#1765","title":"MnemonicHack: Recovering the Master Seed from Bitcoin Hardware Wallets via Side-Channel Attacks","authors":"Jiwoo Baek (Korea University), Daehyeon Bae (Korea University), Gyusang Kim (Korea University), Gilsang Ahn (Korea University), Insup Lee (Korea University), Sujin Park (Korea University), Seokhie Hong (SmartM2M Co., Ltd), HeeSeok Kim (Korea University)","speaker":"Jiwoo Baek","s":"C4","pos":2,"sum":"对比特币硬件钱包做侧信道攻击，恢复助记词对应的主种子。高丽大学。","basis":"title"},{"id":"B#12","title":"File Notification Attacks: Templating and Exploiting Side-Channel Leakage from the File-Notification System on Linux, Windows, and macOS","authors":"Sudheendra Raghav Neela (Graz University of Technology), Xufan Zhao (Graz University of Technology), Jeanette Angelika Wultsch (Graz University of Technology), Hannes Weissteiner (Graz University of Technology), Florian Draschbacher (Graz University of Technology), Stefan Gast (Graz University of Technology), Daniel Gruss (Graz University of Technology)"
