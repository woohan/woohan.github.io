mation Engineering, Chinese Academy of Sciences)","speaker":"Sun Yecheng","s":"E9","pos":3,"sum":"修复正则表达式拒绝服务（ReDoS）：用带证明的代数推导把易受攻击的正则变换成语言等价的安全形式，正确性由构造保证。","basis":"title"},{"id":"B#2004","title":"A Large-scale Measurement of In-Page Prompt Injections Against LLM Web Agents","authors":"Soheil Khodayari (Independent Researcher), Xuenan Zhang (CISPA Helmholtz Center for Information Security), Bhupendra Acharya (University of Louisiana), Giancarlo Pellegrino (CISPA Helmholtz Center for Information Security)","speaker":"Soheil Khodayari","s":"E9","pos":4,"sum":"首个网页内 prompt injection 的大规模实测：12 亿 URL、2,480 万主机，确认 1.53 万处注入，少数模板被大量复用。动机很杂，有攻击也有防御，比如站长用来阻止 AI 抓取或操纵摘要。agent 安全的实证基础数据。","basis":"abs"},{"id":"B#2379","title":"From Payload to Plugin: Web-Scale Ecosystem Attribution of JavaScript Injection Campaigns","authors":"Ravindu De Silva (University of California, Santa Barbara), Nicholas Shao (University of California, Santa Barbara), Yigitcan Kaya (University of California, Santa Barbara), Mingxuan Yao (Georgia Institute of Technology), Yanick Fratantonio (Google), Luca Invernizzi (Google), Christopher Kruegel (University of California, Santa Barbara), Giovanni Vigna (University of California, Santa Barbara)","speaker":"Ravindu De Silva","s":"E9","pos":5,"sum":"全网规模的 JavaScript 注入活动归因：把观测到的恶意 payload 追溯到具体被利用的插件或组件生态。","basis":"title"},{"id":"B#2416","title":"Uncovering Hidden Attack Surfaces in Web Applications via Semantic-Aware Black-Box Scanning","authors":"Fukun Mei (Tsinghua University), Peiyang Li (Tsinghua University), Miao Chen (Zhongguancun Laboratory), Beijie Hou (Tsinghua University), Ke Xu (Tsinghua University), Qi Li (Tsinghua University)","speaker":"Fukun Mei","s":"E9","pos":6,"sum":"语义感知的黑盒 Web 扫描，发现传统爬虫触达不到的隐藏攻击面。","basis":"title"},{"id":"B#4288","title":"XSS-over-DoH: On the Adverse Side Effects of DoH on Web Security","authors":"Matthias Gierlings (Ruhr University Bochum), Lukas Knittel (Ruhr University Bo­chum), Jörg Schwenk (Ruhr University Bochum), Christian Mainka (University of Wuppertal)","speaker":"","s":"E9","pos":7,"sum":"DNS-over-HTTPS 对 Web 安全的副作用：DoH 的响应可以成为 XSS 等攻击的新载体。","basis":"title"},{"id":"A#296","title":"Mind the Gap: Action Rebinding Attacks against Android GUI Agents","authors":"Yi Qian (Nanjing University), Kunwei Qian (Nanjing University), Xingbang He (Nanjing University), Ligeng Chen (Honor Device Co., Ltd), Jikang Zhang (Institute of Dataspace, Hefei Comprehensive National Science Center), Tiantai Zhang (Nanjing University), Haiyang Wei (Nanjing University), Linzhang Wang (Nanjing University), Hao Wu (Nanjing University), Bing Mao (Nanjing University)","speaker":"Yi Qian","s":"F1","pos":1,"sum":"Android GUI agent 的 Action Rebinding 攻击。agent 观察屏幕和执行动作之间有时间差，零危险权限的恶意应用在这个间隙换掉界面，让 agent 的点击落到攻击者想要的特权操作上。本质是 agent 设计与 Android 沙箱模型的冲突，属于 TOCTOU。","basis":"abs"},{"id":"B#875","title":"Safeguarding LLM Agents against Long-Horizon Threats via Shadow Memory","authors":"Yuhui Wang (Stony Brook University), Tanqiu Jiang (Stony Brook University), Jiacheng Liang (Stony Brook University), Charles Fleming (Cisco Systems), Ting Wang (Stony Brook University)","speaker":"Ting Wang","s":"F1","pos":2,"sum":"防 agent 的长程攻击，即恶意目标被拆散在多轮交互里、单轮看不出问题。ShadowMem 借鉴系统安全的 shadow stack：维护一份独立的、只记安全相关上下文的影子记忆，跨轮次检查当前动作是否偏离用户意图。","basis":"abs"},{"id":"B#1325","title":"IntraGuard: Committee-Side Defenses Against Review Outsourcing to Commercial Chatbots","authors":"Oubo Ma (Zhejiang University), Ruixiao Lin (Zhejiang University), Jiahao Chen (Zhejiang University), Yuan Su (Zhejiang University), Yong Yang (Zhejiang University), Shouling Ji (Zhejiang University)","speaker":"","s":"F1","pos":3,"sum":"审稿人把审稿整包给商用 chatbot 怎么办。思路是在稿件里埋隐藏指令，干扰或标记 chatbot 生成的审稿意见。已有做法 payload 单一、容易被清洗；IntraGuard 设计更鲁棒的注入方式。把 prompt injection 用在防御侧的例子。","basis":"abs"},{"id":"B#5744","title":"MetaMancer: Practical Tool Selection Attacks against LLM Agents","authors":"Wenbin Zhai (The Hong Kong Polytechnic University), Yihao Liu (The Hong Kong Polytechnic University), Dong Wang (The Hong Kong Polytechnic University), Hao Chen (The University of Hong Kong), Bin Xiao (The Hong Kong Polytechnic University)","speaker":"","s":"F1","pos":4,"sum":"针对 LLM agent 的工具选择攻击：通过操纵工具的元数据，如名称和描述，让 agent 优先选中攻击者的恶意工具。与 MCP 工具投毒是同一类问题。","basis":"title"},{"id":"A#691","title":"Private Signaling Secure Against Actively Corrupted Servers","authors":"Haotian Chu (Northwestern University), Xiao Wang (Northwestern University), Yanxue Jia (Illinois Institute of Technology)","speaker":"Haotian Chu","s":"F2","pos":1,"sum":"Private signaling 让服务器在公告板上替接收方找出属于他的消息，而不知道接收方是谁，用于隐私区块链和匿名通信。现有构造除非用 TEE，都假设服务器只是被动腐化。本文给出抗主动腐化服务器的方案。","basis":"abs"},{"id":"A#1582","title":"MPCArbiter: Detect Numeric Error Vulnerabilities in MPC Implementations via Distribution-Aware Differential Oracle","authors":"Guopeng Lin (Fudan University), Zhengting Jin (Fudan University), Shuyu Chen (Fudan University), Jingwei Pu (Fudan University), Zheng Qu (Fudan University), Jiaheng Zhang (National University of Singapore), Weili Han (Fudan University)","speaker":"","s":"F2","pos":2,"sum":"MPC 实现里的数值误差漏洞，如定点截断和溢出。本文用考虑分布的差分 oracle 自动检测。","basis":"title"},{"id":"B#456","title":"One Proof to Rule Them All: Practical, Sublinear Verification for Actively Secure MPC on Z2k with Dishonest Majority and a Dealer","authors":"Andreas Brüggemann (Technical University of Darmstadt), Ariel Nof (Bar-Ilan University), Thomas Schneider (Technical University of Darmstadt)","speaker":"Andreas Brüggemann","s":"F2","pos":3,"sum":"用亚线性的分布式零知识证明把被动安全的 MPC 升级为主动安全，是近年的流行做法。本文针对 Z2k 环、不诚实多数加可信 dealer 的设定，给出实用的、验证通信量亚线性的方案。","basis":"abs"},{"id":"B#4337","title":"Authenticated Garbling with Tensor Gates","authors":"Nakul Khambhati (University of California, Los Angeles), Turan Vural (University of California, Los Angeles), David Heath (University of Illinois, Urbana-Champaign), Rafail Ostrovsky (University of California, Los Angeles)","speaker":"Nakul Khambhati","s":"F2","pos":4,"sum":"Authenticated garbling 是常数轮恶意安全两方计算的主流框架。半诚实设定下的 one-hot garbling 支持高效的 tensor gate；本文把 tensor gate 引入 authenticated garbling，降低恶意安全下的通信量。","basis":"abs"},{"id":"A#1297","title":"PBFuzz: Agentic Directed Fuzzing for PoV Generation","authors":"Haochen Zeng (University of California, Riverside), Andrew Bao (University of Minnesota, Twin Cities), Jiajun Cheng (University of California, Riverside), Chengyu Song (University of California, Riverside)","speaker":"Chengyu Song","s":"F3","pos":1,"sum":"用 LLM agent 做定向 fuzzing，目标是生成能触发指定漏洞的 PoV。agent 根据调用图迭代地写 Python 输入生成器，跑目标程序，再用调试器反馈修正方向。在 Magma benchmark 上评测。","basis":"abs"},{"id":"A#1690","title":"Thinking More, Harnessing Better: Automatic Harness Generation with Dataflow Aggregation and Workflow Decomposition","authors":"Xing Zhang (QI-ANXIN Technology Research Institute), Zikang Huang (Wuhan University), Gang Yang (Information Support Force Engineering University), CongChong Wang (QI-ANXIN Technology Research Institute), Lu Liu (Shandong University), Bin Yin (QI-ANXIN Technology Research Institute), Mingyi Wang (QI-ANXIN Technology Research Institute), Ziquan Zhao (QI-ANXIN Technology Research Institute), Min Li (QI-ANXIN Technology Research Institute), Zhenyu Chen (QI-ANXIN Technology Research Institute), Bo Wu (Information Support Force Engineering University), Lingyun Ying (QI-ANXIN Technology Research Institute)","speaker":"Zikang Huang","s":"F3","pos":2,"sum":"自动生成 fuzz harness。从标题看是让 LLM 多做推理：聚合数据流信息帮助理解 API 用法，并把生成流程拆成多个子任务。属于 LLM 辅助 fuzzing。","basis":"title"},{"id":"B#5439","title":"Single Medium, Multiple Perspectives: Exposing and Exploiting Semantic Gaps in AI Services' Media Preprocessing Pipelines","authors":"Yacong Gu (Tsinghua University), Xiangfan Wu (Ocean University of China), Lingyun Ying (QI-ANXIN Technology Research Institute), Yingyuan Pu (QI-ANXIN Technology Research Institute), Haipeng Qu (Ocean University of China), Jianjun Chen (Tsinghua University), Haixin Duan (Quancheng Lab)","speaker":"","s":"F3","pos":3,"sum":"AI 服务的媒体预处理管线存在语义鸿沟：同一份图片或音视频，人看到的和模型经缩放、解码、抽帧后看到的不一样，攻击者利用这个差异藏匿内容。属于 image-scaling attack 的推广。","basis":"title"},{"id":"B#5631","title":"Global-View Reasoning with LLMs for Real-World Vulnerability Detection","authors":"Xiaozhen Xu (Fudan University), Chaoran Tao (Fudan University), Guangliang Yang (Fudan University), Xinming Guo (Fudan University), Can Li (Fudan University), Yangshuo Bai (Fudan University), Yi Wang (Fudan University)","speaker":"","s":"F3","pos":4,"sum":"用 LLM 做真实代码库的漏洞检测，强调全局视角：不是只看单个函数，而是把跨函数、跨文件的上下文组织起来让模型推理。针对的是函数级检测脱离上下文、误报多的老问题。","basis":"title"},{"id":"A#1050","title":"GALAS: Compact VOLE-in-the-Head Signatures from Subfield Compression","authors":"Guoxiao Liu (Tsinghua University), Yimeng Sun (Shandong University), Zhuoqing Peng (Tsinghua University), Chongxu Ren (Tsinghua University), Guowei Liu (Shandong University), Juntong Lin (Shandong University), Keting Jia (Tsinghua University), Meiqin Wang (Shandong University)","speaker":"zhuoqing peng","s":"F4","pos":1,"sum":"更紧凑的 VOLE-in-the-Head 后量子签名，用子域压缩。与同场 B#6227 是同类工作。","basis":"title"},{"id":"A#1135","title":"New Designs of Multivariate-Polynomial Universal Hash Functions","authors":"Jean Paul Degabriele (Technology Innovation Institute), Jan Gilcher (ETH Zurich), Jérôme Govinden (Technology Innovation Institute), Kenneth G. Paterson (ETH Zurich)","speaker":"Jérôme Govinden","s":"F4","pos":2,"sum":"通用哈希函数是 MAC 等的基础构件。本文探索多元多项式型 UHF 的设计空间，重点是两层结构，目标是在同等安全界下更快。偏对称密码设计。","basis":"abs"},{"id":"B#3917","title":"Criminology: Refined Techniques for Compression Side-Channel Attacks","authors":"Yuanming Song (ETH Zurich), Lenka Mareková (ETH Zurich), Kenneth G. Paterson (ETH Zurich)","speaker":"Yuanming Song","s":"F4","pos":3,"sum":"先压缩再加密会经密文长度泄露明文信息，这一点已知二十年，CRIME 和 BREACH 是代表。本文改进这类压缩侧信道攻击的技术，提高恢复效率和适用范围。","basis":"abs"},{"id":"B#6227","title":"Shorter VOLE-in-the-Head-based Signatures from Vector Semi-Commitment","authors":"Seongkwang Kim (Korea University), Byeonghak Lee (Samsung SDS), Mincheol Son (Korea Advanced Institute of Science and Technology)","speaker":"Seongkwang Kim","s":"F4","pos":4,"sum":"VOLE-in-the-Head 把基于 VOLE 的零知识证明编译成后量子签名，签名大小主要由 GGM 树实现的向量承诺决定。本文把此前为 MPC-in-the-Head 设计的 vector semi-commitment 移植过来，得到更短的签名。","basis":"abs"},{"id":"B#438","title":"From Snapshot to Snooping: An Empirical Study on Geolocation Privacy Leakage in Large Vision Language Models","authors":"Yihe Zhou (City University of Hong Kong), Tao Ni (King Abdullah University of Science and Technology), Qingchuan Zhao (City University of Hong Kong), Cong Wang (City University of Hong Kong)","speaker":"Yihe Zhou","s":"F5","pos":1,"sum":"大型视觉语言模型的地理位置隐私泄露实证研究：给一张随手拍的照片，VLM 能把拍摄地点推断到多细。位置隐私加 VLM。","basis":"title"},{"id":"B#756","title":"AVP-Inspect: Coordinated Cyber-Physical Testing for Privacy Analysis of COTS Apple Vision Pro Applications","authors":"Yichang Xiong (George Mason University), Vamsi Shankar Simhadri (George Mason University), Yue Xiao (William & Mary), Xiaokuan Zhang (George Mason University)","speaker":"Yichang Xiong","s":"F5","pos":2,"sum":"Apple Vision Pro 应用的隐私分析。此前 XR 隐私研究集中在基于 Android 的 Quest 上，AVP 因系统封闭一直没人做。本文在真机上做自动化测试，把物理环境里的交互与网络流量对应起来，从流量里检出隐私违规。","basis":"abs"},{"id":"B#1603","title":"PersonaHate: A Scalable Persona-Based Data Synthesis Pipeline for Hate Speech Analysis","authors":"Xinyu Zhang (CISPA Helmholtz Center for Information Security), Ziqing Yang (CISPA Helmholtz Center for Information Security), Michael Backes (CISPA Helmholtz Center for Information Security), Yang Zhang (CISPA Helmholtz Center for Information Security)","speaker":"Ziqing Yang","s":"F5","pos":3,"sum":"用基于人物设定的合成数据管线生成仇恨言论分析所需的数据，应是借助 LLM。偏内容安全。","basis":"title"},{"id":"B#1952","title":"Real Money, Fake Models: Deceptive Model Claims in Shadow APIs","authors":"Yage Zhang (CISPA Helmholtz Center for Information Security), Yukun Jiang (CISPA Helmholtz Center for Information Security), Zeyuan Chen (CISPA Helmholtz Center for Information Security), Michael Backes (CISPA Helmholtz Center for Information Security), Xinyue Shen (University of Waterloo), Yang Zhang (CISPA Helmholtz Center for Information Security)","speaker":"Yukun Jiang","s":"F5","pos":4,"sum":"shadow API 是声称能转接 GPT-5、Gemini 等官方模型的第三方中转服务。本文首次系统测量它们是不是真的给了所声称的模型，结论是存在大量以次充好。对用中转 API 做实验的论文是个可复现性警告。","basis":"abs"},{"id":"A#718","title":"SlowPerception: Physical-World Latency Attack against Camera-based Perception in Autonomous Driving","authors":"Chen Ma (Xi'an Jiaotong University), Ningfei Wang (Independent Researcher), Zhengyu Zhao (Xi'an Jiaotong University), Qian Wang (Wuhan University), Chao Shen (Xi'an Jiaotong University)","speaker":"Chen Ma","s":"F6","pos":1,"sum":"对自动驾驶相机感知的物理世界延迟攻击：让感知模块变慢而不是出错，从而延误决策。UC Irvine Qi Alfred Chen 组这条线。","basis":"title"},{"id":"A#1095","title":"Illusion of Depth: Revealing Hidden Stereo Vision Vulnerabilities in Depth Estimation","authors":"Sri Hrushikesh Varma Bhupathiraju (University of Florida), Tetsu Ishizue (The University of Electro-Communications), Nicholas U. Costagliola (University of Florida), Ozora Sako (Keio University), Kentaro Yoshioka (Keio University), Takeshi Sugawara (The University of Electro-Communications), Sara Rampazzi (University of Florida)","speaker":"Tetsu Ishizue","s":"F6","pos":2,"sum":"双目相机在自动驾驶、无人机和机器人里用于低成本测深。本文揭示其像素采样和标定过程带来的固有弱点，攻击者可借此影响立体匹配算法的输出，制造错误的深度。","basis":"abs"},{"id":"B#5777","title":"Investigating Planning Attacks against End-to-End Autonomous Driving","authors":"Ruoyu Song (Purdue University), Chenyi Wang (University of Arizona), Raymond Muller (Lawrence Livermore National Laboratory), Jean-Philippe Monteuuis (Qualcomm Technologies, Inc.), Ryan Gerdes (Virginia Tech), Jonathan Petit (Qualcomm Technologies, Inc.), Ming F. Li (University of Arizona), Antonio Bianchi (Purdue University), Z. Berkay Celik (Purdue University)","speaker":"Jean-Philippe Monteuuis","s":"F6","pos":3,"sum":"针对端到端自动驾驶模型的规划层攻击研究。","basis":"title"},{"id":"B#6545","title":"From Stealthy Data Fabrication to Unsafe Driving: Realistic Scenario Attacks on Collaborative Perception","authors":"Qingzhao Zhang (University of Arizona), Runting Zhang (University of Michigan), Z. Morley Mao (University of Michigan)","speaker":"Haotian Chu","s":"F6","pos":4,"sum":"车联网协同感知让车辆共享感知数据，也带来数据伪造风险。已有攻击要么容易被检测，要么只在理想条件下评估。本文研究贴近真实驾驶场景的隐蔽伪造攻击，并演示其如何导致不安全的驾驶决策。","basis":"abs"},{"id":"B#133","title":"TDDM-Melatt: A Decoupled Memory and Diffusion Framework for Generalizable Encrypted Traffic Classification","authors":"Ze Chen (National University of Defense Technology), Qiming Yu (National University of Defense Technology), Zijia Song (National University of Defense Technology), Guozheng Yang (National University of Defense Technology), Wei Yan (National University of Defense Technology)","speaker":"Ze Chen","s":"F8","pos":1,"sum":"加密流量分类的泛化问题。数据集驱动的方法容易学到伪相关特征，真实流量又是长尾分布。方法由两部分组成：解耦的记忆模块抑制 shortcut learning，diffusion 做数据增强补长尾。","basis":"abs"},{"id":"B#640","title":"A First-Principles Evaluation of Graph-Based Network Intrusion Detection Systems","authors":"Rui Zhao (University of Virginia), Wajih UI Hassan (University of Virginia)","speaker":"","s":"F8","pos":2,"sum":"对基于图的网络入侵检测系统做一次推倒重来的评测。GIDS-Eval 把一个 GIDS 拆成六个可互换的阶段，把各论文自带的预处理、窗口、阈值惯例变成显式实验变量，再统一比较。结论是 benchmark 上的高指标说明不了可部署性。","basis":"abs"},{"id":"B#1078","title":"Navigating the Latent Manifold: Proactive Concept Drift Adaptation for Resilient NIDS","authors":"Chao Zha (Zhejiang University), Zifeng Kang (Beijing University of Posts and Telecommunications), Tian Liu (Institute of Agricultural Equipment, Zhejiang Academy of Agricultural Sciences.), Dakun Shen (Zhejiang University), Ruyun Zhang (Shanghai Artificial Intelligence Laboratory)","speaker":"","s":"F8","pos":3,"sum":"NIDS 的概念漂移适应。DriftXpert 分两阶段离线适应：先在潜空间里用流形偏离度做无监督异常度量找出漂移样本，再据此更新检测器，不需要持续的人工标注。","basis":"abs"},{"id":"B#1456","title":"Frequency-Domain Mixing Data Augmentation for Malicious Traffic Detection","authors":"Yuhao Yan (Beihang University), Bo Lang (Beihang University), Xiangyu Li (Beihang University)","speaker":"Yuhao Yan","s":"F8","pos":4,"sum":"恶意流量检测的数据增强。流量分布变化快，训练数据多样性不足导致 OOD 泛化差。本文把频域混合这种增强方式适配到流量数据上，改善 OOD 表现。","basis":"abs"},{"id":"A#1016","title":"BACAgent: LLM-Powered Detection of Broken-Access-Control Vulnerabilities in Web Applications","authors":"Fengyu Liu (Fudan University), Yuan Zhang (Fudan University), Zheng Lou (Fudan University), Tian Chen (Fudan University), Youkun Shi (Fudan University), Jiarun Dai (Fudan University), Enhao Li (Fudan University), Guangyu Zhou (ByteDance Inc.), Zhongfu Su (ByteDance Inc.), Zequn Fang (ByteDance Inc.)","speaker":"Fengyu Liu","s":"F9","pos":1,"sum":"用 LLM agent 检测 Web 应用里的越权漏洞（broken access control）。这类漏洞依赖业务语义，传统扫描器难以处理，所以让 LLM 理解角色与权限逻辑后自动构造越权测试。","basis":"title"},{"id":"A#3360","title":"Your Space is My Zone: Demystifying the Security Risks of AI-Powered Applications on Pre-Trained Model Hubs","authors":"Yacong Gu (Tsinghua University), Lingyun Ying (QI-ANXIN Technology Research Institute), Zidong Zhang (QI-ANXIN Technology Research Institute), Yingyuan Pu (QI-ANXIN Technology Research Institute), Xiaoxue Huang (QI-ANXIN Technology Research Institute), Jiawei Zhou (QI-ANXIN Technology Research Institute), Wenjie Zhu (QI-ANXIN Technology Research Institute), Donghong Sun (Tsinghua University), Haixin Duan (Quancheng Lab; Tsinghua University)","speaker":"","s":"F9","pos":2,"sum":"模型托管平台上的 AI 应用，例如 Hugging Face Spaces 这类，的安全风险测量。作者用 CodeQL 数据流分析工具批量扫描应用代码并给出 PoC。属于 AI 供应链与平台安全。","basis":"title"},{"id":"B#415","title":"Automatically Learning Vulnerability Patterns for Scalable Static Analysis of Web Applications","authors":"Penghui Li (Columbia University), Songchen Yao (Columbia University), Josef Sarfati Korich (Columbia University), Changhua Luo (Independent Researcher), Jianjia Yu (Johns Hopkins University), Yinzhi Cao (Johns Hopkins University), Junfeng Yang (Columbia University)","speaker":"Penghui Li","s":"F9","pos":3,"sum":"自动学习漏洞模式，用于 Web 应用的可扩展静态分析，减少人工写规则。","basis":"title"},{"id":"B#4240","title":"VUnitFuzz: Decoupling PHP Sink Verification from Monolithic Execution for Taint-Style Vulnerability Detection","authors":"Youkun Shi (The Hong Kong Polytechnic University), Yuan Zhang (Fudan University), Tianhao Bai (Fudan University), Jiarun Dai (Fudan University), Fengyu Liu (Fudan University), Xiapu Luo (The Hong Kong Polytechnic University)","speaker":"Youkun Shi","s":"F9","pos":4,"sum":"PHP 污点型漏洞检测：把 sink 点的验证从整体执行中解耦出来，单独做单元级 fuzzing。","basis":"title"},{"id":"A#393","title":"DisarmRAG: Stealthy Retriever Poisoning to Disable Self-Correction in Retrieval-Augmented Generation","authors":"Yanbo Dai (The Hong Kong University of Science and Technology), Zhenlan Ji (Nara Institute of Science and Technology (NAIST)), Zongjie Li (The Hong Kong University of Science and Technology), Kuan Li (The Hong Kong University of Science and Technology), Shuai Wang (The Hong Kong University of Science and Technology)","speaker":"","s":"G1","pos":1,"sum":"RAG 投毒在真实部署里常常失效，因为 LLM 有自我纠错能力：发现检索内容可疑时会不予采信，而主流配置默认开启这一能力。DisarmRAG 不去投毒知识库，而是隐蔽地污染 retriever，让它在目标 query 下召回一条关闭自我纠错的指令，之后常规投毒才重新生效。","basis":"abs"},{"id":"A#840","title":"MIRAGE: Misleading Retrieval-Augmented Generation via Black-box and Query-agnostic Poisoning Attacks","authors":"Tailun Chen (Zhejiang University), Yu He (Zhejiang University), Yan Wang (Alibaba Group), Shuo Shao (Zhejiang University), Haolun Zheng (Zhejiang University), Zhihao Liu (Zhejiang University), Jinfeng Li (Alibaba Group), Zhizhen Qin (Amazon), Yuefeng Chen (Alibaba Group), Zhixuan Chu (Zhejiang University), Zhan Qin (Zhejiang University), Kui Ren (Zhejiang University)","speaker":"Tailun Chen","s":"G1","pos":2,"sum":"RAG 语料投毒，严格黑盒且不知道用户会问什么。已有攻击要么假设白盒，要么假设已知 query。MIRAGE 是一条多阶段流水线，靠 surrogate 模型的反馈自动优化投毒文档，使其对一类问题都能被检索到并误导生成。","basis":"abs"},{"id":"A#984","title":"BadTV: Unveiling Backdoor Threats in Third-Party Task Vectors","authors":"Chia-Yi Hsu (National Yang Ming Chiao Tung University), Yu-Lin Tsai (University of California, Berkeley), Zhe Yu (RIKEN Center for Advanced Intelligence Project), Yan-Lun Chen (National Yang Ming Chiao Tung University), Chih-Hsun Lin (National Chengchi University), Chia-Mu Yu (National Yang Ming Chiao Tung University), Yang Zhang (CISPA Helmholtz Center for Information Security), Chun-Ying Huang (National Yang Ming Chiao Tung University), Jun Sakuma (Institute of Science Tokyo)","speaker":"","s":"G1","pos":3,"sum":"task arithmetic 的后门风险。用户从第三方下载 task vector，对模型做加减来增删能力。BadTV 构造非对称的复合后门，使它在加上这个向量学任务和减去这个向量做遗忘两种用法下都生效。","basis":"abs"},{"id":"B#2111","title":"MemPoison: Bypassing Selective Memory Mechanisms to Plant Backdoors in LLM Agents","authors":"Hongtao Wang (North China Electric Power University), Se Yang (North China Electric Power University), Yu Chen (Tencent), Puzhuo Liu (Tsinghua University)","speaker":"Hongtao Wang","s":"G1","pos":4,"sum":"LLM agent 长期记忆的投毒。以往攻击假设注入内容能原样进记忆，而现在的记忆管线会先做选择性抽取和改写。MemPoison 专门绕过这两步，让恶意内容以后门形式存活下来并影响之后的行为。","basis":"abs"},{"id":"B#2301","title":"InceptionRAG: Stealthy Poisoning Attack Against Retrieval-Augmented Generation","authors":"Jiachang Zhang (Zhejiang University), Min Chen (Vrije Universiteit Amsterdam), Xiao Ren (Zhejiang University), Zhenyong Zhang (Guizhou University), Yuanchao Shu (Zhejiang University), Yunjun Gao (Zhejiang University), Zhikun Zhang (Zhejiang University)","speaker":"Jiachang Zhang","s":"G1","pos":5,"sum":"RAG 投毒的新形态。已有攻击把完整的恶意 payload 塞进单篇文档，现有防御已经能识别。InceptionRAG 改为间接逻辑诱导：多篇文档各自看起来无害，合在一起才把模型引向错误结论。","basis":"abs"},{"id":"B#2401","title":"Detecting Data Poisoning in Code Generation LLMs via Black-Box, Vulnerability-Oriented Scanning","authors":"Shenao Yan (University of Connecticut), Shan Jin (Visa Research), Shimaa Ahmed (Visa Research), Sunpreet Singh Arora (Visa Research), Yiwei Cai (Visa Research), Yizhen Wang (Visa Research), Yuan Hong (University of Connecticut)","speaker":"Yizhen Wang","s":"G1","pos":6,"sum":"检测代码生成 LLM 是否被投毒或植入后门，黑盒。已有扫描方法靠 token 级的生成一致性反推攻击目标，对代码无效，因为同一语义有很多写法。CodeScan 改为面向漏洞：防御方指定关心的漏洞类型，再扫描模型是否系统性地产出它。","basis":"abs"},{"id":"A#1203","title":"How to Back Up High-Value Secret Keys","authors":"Sanjam Garg (University of California, Berkeley), Noemi Glaeser (Technical University of Darmstadt), Abhishek Jain (Johns Hopkins University), Michael Lodder (Tectonic Labs), Hart Montgomery (Linux Foundation)","speaker":"Noemi Glaeser","s":"G2","pos":1,"sum":"交易所冷钱包密钥、账号恢复码这类一年只用一两次的高价值秘密怎么备份。现有办法在安全性和可用性之间各有妥协，本文给出专门针对低频高价值密钥的备份方案。","basis":"abs"},{"id":"B#2048","title":"New IND-CPA-D Attacks on BFV and BGV","authors":"Hyeongmin Choe (University of Luxembourg), Minsik Kang (Sejong University), Damien Stehlé (CryptoLab, Inc)","speaker":"Hyeongmin Choe","s":"G2","pos":2,"sum":"IND-CPA-D 是 FHE 特有的安全概念，刻画攻击者能看到解密结果的情形，门限解密下必须满足。本文给出对 BFV 和 BGV 的三种新攻击，在按启发式方式选取参数时成立。","basis":"abs"},{"id":"B#3042","title":"Distributed Key Generation for Efficient Threshold-CKKS","authors":"Seonhong Min (Seoul National University), Guillaume Hanrot (Cryptolab, Inc.), Jai Hyun Park (CryptoLab, Inc.), Alain Passelègue (CryptoLab, Inc.), Damien Stehlé (CryptoLab, Inc.)","speaker":"Seonhong Min","s":"G2","pos":3,"sum":"门限 CKKS 需要深层计算，就要 bootstrapping，而最高效的 bootstrapping 依赖稀疏三元密钥。本文解决如何分布式地生成这种结构化密钥，使门限 CKKS 真正高效。","basis":"abs"},{"id":"B#4584","title":"On Threshold Fully Homomorphic Encryption with Synchronized Decryptors","authors":"François Colin de Verdière (ENS de Lyon), Alain Passelègue (CryptoLab Inc.), Damien Stehlé (CryptoLab Inc.)","speaker":"Damien Stehlé","s":"G2","pos":4,"sum":"门限 FHE 在同步设定下，即解密者集合在解密开始时已知，可以绕开一个主要难点：为隐藏重构引入的巨大噪声而被迫放大参数。本文系统研究这一设定下的构造和安全性。","basis":"abs"},{"id":"B#5128","title":"Schnorr Signatures and MuSig2 are Jointly Secure, Even in Deterministic Wallets","authors":"Renas Bacho (Ruhr University Bochum), Yanbo Chen (University of Ottawa), Poulami Das (Least Authority), Julian Loss (Ruhr University Bochum), Tim Ruffing (Blockstream Research), Benedikt Wagner (Ethereum Foundation)","speaker":"","s":"G2","pos":5,"sum":"加密货币钱包用 Schnorr 签名加公开的确定性密钥派生，有些还支持 MuSig2 多签。两者在同一把密钥上并用是否安全此前没有证明。本文证明它们联合安全，在确定性钱包里也成立。","basis":"abs"},{"id":"B#7326","title":"Random Robust Secret Sharing with Perfect Privacy and its Applications","authors":"Mohammad Hassan Ameri (Purdue University), Jeremiah Blocki (Purdue University)","speaker":"Jeremiah Blocki","s":"G2","pos":6,"sum":"Shamir 这类秘密共享对少于门限的份额有完美隐私。本文研究随机的鲁棒秘密共享，即有份额被恶意篡改时仍能正确重构，同时保持完美隐私，并给出应用。","basis":"abs"},{"id":"A#1570","title":"HYDRA: Proactive Android Malware Drift Adaptation via Hierarchical Graph Contrastive Learning","authors":"Han Chen (University of Technology Sydney), Hanchen Wang (University of Technology Sydney), Hongmei Chen (Yunnan University), Lu Qin (University of Technology Sydney), Wenjie Zhang (University of New South Wales), Ying Zhang (University of Technology Sydney)","speaker":"","s":"G3","pos":1,"sum":"Android 恶意软件快速演化造成的概念漂移让 ML 检测器迅速失效。现有适应策略要么事后补救且依赖人工标注，要么主动但基于不稳定的对抗训练。HYDRA 用层次化的图对比学习做主动适应。","basis":"abs"},{"id":"B#29","title":"Shoot the Honey, Cloak the Player: Towards Zero-Runtime-Overhead Proactive Defense and Detection for Visual Game Cheating","authors":"Jianing Wang (Shandong University), Chuqi Zhang (Independent Researcher), Yuancheng Jiang (National University of Singapore), Adil Ahmad (Arizona State University), Shanqing Guo (Shandong University)","speaker":"Jianing Wang","s":"G3","pos":2,"sum":"对付游戏里的视觉外挂，如透视：主动放置蜜罐对象并隐藏真实玩家，做到零运行时开销的防御和检测。","basis":"title"},{"id":"B#60","title":"SteamFuzz: Boosting Firmware Fuzzing via Automatic Message Window Inference","authors":"Jorik van Nielen (University of Twente), Andreas Peter (University of Oldenburg), Andrea Continella (University of Twente)","speaker":"Jorik van Nielen","s":"G3","pos":3,"sum":"固件 fuzzing：自动推断外设消息的时间窗口，提高 fuzzing 效率。","basis":"title"},{"id":"B#906","title":"Governing AI Agent with Capability and Delegation Chain","authors":"Jiaqin Yan (Shanghai Jiao Tong University), Guoxing Chen (Shanghai Jiao Tong University), Yan Meng (Shanghai Jiao Tong University), Haojin Zhu (Shanghai Jiao Tong University)","speaker":"Jiaqin Yan","s":"G3","pos":4,"sum":"AI agent 的治理机制，借用操作系统里的 capability 概念并加上 delegation chain：agent 把任务转交给子 agent 或工具时，权限沿链条逐级收窄且可追溯。属于 agent 访问控制。","basis":"title"},{"id":"B#1915","title":"As Seasons Change: Temporal Feature Powers Malware Classification","authors":"Jianwen Tian (Singapore Management University), Debin Gao (Singapore Management University), Yongkang Chen (Academy of Military Sciences), Wei Kong (Zhejiang Sci-Tech University), David Lo (Singapore Management University), Haoyu Ma (Beijing Jiaotong University), Zhi Wang (Nankai University)","speaker":"","s":"G3","pos":5,"sum":"恶意软件分类里利用时间特征来应对概念漂移。与同场 A#1570 HYDRA 主题相近。","basis":"title"},{"id":"B#4698","title":"AutoSOUP: Safety-Oriented Unit Proof Generation for Memory-Safety Verification","authors":"Paschal Amusuo (Purdue University), Ricardo Calvo (Purdue University), Dharun Anandayuvaraj (Purdue University), Taylor Le Lievre (Columbia University), Kevin Kolyakov (University of Waterloo), Elijah Jorgensen (Purdue University), Aravind Machiry (Purdue University), James C Davis (Purdue University)","speaker":"Ricardo Calvo","s":"G3","pos":6,"sum":"自动生成面向内存安全验证的 unit proof，降低对 C 代码做有界模型检验的人工成本。","basis":"title"},{"id":"A#1012","title":"qedb: Expressive and Modular Verifiable Databases (without SNARKs)","authors":"Vincenzo Botta (Independent), Simone Bottoni (Provably Technologies), Matteo Campanelli (Offchain Labs), Emanuele Ragnoli (Provably Technologies), Alberto Trombetta (Università degli Studi dell'Insubria)","speaker":"Alberto Trombetta","s":"G4","pos":1,"sum":"可验证数据库：客户端只持有短摘要，就能验证外包数据库返回的任何查询结果。qedb 不用 SNARK，设计简单、模块化，支持表达力更强的查询。","basis":"abs"},{"id":"A#1720","title":"Rogue: Updatable Matrix Lookup Arguments and Applications to Verifiable Databases","authors":"Christodoulos Pappas (Hong Kong University of Science and Technology), Zhuo Cai (Hong Kong University of Science and Technology), Dimitrios Papadopoulos (Hong Kong University of Science and Technology)","speaker":"","s":"G4","pos":2,"sum":"用 SNARK 证明对大数据集的计算，要先把整个数据集载入电路，开销大，而很多查询只访问一小部分。Rogue 是可更新的矩阵 lookup argument，让证明开销只与访问的部分相关，应用于可验证数据库。","basis":"abs"},{"id":"B#1072","title":"PRISM: Efficient zkSNARKs for RNS-Based Homomorphic Encryption","authors":"Zhelei Zhou (Ant Group), Yun Li (Ant Group), Zhaomin Yang (Ant Group), Cheng Hong (Ant Group), Tao Wei (Ant Group)","speaker":"Zhelei Zhou","s":"G4","pos":3,"sum":"同态加密不保证计算被正确执行，所以需要可验证 HE。BFV、BGV、CKKS 用 RNS 表示来提速，但 RNS 运算在 SNARK 里很难高效证明。PRISM 是为 RNS 型 HE 定制的 zkSNARK。","basis":"abs"},{"id":"B#1182","title":"Titan: Efficient Polynomial Commitments from IOPs over Groups","authors":"Chethan Kamath (IIT Bombay), Ravi Prakash (IIT Bombay), Samipa Samanta (IIT Bombay), Sruthi Sekar (IIT Bombay), Nitin Singh (IBM Research)","speaker":"Samipa Samanta","s":"G4","pos":4,"sum":"透明 setup 的多项式承诺方案。承诺时间 O(n)，求值 O(√n)，证明大小和验证为 O(n 的四次方根)。证明比基于哈希的方案小一个数量级，prover 和 verifier 也比同类方案高效。","basis":"abs"},{"id":"B#2844","title":"SubLogarithmic Linear Time SNARKs from Improved Sumcheck","authors":"Sikhar Patranabis (IBM Research), Nitin Singh (IBM Research), Sayani Sinha (IIT Kharagpur)","speaker":"","s":"G4","pos":5,"sum":"HybridSpartan 和 HybridPlonk：首批同时做到线性时间 prover、亚对数证明大小、对数时间 verifier 且 setup 可更新的 SNARK。核心技术是改进的 sumcheck。","basis":"abs"},{"id":"B#3780","title":"Wasp: Succinct Non-Interactive Zero-Knowledge Proofs from VOLE","authors":"Zhanpeng Guo (Ant Group), Zhelei Zhou (Ant Group), Yun Li (Ant Group), Chenkai Weng (Arizona State University), Cheng Hong (Ant Group), Tao Wei (Ant Group)","speaker":"","s":"G4","pos":6,"sum":"基于 VOLE 的零知识证明 prover 很快，但通信和验证通常是线性的。Wasp 在此前 Antman 的亚线性通信基础上更进一步，做成简洁且非交互的证明。","basis":"abs"},{"id":"A#1652","title":"Reflection, Education, Consistency: Towards Best Ethics Practices At Security And Privacy Conferences","authors":"Florian Hantke (CISPA Helmholtz Center for Information Security), Rafael Mrowczynski (CISPA Helmholtz Center for Information Security), Til Dralle (CISPA Helmholtz Center for Information Security), Ben Stock (CISPA Helmholtz Center for Information Security)","speaker":"Florian Hantke","s":"G5","pos":1,"sum":"安全与隐私会议的伦理审查实践调查，并提出最佳实践：反思、教育、一致性。作者群体里有多个会议的伦理委员会成员。","basis":"title"},{"id":"A#2426","title":"Beyond the Buzzword: How do Professionals Understand and Translate Zero Trust?","authors":"Ananta Soneji (University of Nebraska at Omaha), Souradip Nath (Arizona State University), Moritz Schloegel (CISPA Helmholtz Center for Information Security), Yan Shoshitaishvili (Arizona State University), Gail-Joon Ahn (Arizona State University), Adam Doupe (Arizona State University), Carlos Rubio-Medrano (Texas A&M University - Corpus Christi)","speaker":"Moritz Schloegel","s":"G5","pos":2,"sum":"从业者如何理解并落地“零信任”这个概念，访谈研究。","basis":"title"},{"id":"B#1577","title":"Exploring the Complexities of Passkey Revocation","authors":"Anna Giacomello (CISPA Helmholtz Center for Information Security), Leona Lassak (Max Planck Institute for Security and Privacy), Jonas Hielscher (CISPA Helmholtz Center for Information Security), Maximilian Golla (CISPA Helmholtz Center for Information Security)","speaker":"Anna Giacomello","s":"G5","pos":3,"sum":"Passkey 的撤销远比想象复杂：设备丢失、账号共享、跨平台同步时怎么办。","basis":"title"},{"id":"B#1666","title":"When Assessment Propagates Insecurity: How Inter-Organizational Supply Chain Security Assessment Decouples Awareness from Practice","authors":"Huancheng Hu (University of Potsdam), Hanna Schall (University of Potsdam), Chaewon Bak (University of Potsdam), Christian Doerr (University of Potsdam)","speaker":"Huancheng Hu","s":"G5","pos":4,"sum":"供应链安全评估问卷在组织之间层层传递，反而让安全意识与实际做法脱节。定性研究。","basis":"title"},{"id":"B#3350","title":"How Children Assess Digital Safety Risk in Gaming Platforms: A Case Study of Roblox","authors":"Zinan Zhang (The Pennsylvania State University), Qiurong Song (The Pennsylvania State University), Xinning Gui (The Pennsylvania State University), Junnan Yu (The Hong Kong Polytechnic University), Sunhye Bai (University of Oregon), Yubo Kou (The Pennsylvania State University)","speaker":"Zinan (Zina) Zhang","s":"G5","pos":5,"sum":"儿童如何评估游戏平台上的数字安全风险，以 Roblox 为例。","basis":"title"},{"id":"B#7292","title":"''People can change, and patterns can be broken'': Contextualizing Tradeoffs in Automated Decision-Making Systems","authors":"Rabeya Bosri (University of Alberta), Anna Harbluk Lorimer (University of Chicago), Afrida Hossain (University of Alberta), Vasisht Duddu (University of Waterloo), Bailey Kacsmar (University of Alberta)","speaker":"Bailey Kacsmar","s":"G5","pos":6,"sum":"自动化决策系统里各种权衡的情境化研究，访谈受这些系统影响的人。","basis":"title"},{"id":"A#4446","title":"EdgeRefine: Privacy-Utility Balance for Graphs via Jaccard Sampling under Edge Differential Privacy","authors":"Wenxiu Ding (Xidian University), Muzhi Liu (Xidian University), Zheng Yan (Xidian University), Mingjun Wang (Xidian University), Yifan Zhao (Xidian University), Qiao Liu (Xidian University)","speaker":"Zheng Yan","s":"G6","pos":1,"sum":"边级差分隐私下的图学习。常规做法是对整个邻接矩阵加噪，隐私越强图越糊。EdgeRefine 属于 LDP 方案，用 Jaccard 相似度指导采样，对加噪后的图做精炼，保留更可能真实存在的边。","basis":"abs"},{"id":"B#265","title":"G-Fence: Secure, Efficient, and Differentially Private Graph Neural Network Training over Federated Graphs","authors":"Shuangqing Xu (Harbin Institute of Technology, Shenzhen), Yifeng Zheng (The Hong Kong Polytechnic University), Zhongyun Hua (Harbin Institute of Technology, Shenzhen), Haibo Hu (The Hong Kong Polytechnic University)","speaker":"Shuangqing Xu","s":"G6","pos":2,"sum":"联邦图上的 GNN 训练，同时要求安全、高效和差分隐私。图数据分散在多方，边和节点特征都不能暴露。从标题看是 MPC 或安全聚合与 DP 的组合方案。","basis":"title"},{"id":"B#788","title":"DWBench: Holistic Evaluation of Watermark for Dataset Copyright Auditing","authors":"Xiao Ren (Zhejiang University), Xinyi Yu (Xi'an Jiaotong University), Linkang Du (Xi'an Jiaotong University), Min Chen (Vrije Universiteit Amsterdam), Yuanchao Shu (Zhejiang University), Zhou Su (Xi'an Jiaotong University), Yunjun Gao (Zhejiang University), Zhikun Zhang (Zhejiang University)","speaker":"Xiao Ren","s":"G6","pos":3,"sum":"数据集水印用于版权审计的统一 benchmark。已有方法各评各的，无法比较。DWBench 按实现方式和验证方式两个维度梳理现有方法，给出跨任务一致的评测流程和开源工具。","basis":"abs"},{"id":"B#904","title":"NotaryMark: Multi-Bit Watermarking for Black-Box Dataset Usage Auditing in Text-to-Image Diffusion Models","authors":"Xinyi Yu (Xi'an Jiaotong University), Linkang Du (Xi'an Jiaotong University), Zhou Su (Xi'an Jiaotong University), Min Chen (Vrije Universiteit Amsterdam), Yuntao Wang (Xi'an Jiaotong University), Zhikun Zhang (Zhejiang University)","speaker":"Xinyi Yu","s":"G6","pos":4,"sum":"文生图 diffusion 模型的数据集使用审计，黑盒。在数据集里嵌入多比特水印，之后只凭模型生成的图片判断它是否用了该数据集，并读出是哪一份。与同场 DWBench 对应，一个是方法一个是评测。","basis":"title"},{"id":"B#2720","title":"Beyond One-Size-Fits-All: Neural Networks for Differentially Private Tabular Data Synthesis","authors":"Kai Chen (University of Virginia), Chen Gong (University of Virginia), Tianhao Wang (University of Virginia)","speaker":"","s":"G6","pos":5,"sum":"差分隐私表格数据合成，用神经网络。标题针对的是现有方法一套配置打天下的做法，主张按数据集特性选择或调整生成模型。","basis":"title"},{"id":"B#3616","title":"Rethinking the Security of DP-SGD: A Corrected Analysis of Differentially Private Machine Learning","authors":"Wenhao Wang (Monash University), Shujie Cui (Monash University), Hui Cui (Monash University), Xingliang Yuan (The University of Melbourne)","speaker":"Wenhao Wang","s":"G6","pos":6,"sum":"重新审视 DP-SGD 的安全性分析，标题直言是更正。应是指出现有隐私核算或实现中的某个假设不成立，例如采样方式与分析不符，并给出修正后的界。如果结论成立，影响面很大。可与周一 B1 场的 A#787 一起看。","basis":"title"},{"id":"A#378","title":"On the Limits of Consensus under Dynamic Availability and Reconfiguration","authors":"Javier Nieto (University of Illinois Urbana-Champaign), Joachim Neu (a16z Crypto Research), Ling Ren (University of Illinois Urbana-Champaign)","speaker":"Javier Nieto","s":"G8","pos":1,"sum":"PoS 区块链的共识需要同时支持动态可用性，即大量节点临时掉线仍保持活性，和成员重配置。本文在这一 DAR 模型下证明若干不可能性结果，划清现有协议能力的边界。","basis":"abs"},{"id":"A#580","title":"Angelfish: Leader, DAG, or Anywhere in Between","authors":"Qianyu Yu (The Hong Kong University of Science and Technology (Guangzhou)), Giuliano Losa (Stellar Development Foundation), Nibesh Shrestha (Supra Research), Xuechao Wang (The Hong Kong University of Science and Technology (Guangzhou))","speaker":"Qianyu Yu","s":"G8","pos":2,"sum":"BFT 共识有两种设计：由 leader 驱动、延迟低的，和把数据传播分离成异步 DAG 层、吞吐高的。Angelfish 提出一个可在两端之间连续调节的协议。","basis":"abs"},{"id":"A#1249","title":"Poros: Secure and Highly Parallel Sharding Blockchain with Optimized Cross-Shard Transaction Processing","authors":"Zhuocheng Pan (Beihang University), Jianwei Liu (Beihang University), Andi Liu (Beihang University), Yuxuan Hu (Beihang University), Boyu Zhao (Beihang University), Zhenyu Guan (Beihang University), Gerui Wang (Beijing Academy of Blockchain and Edge Computing), Mingchao Wan (Beijing Academy of Blockchain and Edge Computing), Yizhong Liu (Beihang University)","speaker":"Zhuocheng Pan","s":"G8","pos":3,"sum":"高并行的分片区块链，优化跨分片交易处理。","basis":"title"},{"id":"A#3579","title":"Prefix Consensus For Censorship Resistant BFT","authors":"Zhuolun Xiang (Aptos Labs), Andrei Tonkikh (Aptos Labs), Alexander Spiegelman (Aptos Labs)","speaker":"Alexander Spiegelman, Qianyu Yu","s":"G8","pos":4,"sum":"Prefix consensus：一种新的共识抽象，用于构造抗审查的 BFT 协议。","basis":"title"},{"id":"B#1416","title":"Areopagus: Asynchronous Sharding Blockchain Tolerating Corrupted Shards with Optimized Overhead","authors":"Yizhong Liu (Beihang University), Andi Liu (Beihang University), Yuxuan Hu (Beihang University), Jin Dong (Beijing Academy of Blockchain and Edge Computing), Jianwei Liu (Beihang University), Boyu Zhao (Beihang University), Yuan Lu (A*STAR Institute for Infocomm Research), Zhuocheng Pan (Beihang University), Meikang Qiu (Augusta University), Dawei Li (Beihang University), Zhenyu Guan (Beihang University)","speaker":"Andi Liu","s":"G8","pos":5,"sum":"异步分片区块链，能容忍个别分片整体被攻陷，同时控制开销。","basis":"title"},{"id":"B#5823","title":"On the Communication Complexity of Sleepy Consensus","authors":"Qiang Tang (The University of Sydney), Yuchen Ye (The University of Sydney)","speaker":"Yuchen Ye","s":"G8","pos":6,"sum":"Sleepy consensus 允许节点随意加入和离开。最长链协议在这一模型下延迟长，基于视图的 BFT 新协议延迟常数级但通信量大。本文研究 sleepy 模型下共识的通信复杂度上下界。","basis":"abs"},{"id":"A#1496","title":"Reproducing Web Application Vulnerabilities with Patch-Guided Routing Inference and Sink Exploration","authors":"Youkun Shi (Fudan University), Yuan Zhang (Fudan University), Feng Xue (Fudan University), Jiarun Dai (Fudan University), Lei Zhang (Fudan University), Fengyu Liu (Fudan University), Bocheng Xiang (Fudan University), Xiapu Luo (The Hong Kong Polytechnic University)","speaker":"Youkun Shi","s":"G9","pos":1,"sum":"自动复现 Web 应用漏洞：从补丁出发推断路由并探索 sink。和周二 D3 场的 CVE-Genie 目标相近，方法不同。","basis":"title"},{"id":"A#4614","title":"Overloading Ad Blockers: Exploiting Filtering Logic for Selective Denial of Service","authors":"Hyunjoon Lee (Korea Advanced Institute of Science and Technology), Suyoung Lee (Korea Advanced Institute of Science and Technology), Heiko Kiesel (Technical University of Darmstadt), Sooel Son (Korea Advanced Institute of Science and Technology)","speaker":"Suyoung Lee","s":"G9","pos":2,"sum":"利用广告拦截器的过滤逻辑做选择性拒绝服务：构造内容使拦截器误杀正常资源，或使其过载。","basis":"title"},{"id":"B#40","title":"Breaking the Gate: Detecting Invisible Authentication Slip-Through in NGINX Reverse Proxy","authors":"Aliakbar Sadeghi (Samsung Research America), Maryam Rostamipoor (Stony Brook University), Sai Chand Boyapati (Samsung Research America), Omar Chowdhury (Stony Brook University)","speaker":"Ali Sadeghi","s":"G9","pos":3,"sum":"NGINX 反向代理配置里的隐形认证绕过，即请求在某些路径组合下漏过认证检查，自动检测。","basis":"title"},{"id":"B#431","title":"PORTA: Systematic Discovery of Vulnerabilities in Identity Brokers","authors":"Zixu Zhou (University of Toronto), Xiangyu Guo (University of Toronto), Ilya Grishchenko (University of Toronto), David Lie (University of Toronto)","speaker":"","s":"G9","pos":4,"sum":"系统化发现身份代理（identity broker，如 Keycloak 这类 SSO 中间层）的漏洞。","basis":"title"},{"id":"B#1297","title":"RESTGuardian: Automated Black-Box Fuzzing for RESTful API via Efficient Dependency Inference and Deep Vulnerability Detection","authors":"Yifan Guo (Beihang University), Na Wang (Beihang University), Yunjia Wang (QI-ANXIN Technology Research Institute), Zhenyu Chen (QI-ANXIN Technology Research Institute), Yang You (Beijing University of Posts and Telecommunications), Junsong Fu (Beijing University of Posts and Telecommunications)","speaker":"Yifan Guo","s":"G9","pos":5,"sum":"RESTful API 的黑盒 fuzzing：高效推断接口之间的依赖，并做更深层的漏洞检测。","basis":"title"},{"id":"B#5040","title":"Comment and Control: Hijacking Agentic Workflows via Context-Grounded Evolution","authors":"Neil Fendley (Johns Hopkins University, Johns Hopkins Applied Physics Lab), Zhengyu Liu (Johns Hopkins University), Aonan Guan (Wyze Labs, Inc.), Jiacheng Zhong (Johns Hopkins University), Yinzhi Cao (Johns Hopkins University)","speaker":"Neil Fendley","s":"G9","pos":6,"sum":"劫持 agentic workflow。从标题看攻击入口是评论一类 agent 会读入的内容，利用 CI 或代码托管平台上的自动化 agent，把注入内容演化得贴合上下文以提高成功率。属于间接 prompt injection。","basis":"title"},{"id":"A#1126","title":"AuditVotes: Elevating Provable Defense for GNNs with Efficient Augmentation and Conditional Smoothing","authors":"Yuni Lai (Xidian University), Yulin Zhu (Hong Kong Chu Hai College), Yixuan Sun (The Hong Kong Polytechnic University), Yulun Wu (National University of Defense Technology), Bin Xiao (The Hong Kong Polytechnic University), Gaolei Li (Shanghai Jiao Tong University), Jianhua Li (Shanghai Jiao Tong University), Qi Xie (Hubei University), Kai Zhou (The Hong Kong Polytechnic University)","speaker":"Yuni Lai","s":"H1","pos":1,"sum":"GNN 的认证鲁棒性靠 randomized smoothing，但精度损失大。AuditVotes 在 smoothing 流水线里加两个部件：图重连增强，给随机化后的图去噪；conditional smoothing，只让高质量的预测参与投票。同时提升干净精度和认证鲁棒性。","basis":"abs"},{"id":"A#1659","title":"Rethinking Backdoor Adversarial Unlearning through the Lens of Catastrophic Forgetting in Continual Learning","authors":"Zhenqian Zhu (Harbin Institute of Technology, Shenzhen), Yamin Hu (Harbin Institute of Technology, Shenzhen), Yujiang Liu (Harbin Institute of Technology, Shenzhen), Luping Wei (Harbin Institute of Technology, Shenzhen), Wenbo Hou (Harbin Institute of Technology, Shenzhen), Bin Li (Shenzhen University), Haodong Li (Shenzhen University), Wenjian Luo (Harbin Institute of Technology, Shenzhen)","speaker":"","s":"H1","pos":2,"sum":"后门的 adversarial unlearning，即通过对抗训练让模型忘掉后门。作者用持续学习里的灾难性遗忘来解释它为什么有时有效有时反弹，并据此改进。","basis":"title"},{"id":"B#71","title":"SymSan: Mitigating Malware Embedding in Large Language Models via Parameter Space Symmetry","authors":"Ming Tan (Information Engineering University), Wei Li (Xidian University), Tao Hu (Information Engineering University), Qian Chen (Xidian University), Aodi Liu (Information Engineering University), Hailong Ma (Information Engineering University)","speaker":"Ming Tan","s":"H1","pos":3,"sum":"有人把恶意软件藏进 LLM 权重的低位，模型照常工作。SymSan 利用参数空间的对称性，即某些变换不改变模型功能却会改变权重数值，把权重洗一遍，嵌入的载荷就被破坏。","basis":"title"},{"id":"B#361","title":"LocalAlign: Enabling Generalizable Prompt Injection Defense via Generation of Near-Target Adversarial Examples for Alignment Training","authors":"Yuyang Gong (Nanyang Technological University), Zihao Wang (Nanyang Technological University), Jiawei Liu (Wuhan University), XiaoFeng Wang (Nanyang Technological University)","speaker":"Yuyang Gong","s":"H1","pos":4,"sum":"防 prompt injection 的对齐训练。现有防御教模型区分可信指令和不可信数据，能挡住明显的恶意注入，但对贴近原任务目标的注入泛化不好。LocalAlign 专门生成这种 near-target 的对抗样本用于对齐训练。","basis":"abs"},{"id":"B#781","title":"ArchProof: A Sound Output-Contribution Certificate for Dormant-Gate Path Backdoors in ONNX Models","authors":"Jin Xu (Tongji University), Miaomiao Zhang (Tongji University), Bowen Du (Tongji University)","speaker":"","s":"H1","pos":5,"sum":"针对 ONNX 模型里的架构后门：计算图中藏着平时不起作用的 dormant gate 路径，遇到触发输入才改变输出。ArchProof 给出一个 sound 的证书，证明某条路径对输出的贡献有界，从而排除这类后门。","basis":"title"},{"id":"B#1369","title":"Certifying Adversarial Robustness of Quantum Classifiers under Known-Readout Query Access","authors":"Ji Guan (Institute of Software, Chinese Academy of Sciences), Mingyu Huang (Arclight Quantum Computing Inc.)","speaker":"","s":"H1","pos":6,"sum":"量子分类器的认证对抗鲁棒性，设定是只知道测量方式、能查询有限次测量结果，看不到内部参数和梯度。给出仅基于测量的框架，对每个输入输出两种互补的保证：鲁棒半径下界和与攻击无关的上界。","basis":"abs"},{"id":"B#1493","title":"Code-SeC: A Decoding-time Probing Method for Characterizing Secret Memorization in Code LLM","authors":"Yanyuan Chen (Peking University), Ruize Hui (University of Chinese Academy of Sciences), Chen Hou (University of Chinese Academy of Sciences), Meikang Qiu (Augusta University)","speaker":"Ruize Hui","s":"H1","pos":7,"sum":"代码 LLM 记住训练数据里的密钥、口令等 secret 的问题。Code-SeC 在解码阶段做探测，刻画模型在什么上下文下、以多大概率吐出记住的 secret。","basis":"title"},{"id":"B#2996","title":"(A)iSpy: Parasitic Trojans for Machine Learning Infrastructure","authors":"Habibur Rahaman (University of Florida), Qipan Xu (University of Tennessee), Zafaryab Haider (University of Maine), Prabuddha Chakraborty (University of Maine), Swarup Bhunia (University of Florida), Fnu Suya (University of Tennessee)","speaker":"Habibur Rahaman","s":"H1","pos":8,"sum":"针对机器学习基础设施的寄生式木马：恶意逻辑不在模型权重里，而是寄生在框架、运行时或服务组件中，借模型的正常调用窃取信息。供应链攻击方向。","basis":"title"},{"id":"A#742","title":"DeepProve: Verifiable End-to-End Large Language Model Inference","authors":"Nicolas Gailly (Lagrange Labs), Ismael Hishon-Rezaizadeh (Lagrange Labs), Tianyi Liu (University of Illinois Urbana-Champaign), Nicholas Mainardi (Lagrange Labs), Dimitrios Papadopoulos (Hong Kong University of Science & Technology), Charalampos Papamanthou (Yale University), Christodoulos Pappas (Hong Kong University of Science & Technology), Shravan Srinivasan (Lagrange Labs), Zack Youell (Lagrange Labs), Yupeng Zhang (University of Illinois Urbana-Champaign)","speaker":"","s":"H2","pos":1,"sum":"可验证的端到端 LLM 推理：服务方给出零知识或简洁证明，证明输出确实是指定模型对该输入的计算结果。zkML 工程化方向，同一时段 I2 场的 zkTransformer 是同类工作。","basis":"title"},{"id":"A#753","title":"Melior, Verifiable Mixed-Integer Programming via zkSNARKs","authors":"Wenjie Qu (National University of Singapore), Yanze Jiang (National University of Singapore), Yanpei Guo (National University of Singapore), Jiaheng Zhang (National University of Singapore)","speaker":"","s":"H2","pos":2,"sum":"用 zkSNARK 证明混合整数规划的求解结果正确，不泄露私有输入。","basis":"title"},{"id":"B#472","title":"zkAgent: Verifiable LLM Agent Execution via One-Shot Transcript Proofs","authors":"Lizheng Wang (Shanghai Jiao Tong University), Hancheng Lou (Shanghai Jiao Tong University), Chongrong Li (Shanghai Jiao Tong University), Yu Yu (Shanghai Jiao Tong University), Yuncong Hu (Shanghai Jiao Tong University)","speaker":"Lizheng Wang","s":"H2","pos":3,"sum":"可验证的 LLM agent 执行。不逐步证明每次推理，而是对整段执行记录一次性出证明，证明 agent 的工具调用和输出与声称的模型及策略一致。","basis":"title"},{"id":"B#704","title":"Speeding Up Sum-Check Proving","authors":"Quang Dao (Carnegie Mellon University), Zachary DeStefano (NYU), Suyash Bagad (Shunya Labs), Yuval Domb (Ingonyama), Justin Thaler (Georgetown University and a16z crypto research)","speaker":"Alberto Centelles","s":"H2","pos":4,"sum":"sum-check 协议是最快的 SNARK 的核心。本文给出两个互补的 prover 优化：一个针对求值多为小数值的情形，如 32 位整数或小子域元素，这在实际应用里很常见。","basis":"abs"},{"id":"B#1842","title":"MamaBearZKP: A Holistic Co-design of Prime Fields and Proving Stacks for High-Throughput ZKP on Modern CPUs","authors":"Jipeng Zhang (National University of Singapore), Yanpei Guo (National University of Singapore), Tao Lu (National University of Singapore), Hao Cheng (Shandong University), Jiaheng Zhang (National University of Singapore)","speaker":"Jipeng Zhang","s":"H2","pos":5,"sum":"sum-check 和 FFT 占了现代零知识证明系统的主要算力，而现有优化分散在算法、协议和实现各层。本文从素域选择到证明栈做整体协同设计，榨干现代 CPU 的性能。","basis":"abs"},{"id":"B#2967","title":"Zero-Knowledge Proofs for Gradient Boosted Decision Trees","authors":"Jiacheng Gao (Nanjing University), Wenjie Qu (National University of Singapore), Yuan Zhang (Nanjing University), Sheng Zhong (Nanjing University), Jiaheng Zhang (National University of Singapore)","speaker":"Jiacheng Gao","s":"H2","pos":6,"sum":"梯度提升决策树在金融、医疗的表格数据上用得很广。训练和推理外包后，客户需要验证模型确实按声明训练、预测确实出自该模型，而提供方要保密数据和参数。本文为 GBDT 做零知识证明。zkML 方向。","basis":"abs"},{"id":"B#3194","title":"Efficient SNARK for Floating-Point Computation","authors":"Wenjie Qu (National University of Singapore), Zihao Zhang (National University of Singapore), Jiaheng Zhang (National University of Singapore)","speaker":"","s":"H2","pos":7,"sum":"浮点计算的高效 SNARK。浮点运算在算术电路里代价很高，这是 zkML 的基础问题。","basis":"title"},{"id":"B#5800","title":"LogVOLE: Succinct and Efficient Chosen-Input VOLE for ZK and Beyond","authors":"Lucien K. L. Ng (Georgia Institute of Technology), Peter Rindal (Category Labs), Akash Shah (University of California, Los Angeles)","speaker":"Peter Rindal","s":"H2","pos":8,"sum":"VOLE 相关性可高效生成，但若接收方要用自己选定的输入，通常要发送线性长度的向量来去随机化，这是通信瓶颈。LogVOLE 给出简洁高效的 chosen-input VOLE。","basis":"abs"},{"id":"A#161","title":"Implementation Bugs as Attacks: Adversarial Neuron Fuzzing and Supply-Chain Backdoors","authors":"Zizhuang Deng (Shandong University), Yiying Shan (Shandong University), Sanchuan Chen (Auburn University), Guozhu Meng (Institute of Information Engineering, Chinese Academy of Sciences; University of Chinese Academy of Sciences), Qingxin Wang (Institute of Information Engineering, Chinese Academy of Sciences; University of Chinese Academy of Sciences), Xueqing Zhang (Auburn University), Tong Liu (Institute of Information Engineering, Chinese Academy of Sciences; University of Chinese Academy of Sciences)","speaker":"Zizhuang Deng","s":"H3","pos":1,"sum":"把深度学习框架的实现 bug 当攻击面：对神经元级别的算子做对抗性 fuzzing，找到在特定输入下行为异常的实现缺陷，并说明它们可以被做成供应链后门。","basis":"title"},{"id":"A#569","title":"GoSe: Command-Line Option Sequence Generation with Runtime-Based Option Relationship Modeling for Security Testing","authors":"Zhineng Zhong (Peking University), Hanqin Guan (Peking University), Ding Li (Peking University)","speaker":"Zhineng Zhong","s":"H3","pos":2,"sum":"为命令行程序生成有意义的选项序列，用运行时信息建模选项之间的关系，用于安全测试。","basis":"title"},{"id":"A#594","title":"Opaque Shader: Dynamic Code Execution on GPUs via Explicit Graphics APIs","authors":"Hao Li (ShanghaiTech University), Yihong Hang (ShanghaiTech University), Yuan Xiao (ShanghaiTech University), Zhice Yang (ShanghaiTech University)","speaker":"Yuan Xiao","s":"H3","pos":3,"sum":"通过 Vulkan 这类显式图形 API 在 GPU 上动态执行代码，可用于隐藏恶意逻辑。","basis":"title"},{"id":"A#745","title":"Accio: Detecting Privilege Escalation Vulnerabilities in DBMSs via Minimum Privilege Set Calculation","authors":"Jingzhou Fu (Tsinghua University), Zongrui Peng (Tsinghua University), Jie Liang (Beihang University), Zhiyong Wu (Tsinghua University), Chi Zhang (Tsinghua University), Yu Jiang (Tsinghua University)","speaker":"Jingzhou Fu","s":"H3","pos":4,"sum":"数据库系统的权限提升漏洞检测：计算每个操作所需的最小权限集，与实际检查对比。","basis":"title"},{"id":"A#1581","title":"STMark: Watermarking Scalar and Textual Data Robustly Using Frequency Statistics","authors":"Jiongyang Ji (Xidian University), Yanguo Peng (Xidian University), Zhen Lv (Xi'an International Studies University), Gengquan Guo (Xidian University), Hui Li (Xidian University), Jiangtao Cui (Xidian University)","speaker":"","s":"H3","pos":5,"sum":"给数值型和文本型的结构化数据加鲁棒水印，基于频率统计量，目标是数据被增删改或采样后水印仍可检出。数据库水印方向。","basis":"title"},{"id":"B#762","title":"SkillScope: Toward Fine-Grained Least-Privilege Enforcement for Agent Skills","authors":"Jiangrong Wu (Sun Yat-sen University), Yuhong Nan (Sun Yat-sen University), Yixi Lin (Sun Yat-sen University), Huaijin Wang (Shandong University), Yuming Xiao (Sun Yat-sen University), Shuai Wang (The Hong Kong University of Science and Technology), Zibin Zheng (Sun Yat-sen University)","speaker":"Jiangrong Wu","s":"H3","pos":6,"sum":"Agent skills 的最小权限执行。现在一个 skill 往往拿到 agent 的全部权限；SkillScope 做细粒度限制，让每个 skill 只能访问完成其功能所需的资源。agent 安全的系统侧防御。","basis":"title"},{"id":"B#837","title":"Efficient Branch-and-Bound Testing and Verification of zkVMs","authors":"Hideaki Takahashi (Columbia University), ng's College London)","speaker":"Bhagya Wimalasiri","s":"H4","pos":4,"sum":"Google 宣布 2029 年完成后量子迁移，早于 NIST 的 2035 年。本文针对迁移期经典与后量子算法并存的现实，提出统一的密钥交换框架，覆盖混合模式。","basis":"abs"},{"id":"B#2078","title":"Dance with Noise: Safely Trade Minor Decryption Failures For More Compact KEMs with Applications to IKEv2","authors":"Zidi Zhuang (Institute of Software, Chinese Academy of Sciences), Yuyang Xiao (Institute of Software, Chinese Academy of Sciences), Long Chen (Institute of Software, Chinese Academy of Sciences), Qiang Tang (The University of Sydney), Zhenfeng Zhang (Institute of Software, Chinese Academy of Sciences)","speaker":"Zidi Zhuang","s":"H4","pos":5,"sum":"ML-KEM 的公钥和密文太大，常超过 UDP 协议的 MTU，导致 IP 分片。本文的思路是容忍略高一点的解密失败率来换取更紧凑的 KEM，并说明如何安全地做这一交换，应用到 IKEv2。","basis":"abs"},{"id":"B#2375","title":"Least-Privilege Methodology for Anamorphic Encryption with Randomness-Recovery Trapdoors","authors":"Xuan Thanh Do (Institute of Cryptography Science and Technology), Giuseppe Persiano (University of Salerno), Duong Hieu Phan (Telecom Paris, Institut Polytechnique de Paris), Moti Yung (Google LLC and Columbia University)","speaker":"Giuseppe Persiano","s":"H4","pos":6,"sum":"Anamorphic encryption 让用户在被强制交出密钥的情况下仍能隐蔽通信。本文研究带随机数恢复陷门的方案的最小权限设计。","basis":"title"},{"id":"B#2642","title":"Large-Universe (Multi-Authority) ABE from LWE","authors":"Pratish Datta (NTT Research), Yannis Rouselakis (NTT Research), Junichi Tomida (NTT Research), Nikhil Vanjani (Carnegie Mellon University)","speaker":"Yannis Rouselakis","s":"H4","pos":7,"sum":"基于 LWE 的 large-universe 属性基加密，属性全集为超多项式大小且 setup 时无需枚举，并扩展到多授权机构设定。纯公钥密码理论。","basis":"abs"},{"id":"B#7263","title":"FHEMIST: A Maximum Independent Set Technique for Efficient Bootstrapping Reductions in FHE Evaluations","authors":"Animesh Singh (Indian Institute of Technology, Kharagpur), Ayantika Chatterjee (Indian Institute of Technology, Kharagpur), Anupam Chattopadhyay (Nanyang Technological University), Debdeep Mukhopadhyay (Indian Institute of Technology, Kharagpur)","speaker":"","s":"H4","pos":8,"sum":"FHE 电路求值中减少 bootstrapping 次数的优化，建模为最大独立集问题。","basis":"title"},{"id":"A#1105","title":"Usability Compliance vs. Legal Compliance of Consent Withdrawal on the Web: An Expert Evaluation of 200 Websites","authors":"Sanju Ahuja (International Institute of Information Technology Bangalore), Gayatri Priyadarsini Kancherla (Indian Institute of Technology Gandhinagar), Cristiana Santos (Utrecht University), Nataliia Bielova (Inria), Abhishek Bichhawat (Indian Institute of Technology Gandhinagar)","speaker":"","s":"H5","pos":1,"sum":"网站撤回同意功能的可用性合规与法律合规对比，专家评估 200 个网站。GDPR 同意管理方向。","basis":"title"},{"id":"A#1160","title":"Designing an Automated Fact-Checking Pipeline for Recent Claims","authors":"Arshia Arya (University of California, San Diego), Gauthami Yenne (University of Illinois Urbana-Champaign), Deepak Kumar (University of California San Diego)","speaker":"Arshia Arya","s":"H5","pos":2,"sum":"面向新近声明的自动化事实核查流水线设计。","basis":"title"},{"id":"B#519","title":"Understanding Website Passkey Policies and User Communication","authors":"Karthik Ramakrishnan (Georgia Institute of Technology), Frank Li (Georgia Institute of Technology)","speaker":"Karthik Ramakrishnan","s":"H5","pos":3,"sum":"网站的 passkey 策略以及它们如何向用户解释 passkey，测量研究。","basis":"title"},{"id":"B#2210","title":"PrivAudit: A Dual-Lens Auditing Framework for Website Privacy Practices under the CCPA","authors":"Mohamed Moustafa Dawoud (University of California, Santa Cruz), Riya Aggarwal (University of California Santa Cruz), Likith Rahul Krishnamurthy (University of California Santa Cruz), Ram Sundara Raman (University of California Santa Cruz)","speaker":"Ramon Torres","s":"H5","pos":4,"sum":"按 CCPA 审计网站隐私实践的框架，“双视角”应指同时检查网站声明的政策和实际的数据流行为，找两者不一致之处。合规测量类。","basis":"title"},{"id":"B#2688","title":"'Tab, Tab, Bug': Security Pitfalls of Next Edit Suggestions in AI-Integrated IDEs","authors":"Yunlong Lyu (The University of Hong Kong), Yixuan Tang (McGill University), Peng Chen (Independent Researcher), Tian Dong (The University of Hong Kong), Xinyu Wang (Independent Researcher), Zhiqiang Dong (Independent Researcher), Hao Chen (The University of Hong Kong)","speaker":"Tian Dong","s":"H5","pos":5,"sum":"AI IDE 的 Next Edit Suggestions，就是一路按 Tab 的那种，的安全问题。NES 比传统补全多了复杂的上下文检索和跨文件修改，攻击面随之变大。本文系统分析 NES 机制，展示上下文可被投毒从而建议出不安全修改，并做了开发者调研。","basis":"abs"},{"id":"B#4003","title":"Does AI Amplify Online Hate? A Multi-Modal Measurement Study on 4chan's /pol/","authors":"Bo Shao (CISPA Helmholtz Center for Information Security), Xinyue Shen (CISPA Helmholtz Center for Information Security), Yang Zhang (CISPA Helmholtz Center for Information Security)","speaker":"Xinyue Shen","s":"H5","pos":6,"sum":"AI 生成内容是否放大了网络仇恨言论：对 4chan /pol/ 板块做图文多模态测量。社会计算与安全测量的交叉。","basis":"title"},{"id":"B#4843","title":"When Scammers Talk Back: Understanding Potentially Unwanted Calls via LLM-Based Interaction","authors":"Zhuoer Lyu (Arizona State University), Marzieh Bitaab (Amazon), Shuyi Huang (Arizona State University), Alireza Karimi (Arizona State University), William Robertson (Arizona State University), Zeming Yu (Arizona State University), Moritz Schloegel (CISPA Helmholtz Center for Information Security), Yan Shoshitaishvili (Arizona State University), Gail-Joon Ahn (Arizona State University), Ananta Soneji (University of Nebraska at Omaha), Ruoyu Wang (Arizona State University), Adam Doupé (Arizona State University), Tiffany Bao (Arizona State University)","speaker":"Moritz Schloegel","s":"H5","pos":7,"sum":"用 LLM 扮演接听者与骚扰或诈骗电话对话，从而大规模收集并分析这类电话的话术和运作方式。LLM 充当蜜罐的测量研究。","basis":"title"},{"id":"B#7270","title":"Learning Less While Asking More: How LLM-Based Assistance Shapes Vulnerability Learning","authors":"Baojuan Wang (Drexel University), Yifan Yao (Drexel University), Yue Zhang (Shandong University), Zhibo Eric Sun (Drexel University)","speaker":"Yue Zhang","s":"H5","pos":8,"sum":"LLM 辅助对漏洞学习的影响：学生问得更多、学到的却更少。用户研究，与周一 C5 场 AI tutor 那篇是同一主题的不同结论，可以对照。","basis":"title"},{"id":"A#922","title":"SpecStega: Provably Secure Linguistic Steganography Based on Speculative Sampling in Asymmetric Resource Scenarios","authors":"Jun Jiang (University of Science and Technology of China), Kejiang Chen (University of Science and Technology of China), Yuang Qi (University of Science and Technology of China), Jiawei Zhao (University of Science and Technology of China), Weiming Zhang (University of Science and Technology of China), Nenghai Yu (University of Science and Technology of China)","speaker":"Jun Jiang","s":"H6","pos":1,"sum":"可证安全的语言隐写：利用 speculative sampling 把秘密信息藏进 LLM 生成的文本，考虑收发双方算力不对等的场景。","basis":"title"},{"id":"A#1316","title":"DP4SQL: Differentially Private SQL with Flexible Privacy Policies","authors":"Andrew Cascio (Duke University), KinChin Tong (Binghamton University), Daniel Kifer (The Pennsylvania State University), Zeyu Ding (Binghamton University), Danfeng Zhang (Duke University)","speaker":"Andrew Cascio","s":"H6","pos":2,"sum":"差分隐私 SQL 系统，支持灵活的隐私策略，即不同表、不同列或不同用户可以有不同的保护单位和预算。DP 数据库系统方向，偏工程。","basis":"title"},{"id":"A#1899","title":"Secrets Everywhere: Auditing Memorization in Mobility Prediction Models","authors":"Anne Josiane Kouam (Inria & TU Berlin), Hristo Boyadzhiev (BIFOLD & TU Berlin), Konrad Rieck (BIFOLD & TU Berlin)","speaker":"Anne Josiane Kouam","s":"H6","pos":3,"sum":"人类移动预测模型（next-location prediction）的记忆化审计，首个系统性研究。语言模型的记忆化研究很多，轨迹数据的不同在于隐私风险存在于多个时空粒度。作者设计审计方法，量化模型在多大程度上记住并能吐出训练集里的个人轨迹。位置隐私方向。","basis":"abs"},{"id":"B#543","title":"LR-DSTC: Low-Rank Driven Secure Tensor Completion for Privacy-Preserving IoT Data Recovery","authors":"Jingya Huang (Hunan University), Xiaocan Li (Hunan University), Kun Xie (Hunan University), Jigang Wen (Hunan University of Science and Technology), Kenli Li (Hunan University), Gaogang Xie (Computer Network Information Center, CAS)","speaker":"JINGYA HUANG","s":"H6","pos":4,"sum":"隐私保护的 IoT 数据补全：用低秩张量补全恢复缺失的传感数据，计算过程在密态或安全计算下进行。","basis":"title"},{"id":"B#949","ti le":"iEnFlow: Endogenous Control-Flow Attacks via Conditional Branch Prediction on Apple Silicon","authors":"Kaiyuan Rong (Tsinghua University), Jiajie Chen (Tsinghua University), Junqi Fang (Tsinghua University), Peng Qu (Tsinghua University), Hanyin Liu (Harbin Institute of Technology), Youhui Zhang (Tsinghua University), Dapeng Ju (Tsinghua University), Dongsheng Wang (Tsinghua University)","speaker":"","s":"H7","pos":1,"sum":"Apple Silicon 上利用条件分支预测器实现的内生控制流攻击。","basis":"title"},{"id":"B#658","title":"DDRop: Active Memory Interposer Attacks on Confidential VMs by Dropping DDR5 Writes","authors":"Jesse De Meulemeester (KU Leuven), Stefan Gloor (ETH Zurich), Patrick Jattke (ETH Zurich), Daniel Moghimi (Google), David Oswald (Durham University), Martin Thompson (Durham University), Kaveh Razavi (ETH Zurich), Ingrid Verbauwhede (KU Leuven), Jo Van Bulck (KU Leuven)","speaker":"Jesse De Meulemeester","s":"H7","pos":2,"sum":"用主动式内存中介硬件丢弃 DDR5 写操作，攻击机密虚拟机。属于物理访问攻击，针对 SEV-SNP、TDX 这类保护。","basis":"title"},{"id":"B#864","title":"SLAC: Access-Driven CPU-to-GPU Side-channel Attacks via System-Level Cache on Apple Silicon","authors":"Tianhong Xu (Northeastern University), Saion Kumar Roy (Northeastern University), Ruyi Ding (Louisiana State University), A. Adam Ding (Northeastern University), Yunsi Fei (Northeastern University)","speaker":"Yunsi Fei","s":"H7","pos":3,"sum":"Apple Silicon 这类异构 SoC 上 CPU 和 GPU 共享系统级缓存。已有攻击要么只能利用粗粒度的缓存占用，要么要求攻击者和受害者同在 GPU 上。SLAC 实现从 CPU 侧对 GPU 的访问驱动型缓存侧信道，粒度更细。","basis":"abs"},{"id":"B#1241","title":"GPUThor: Amplifying Rowhammer Attacks via Non-Uniform Patterns to Exploit ECC-Protected GPUs","authors":"Chris S. Lin (University of Toronto), Joyce Qu (University of Toronto), Aditya Rajeev (University of Toronto), Gururaj Saileshwar (University of Toronto)","speaker":"Chris Lin","s":"H7","pos":4,"sum":"GPU 的 GDDR 显存也受 Rowhammer 影响，但已有攻击只能翻转几十到几百比特，远少于 CPU 侧。GPUThor 用非均匀的敲击模式把翻转数放大，足以攻破带 ECC 保护的 GPU。","basis":"abs"},{"id":"B#1253","title":"Trapped r Compromise","authors":"Matthew Green (Johns Hopkins University), Aditya Hegde (Johns Hopkins University), Dorian Liu (Johns Hopkins University)","speaker":"Dorian Liu","s":"I2","pos":8,"sum":"短验证码认证在验证方被攻破之后仍可审计的方案，借鉴 honeywords 的思路。","basis":"title"},{"id":"A#319","title":"Neurosymbolic Disassembly","authors":"Zhaoqi Xiao (University of California, Riverside), Yeqi Fu (National University of Singapore), Lambang Akbar Wijayadi (National University of Singapore), Zhenkai Liang (National University of Singapore), Heng Yin (University of California, Riverside)","speaker":"Zhaoqi Xiao","s":"I3","pos":1,"sum":"神经符号结合的反汇编：用学习模型处理歧义，用符号规则保证一致性。","basis":"title"},{"id":"A#2261","title":"Compiler Provenance as a Service: Decoupled Identification for Composite Provenance and Operational Resilience","authors":"Han Gao (Purdue University), Antonio Bianchi (Purdue University), Z. Berkay Celik (Purdue University), Dave (Jing) Tian (Purdue University)","speaker":"Han Gao","s":"I3","pos":2,"sum":"编译器溯源（识别二进制由哪个编译器、何种选项生成）做成服务，把识别各环节解耦。","basis":"title"},{"id":"A#3015","title":"Hieronym: Leveraging Hierarchical Multi-Source Information for Function Renaming in Stripped Binary","authors":"Xiaoling Zhang (Zhongguancun Laboratory), Jian Sun (Zhongguancun Laboratory), Dawei Wang (Zhongguancun Laboratory), Chongyu Wang (Zhongguancun Laboratory), Li Chen (Zhongguancun Laboratory), Zhaoteng Yan (Zhongguancun Laboratory), Peipei Liu (Zhongguancun Laboratory), Lixiao Zhang (Zhongguancun Laboratory), Dan Li (Tsinghua University)","speaker":"Xiaoling Zhang","s":"I3","pos":3,"sum":"去符号二进制的函数重命名，利用层次化的多源信息。","basis":"title"},{"id":"A#3086","title":"Forced Execution for Malware Protected by Commercial Virtualization Obfuscators","authors":"Yifei Zhan (Renmin University of China), Yukun Cui (Renmin University of China), Shuofeng Hao (Renmin University of China), Dongnan He (Renmin University of China), Wei You (Renmin University of China), Bin Liang (Renmin University of China), Jianjun Huang (R ge 构件。","basis":"title"},{"id":"B#210","title":"More Efficient Secret-Shared Joins with Multiplicity via Oblivious Sort Expansion","authors":"Xiaoxin Du (Nankai University), Xiaojie Guo (Shanghai Qi Zhi Institute), Pinzhi Chen (Nankai University), Tong Li (Nankai University), Zheli Liu (Nankai University)","speaker":"Xiaoxin Du","s":"I4","pos":6,"sum":"秘密共享下的数据库 join，支持重复键，基于不经意排序扩展。","basis":"title"},{"id":"B#2466","title":"Truffle: Maliciously Secure Three-Party Shuffles with Applications to Parsing","authors":"Nidhish Bhimrajka (Silence Laboratories), Yashvanth Kondi (Silence Laboratories), Daniel Noble (Silence Laboratories), Bhavish Raj Gopal (Indian Institute of Science)","speaker":"","s":"I4","pos":7,"sum":"恶意安全的三方 shuffle 协议，并应用到安全计算里的解析任务。","basis":"title"},{"id":"B#2958","title":"Simple and Concretely Efficient Hierarchical Doubly ORAM","authors":"Shun Takagi (LY Corporation), Marin Matsumoto (LY Corporation), Satoshi Hasegawa (LY Corporation)","speaker":"Shun Takagi","s":"I4","pos":8,"sum":"简单且具体高效的层次式 doubly-oblivious ORAM，客户端自身的访问也不泄露，适合放进 TEE。","basis":"title"},{"id":"A#3","title":"Exploring the Exposure of IPv6 End-Host Networks","authors":"Hugo Hue (Georgia Institute of Technology), Abhishek Bhaskar (Georgia Institute of Technology), Amanda Hsu (Georgia Institute of Technology), Paul Pearce (University of California, Irvine), Frank Li (Georgia Institute of Technology)","speaker":"Hugo Hue","s":"I5","pos":1,"sum":"IPv6 终端主机网络的暴露面测量。IPv6 没有 NAT 的天然遮挡，终端设备可能直接可达。Georgia Tech Frank Li 组。","basis":"title"},{"id":"A#855","title":"The Rise and Fall of Google's Privacy Sandbox","authors":"Rachid Youssef Grib (Politecnico di Torino), Alberto Verna (Politecnico di Torino), Nikhil Jha (Politecnico di Torino), Martino Trevisan (University of Trieste), Marco Mellia (Politecnico di Torino)","speaker":"Alberto Verna","s":"I5","pos":2,"sum":"Google Privacy Sandbox 兴衰的回顾性测量：这套用来替代第三方 cookie 的 API 从推出、被采用到被放弃的全过程。Web 隐私方向的标志性事件，有引用价值。","basis":"title"},{"id":"A#1997", rbana-Champaign)","speaker":"","s":"I6","pos":4,"sum":"移动端第三方库（SDK）开发者的隐私合规意识与实践调查。合规责任常落在应用开发者头上，SDK 开发者一侧此前研究很少。","basis":"title"},{"id":"B#193","title":"Understanding the Privacy-Preserving Potential of HTTP/2 Against Webpage Fingerprinting","authors":"Bogdan Constantin Cebere (CISPA Helmholtz Center for Information Security), Prateek Kumar (CISPA Helmholtz Center for Information Security), Sylvain Chatel (CISPA Helmholtz Center for Information Security), Wouter Lueks (CISPA Helmholtz Center for Information Security), Christian Rossow (CISPA Helmholtz Center for Information Security)","speaker":"Bogdan Cebere","s":"I6","pos":5,"sum":"HTTP/2 的多路复用等特性对 webpage fingerprinting 有多少天然的防护作用。流量分析方向的评估型工作。","basis":"title"},{"id":"B#750","title":"Large-Scale Measurement and Real-World Mitigation of Web Browser Fingerprinting in the Wild","authors":"Tom Ritter (Mozilla Corporation), Fatih Kilic (University of Toronto), Frederik Braun (Mozilla Corporation), Elisa Luo (UC San Diego), Geoffrey M. Voelker (UC San Diego), Stefan Savage (UC San Diego), Christoph Kerschbaumer (Mozilla Corporation)","speaker":"Tom Ritter","s":"I6","pos":6,"sum":"浏览器指纹的大规模在野测量，加上真实部署的缓解方案。作者应来自浏览器厂商或与其合作。","basis":"title"},{"id":"B#2903","title":"Brewing Under Pressure: More Realistic Tor Flow Correlation Considering Low FPRs","authors":"Haeseung Jeon (Ewha Womans University), Yeonseo Cho (Ewha Womans University), Nate Mathews (Rochester Institute of Technology), Rob Jansen (U.S. Naval Research Laboratory), Marc Juarez (University of Edinburgh), Se Eun Oh (Ewha Womans University)","speaker":"Catherine Jeon","s":"I6","pos":7,"sum":"Tor 流关联攻击的更现实评估，重点是在极低假阳性率下还能关联出多少。此前的 DeepCorr 一类结果在低 FPR 下可能被高估。","basis":"title"},{"id":"B#3360","title":"On the Privacy Risks Caused by Images in Academic Papers","authors":"Sze Yiu Chau (Simon Fraser University), Jianyu Lu (The Chinese University of Hong Kong), Kin Man Leung (University Canada West), Chi Fung Kwan (The Hong Kong Polytechnic University), Che Wei Tu (The Chinese University of Hong Kong), Tsz Ching Tsang (The Chinese University of Hong Kong), Xinzhong Zhang (The University of Hong Kong), Yee Chiu Chen (The Chinese University of Hong Kong), Zirui Kong (The Hong Kong Polytechnic University), Youqian Zhang (The Hong Kong Polytechnic University)","speaker":"","s":"I6","pos":8,"sum":"学术论文里的图片带来的隐私风险：截图、照片、示例图中残留的个人信息或元数据。写论文的人都该看一眼。","basis":"title"},{"id":"A#178","title":"Resilient Alerting Protocols for Blockchains","authors":"Marwa Mouallem (Technion), Lorenz Breidenbach (Chainlink Labs), Ittay Eyal (Technion), Ari Juels (Chainlink Labs)","speaker":"Marwa Mouallem","s":"I8","pos":1,"sum":"区块链的韧性告警协议：出现安全事件时可靠地通知到各方。","basis":"title"},{"id":"A#602","title":"Censorship Resistance vs Throughput in Multi-Proposer BFT Protocols","authors":"Fatima Elsheimy (Yale University), Ioannis Kaklamanis (Yale University), Charalampos Papamanthou (Yale University), Sarisht Wadhwa (Duke University), Fan Zhang (Yale University)","speaker":"Ioannis Kaklamanis","s":"I8","pos":2,"sum":"多提议者 BFT 协议里抗审查性与吞吐量之间的权衡分析。","basis":"title"},{"id":"A#2144","title":"Universally Composable Adaptor Signatures","authors":"Paul Gerhart (TU Wien), Daniel Rausch (University of Stuttgart), Dominique Schroeder (TU Wien)","speaker":"","s":"I8","pos":3,"sum":"Adaptor signature 的通用可组合（UC）安全定义与构造。支付通道和原子交换的基础构件。","basis":"title"},{"id":"A#2273","title":"Insecurity Through Obscurity: Veiled Vulnerabilities in Closed-Source Contracts","authors":"Sen Yang (Yale University), Kaihua Qin (University of Warwick), Aviv Yaish (Yale University), Fan Zhang (Yale University)","speaker":"Sen Yang","s":"I8","pos":4,"sum":"很多智能合约闭源并带有混淆，想借此隐藏逻辑、吓阻攻击。本文证明这种“隐晦即安全”无效：混淆后的闭源合约里的漏洞依然可被自动发现和利用，并给出实测。","basis":"abs"},{"id":"B#315","title":"Mind the Gap: Detecting Description-Execution Mismatch Attacks in DAO Governance","authors":"Bowen Cai (University of Minnesota), Nanzi Yang (Old Dominion University), Weiheng Bai (University of Minnesota), Youshui Lu (Xi'an Jiaotong University), Yajin Zhou (The Chinese University of Hong Kong), Kangjie Lu (University of Minnesota)","speaker":"Bowen Cai","s":"I8","pos":5,"sum":"DAO 治理攻击：提案的文字描述与实际执行的代码不一致。本文自动检测这种不匹配。","basis":"title"},{"id":"B#591","title":"Ark: Offchain Transaction Batching in Bitcoin","authors":"Pim Keer (TU Wien), Matteo Maffei (TU Wien), Marco Argentieri (Ark Labs), Andrew Camilleri (Ark Labs), Zeta Avarikioti (TU Wien)","speaker":"Pim Keer","s":"I8","pos":6,"sum":"比特币的可扩展性受限于每笔交易都要上链。闪电网络等 Layer-2 方案部署门槛高。Ark 是另一种链下方案：由服务方把多笔链下交易批量合并上链，用户不需要预先开通道和准备入账流动性。","basis":"abs"},{"id":"B#3767","title":"Neon-HTLC: Collateral-Free HTLCs with Logarithmic Timeout","authors":"Sebastian Faust (Technische Universität Darmstadt), Noemi Glaeser (Technische Universität Darmstadt), Marius Hagemann (Technische Universität Darmstadt), Ziyan Qu (Technische Universität Darmstadt)","speaker":"Ziyan Qu","s":"I8","pos":7,"sum":"不需要抵押、超时时间为对数级的 HTLC，支付通道网络的改进。","basis":"title"},{"id":"B#4391","title":"The MEV Trilemma","authors":"Mingzhe Zheng (The Hong Kong University of Science and Technology (Guangzhou))","speaker":"","s":"I8","pos":8,"sum":"MEV 缓解方案的三难困境，标题称 trilemma，应是论证三个目标不可兼得。","basis":"title"},{"id":"Keynote 1","title":"Cassandra No Longer? Privacy in a Quantum World","authors":"Gilles Brassard (Université de Montréal)","speaker":"Gilles Brassard","sum":"图灵奖得主的 Turing Lecture。他从 1994 年起警告量子计算会摧毁 RSA，像 Cassandra 一样没人信；现在大家信了，他又发出新的警告：后量子密码的安全性没有数学证明，比当年信任因数分解更接近一厢情愿，盲目押注 PQC 不明智。另一个要点是 harvest now, decrypt later：今天录下的密文将来都能解开，过去已经救不回来。他给的出路是量子密码。全文会发在 CACM。","basis":"abs","s":"K1","pos":1},{"id":"Keynote 2","title":"AI Agentic Security: Safeguarding the Next Generation of Autonomous Systems","authors":"Elisa Bertino (Purdue University)","speaker":"Elisa Bertino","sum":"Agentic AI 的安全综述式报告。先梳理 agent 特有的风险：prompt 与 goal injection、工具和环境操纵、多 agent 串通、供应链漏洞，参照 OWASP Agentic AI 威胁模型。再讲最小权限、纵深防御、complete mediation 这些经典原则怎么搬到 agent 系统，以 AgentSandbox 架构为例：ephemeral agents、上下文最小化、策略驱动的交互控制。最后是开放问题：行为的形式化保证、多 agent 生态、身份与问责。和 F1、G9、H3 场里的 agent 论文是同一条线。","basis":"abs","s":"K2","pos":1},{"id":"YSDP 1","title":"How to Ruin a Good Story","authors":"Asia Slowinska","speaker":"Asia Slowinska","sum":"YSDP 特邀报告，主题是论文写作与讲故事。今年 YSDP 的主题是 AI 时代如何有操守地做研究。官网没有摘要。","basis":"title","s":"Y1","pos":1},{"id":"YSDP Panel","title":"The Role of AI in Research and Peer Review","authors":"YSDP panel","speaker":"","sum":"YSDP 的核心环节：AI 在日常科研里的角色，写作和审稿两头都谈。和 F1 场那篇防审稿人把审稿外包给 chatbot 的 IntraGuard 是同一个话题。官网没列嘉宾名单。","basis":"title","s":"Y2","pos":1},{"id":"YSDP 2","title":"Five Ways AI Can Derail Your Research (and How to Tame It)","authors":"Gianluca Stringhini","speaker":"Gianluca Stringhini","sum":"YSDP 特邀报告：AI 会以哪五种方式把研究带偏，以及怎么管住它。官网没有摘要。","basis":"title","s":"Y3","pos":1},{"id":"Opening","title":"Opening","authors":"","speaker":"","s":"EV1","pos":1,"sum":"开幕式。官网没有列出房间，以现场指示为准。","sumEn":"Opening session. The official site does not list a room; follow the signs on site.","basis":"ev"},{"id":"Reception","title":"Reception, Poster & Demo Session","authors":"","speaker":"","s":"EV2","pos":1,"sum":"招待会，同时是 Poster 与 Demo 环节。","sumEn":"Reception together with the poster and demo session.","basis":"ev"},{"id":"Business Meeting","title":"SIGSAC Business Meeting","authors":"","speaker":"","s":"EV3","pos":1,"sum":"SIGSAC 业务会议。","sumEn":"SIGSAC business meeting.","basis":"ev"},{"id":"Banquet","title":"Banquet","authors":"","speaker":"","s":"EV4","pos":1,"sum":"晚宴在 Amrath Kurhaus Scheveningen，离会场 World Forum 2.5 公里。19:15 开始，颁奖 20:30。18:00 起有大巴从 World Forum 出发，22:00 返回。","sumEn":"At Amrath Kurhaus Scheveningen, 2.5 km from World Forum. Dinner starts at 19:15, award ceremony at 20:30. Coaches leave World Forum from 18:00 and return at 22:00.","basis":"ev"},{"id":"Closing","title":"Closing","authors":"","speaker":"","s":"EV5","pos":1,"sum":"闭幕，约 10 到 15 分钟。","sumEn":"Closing, about 10 to 15 minutes.","basis":"ev"}]};
